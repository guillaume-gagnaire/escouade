<!doctype html>
<!-- `lang` follows the language of the interface: `setLang` (src/lib/i18n) writes it. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Escouade</title>
    <!-- Tauri gives this style the page's nonce at each load: the styles the interface creates carry it too
         (src/lib/style-nonce.ts); a `<style>` without it is not applied (src-tauri/tauri.conf.json, audit SEC-05). -->
    <style id="escouade-style-nonce"></style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- What's up ? : the window of the release's news, once per user after an update (.whatsup/config.json).
         After main.ts: the `<style>` it creates gets the page's nonce (lib/style-nonce.ts). In a template: main.ts puts
         it in the page once the settings' language is known, its `src` and `lang` that language's (lib/whats-up.ts). -->
    <script type="module" src="/whats-up/whats-up.js"></script>
    <template id="whats-up"
      ><whats-up
        src="/whats-up/"
        app="Escouade"
        lang="fr"
        theme-sombre="[data-theme='dark']"
        style="
          --wu-fond: var(--raise);
          --wu-texte: var(--text);
          --wu-accent: var(--brand);
          --wu-doux: var(--muted);
          --wu-bord: var(--line-2);
          --wu-rayon: 10px;
          --wu-police: 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif;
        "
      ></whats-up
    ></template>
  </body>
</html>
