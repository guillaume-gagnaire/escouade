<!doctype html>
<!-- `lang` follows the language of the interface: `setLang` (src/lib/i18n) writes it. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No Referer to the sites it links to or loads from, whatever the window's origin (ESC-654). -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Escouade</title>
    <!-- Tauri gives this style the page's nonce at each load: the styles the interface creates carry it too
         (src/lib/style-nonce.ts); a `<style>` without it is not applied (src-tauri/tauri.conf.json, audit SEC-05). -->
    <style id="escouade-style-nonce"></style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
