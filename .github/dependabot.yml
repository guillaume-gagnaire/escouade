# The updates of the dependencies (SEC-02 of the security audit of 2026-11, ESC-422; calmed by ESC-427). Monthly, two pull requests
# open at most per ecosystem: one for the minor and patch updates, grouped, and one for the major updates, grouped apart (a
# major one breaks something more often, it is read on its own). The advisories themselves are told by
# .github/workflows/advisories.yml. The CI of such a pull request runs only the light jobs (see ci.yml). The third-party
# actions of the workflows are pinned by commit (uses: owner/action@<sha> # vX.Y.Z): Dependabot proposes the new commit and
# its version in the comment (SEC-10).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo-app:
        update-types: [minor, patch]
        patterns: ['*']
      cargo-app-major:
        update-types: [major]
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: /plugins
    schedule:
      interval: monthly
    groups:
      cargo-plugins:
        update-types: [minor, patch]
        patterns: ['*']
      cargo-plugins-major:
        update-types: [major]
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-app:
        update-types: [minor, patch]
        patterns: ['*']
      npm-app-major:
        update-types: [major]
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /store
    schedule:
      interval: monthly
    groups:
      npm-store:
        update-types: [minor, patch]
        patterns: ['*']
      npm-store-major:
        update-types: [major]
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    groups:
      npm-website:
        update-types: [minor, patch]
        patterns: ['*']
      npm-website-major:
        update-types: [major]
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        update-types: [minor, patch]
        patterns: ['*']
      github-actions-major:
        update-types: [major]
        patterns: ['*']
    open-pull-requests-limit: 2
