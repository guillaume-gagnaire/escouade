# The plugins' SDK on npm (PLG-9, ESC-181): @escouade-dev/plugin and create-escouade-plugin, each staged when the
# version of its package.json is not on npm yet. Raising a version on main stages it; « Run workflow » stages what is
# missing.
#
# Trusted publishing (OIDC): no npm token in the repository. Each package trusts this workflow on npmjs.com (Settings ›
# Trusted publisher: GitHub Actions, guillaume-gagnaire/escouade, sdk-publish.yml, environment npm), for « npm stage
# publish » only: a version waits in Staged Packages until a maintainer approves it there, or by `npm stage approve
# <id>`, with their 2FA (approve the SDK before the template, which depends on it). A package's very first version is
# published by hand, as npm asks: the trust is set on an existing package. Each version carries its provenance (the
# commit and this workflow), as npm makes it for a trusted publisher.
name: SDK on npm

on:
  push:
    branches: [main]
    paths:
      - 'sdk/plugin/package.json'
      - 'sdk/create-escouade-plugin/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    # The OIDC token of the trusted publishing, for this job alone.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm stage` comes with npm 11.15.0, after the one of Node 24.
      - run: npm install -g npm@^11.15.0

      - run: npm ci

      # The SDK first: a new plugin's template depends on its version. `prepack` checks the generated types against
      # the schemas and builds dist/ before anything leaves.
      - name: Stage the versions not on npm yet
        run: |
          for dir in sdk/plugin sdk/create-escouade-plugin; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm already"
            else
              (cd "$dir" && npm stage publish --access public)
            fi
          done
