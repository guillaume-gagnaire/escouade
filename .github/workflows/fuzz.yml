name: Fuzzing

# The long pass of the fuzzing of the team server and its client (TS-18, ESC-519; the short one is the job `fuzz` of
# ci.yml): each target of fuzz/ on a runner of its own, half an hour by default, every Sunday night, or by hand
# (« Run workflow ») for as long as asked. Each starts from its committed seeds (fuzz/seeds/<target>). What it finds is
# kept as an artifact (the input, to play again with `cargo fuzz run --fuzz-dir fuzz <target> <file>`), and the corpus
# it grew too, to minimise and add to the seeds by hand when it reaches new paths. No secret. The weekly run is only in
# guillaume-gagnaire/escouade: a copy runs it by hand, not on a schedule it would pay.
on:
  schedule:
    - cron: '23 2 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '1800'
      targets:
        description: The targets (space-separated); empty for all
        default: ''

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targets:
    name: The targets
    if: github.event_name != 'schedule' || github.repository == 'guillaume-gagnaire/escouade'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        env:
          ASKED: ${{ github.event.inputs.targets }}
        run: |
          if [ -n "$ASKED" ]; then names="$ASKED"; else names=$(ls fuzz/fuzz_targets | sed 's/\.rs$//'); fi
          echo "list=$(printf '%s\n' $names | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzzing (${{ matrix.target }})
    if: github.event_name != 'schedule' || github.repository == 'guillaume-gagnaire/escouade'
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust nightly (pinned in fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz@0.13.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - name: Fuzzing
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '1800' }}
          TARGET: ${{ matrix.target }}
        run: sh scripts/fuzz.sh "$SECONDS_PER_TARGET" "$TARGET"

      - name: Upload what the fuzzing found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the corpus it grew
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
