name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run again on demand, to measure how unstable the tests are (scripts/ci-flakes.mjs reads the runs).
  workflow_dispatch:

# A read-only token for every job; only the one that reads a pull request's file list (paths-filter) asks for more.
permissions:
  contents: read

concurrency:
  # A run started by hand has a group of its own: neither a push nor another run replaces it.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

# The jobs run side by side (the run took 42 min one after the other, at 1.8.4): the frontend's checks once, on Linux;
# Windows builds its Rust tests (a nextest archive) and the app once, then runs the tests in 2 parts and the end-to-end
# tests in 5, each part on a runner of its own; macOS builds its Rust tests once too and runs them in 3 parts, beside
# its bundle, Clippy and the webview probe; Linux the same, in 2 parts, beside Clippy, its packages and its plugins. A
# public repository's runners cost nothing. On 2026-11-10 the run took 42 to 60 min, the macOS tests on one runner its
# longest job (ESC-406's push).
# The pull requests of Dependabot (dependabot.yml) run only the light jobs (ESC-427): the frontend, the store, escouade-js, the
# plugin kit, Clippy (Linux, and Windows's with its format) and the Linux build and tests. No macOS job and no Windows
# build, test or end-to-end job (the macOS ones took up to 45 min), which the dependency updates held for
# hours (2026-11-12: six pull requests at once starved the runners main needs). The rule: `if: github.actor != 'dependabot[bot]'`
# on the three heavy roots (windows-build, macos-build, macos-bundle); the jobs that need them are skipped with them. A
# human who has read the pull request runs the whole CI by pushing its branch under their name or with « Run workflow »
# (workflow_dispatch), whose actor is the human.

# The end-to-end specs that run again with the window on the remote API of the core (ESC-495): the part « remote API »
# of windows-e2e.
env:
  REMOTE_E2E: tests/e2e/app.spec.ts tests/e2e/conversation.spec.ts tests/e2e/terminal-height.spec.ts tests/e2e/kanban-pr.spec.ts tests/e2e/mcp.spec.ts tests/e2e/remote-cut.spec.ts

jobs:
  front:
    name: Frontend (format, types, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The phone's app (apps/mobile, MO-1): its Capacitor packages, which its types and its Vitest tests read.
      - name: Install the phone app's dependencies
        run: npm ci --prefix apps/mobile --no-audit --no-fund

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Frontend tests (Vitest)
        run: npm test

      # The plugins' SDK builds (its generated types are checked against the schemas by Vitest).
      - name: Plugin SDK types (tsc)
        run: npx tsc -p sdk/plugin/tsconfig.json --noEmit

  # The store (store/, docs/STORE.md §1.5): a push on main that touches it redeploys it on Coolify, so what enters
  # main has passed here. The filter skips it when only the app changes; a skipped job counts as passed.
  store-changes:
    name: Store (what changed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      store: ${{ steps.filter.outputs.store }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            store:
              - 'store/**'
              - 'schemas/**'
              - 'plugins/**'
              - 'website/app/assets/main.css'
              - 'design/store/**'
              - '.github/workflows/ci.yml'
              - 'crates/escouade-plugin-cli/**'
              - 'src-tauri/escouade-js/**'
              - 'src-tauri/Cargo.lock'
              - 'scripts/escouade-js.sh'

  store:
    name: Store (format, types, tests, e2e, image)
    needs: [store-changes, escouade-js]
    if: needs.store-changes.outputs.store == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The migrations are played from an empty base, then the tests run against it: PostgreSQL 17, as Coolify's.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The tests that empty a base read TEST_DATABASE_URL alone; the built server of the end-to-end tests, DATABASE_URL.
    env:
      TEST_DATABASE_URL: postgres://store:store@localhost:5432/store
      DATABASE_URL: postgres://store:store@localhost:5432/store
    defaults:
      run:
        working-directory: store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: store/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck (nuxi typecheck)
        run: npm run typecheck

      # The unit tests, then the database's: the migrations from an empty base, the queue.
      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      # Its apt reaches Ubuntu's mirrors (scripts/linux-deps.sh: public resolvers when the runner's fail).
      - name: Chromium for Playwright
        run: |
          sh ../scripts/linux-deps.sh dns
          npx playwright install --with-deps chromium

      # The built server (node .output/server/index.mjs) on the same base: the pages in both languages and themes,
      # compared to the preview (design/store/), and /api/health.
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-playwright-report
          path: store/playwright-report
          retention-days: 7

      # Coolify builds this image (its own tests run in the build): it must build here first. Not pushed.
      - name: Docker image
        working-directory: .
        run: docker build -f store/Dockerfile -t escouade-store:ci .

      # Its compiler answers, a run.js plugin compiles in it twice to the same bytes, with the escouade-js the app embeds,
      # and the store starts and says the isolation it got (ESC-328).
      - name: Download escouade-js
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: escouade-js
          path: src-tauri/escouade-js/target

      # A run.wasm compiles in bubblewrap (ESC-336), which Docker's default profiles refuse: image-test.mjs gives it the two
      # of store/deploy (ESC-356, docs/STORE.md §3.3), and an AppArmor profile is loaded on the host. The runner keeps
      # Ubuntu 24.04's restriction of user namespaces, as a server would: a named profile does not need it lifted.
      - name: The compiler in the image
        working-directory: .
        env:
          IMAGE_TEST_DATABASE_URL: postgres://store:store@localhost:5432/store
        run: |
          sudo apparmor_parser -r store/deploy/apparmor-bubblewrap
          node store/scripts/image-test.mjs escouade-store:ci src-tauri/escouade-js/target/escouade-js.wasm.sha256

  # The phone's Rust (crates/escouade-mobile, MO-3, docs/MOBILE.md) and its Capacitor plugin (apps/mobile-plugin): a
  # package of its own (its lock, its toolchain), out of the app's jobs, built only when it, the plugin or their scripts
  # change; a skipped job counts as passed. Linux runs its tests (the machine's side, with a WireGuard peer of test) and
  # builds Android's libraries and the plugin's AAR; a Mac builds the XCFramework and the plugin's Swift package for the
  # simulator. Nothing is signed: the artifacts are there to be looked at, never published.
  mobile-changes:
    name: Mobile (what changed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mobile:
              - 'crates/escouade-mobile/**'
              - 'apps/mobile-plugin/**'
              - 'scripts/mobile-android.sh'
              - 'scripts/mobile-ios.sh'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            app:
              - 'apps/mobile/**'
              - 'apps/mobile-plugin/**'
              - 'crates/escouade-mobile/**'
              - 'scripts/mobile-android.sh'
              - 'scripts/mobile-ios.sh'
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  mobile-android:
    name: Mobile (Rust tests, Android build)
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: crates/escouade-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-plugin/package-lock.json

      - name: Rust toolchain (pinned in crates/escouade-mobile/rust-toolchain.toml)
        run: rustup toolchain install && rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/escouade-mobile

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest,cargo-deny@0.20.2,cargo-ndk@4.1.2

      # The runner's NDK (ANDROID_NDK_LATEST_HOME) and Java 21 (Capacitor 8's), and Gradle 8.14.3, checked against its
      # published SHA-256, for the plugin's AAR.
      - name: NDK, Java and Gradle
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          echo "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE=$RUNNER_TEMP/gradle-8.14.3/bin/gradle" >> "$GITHUB_ENV"

      # The machine, without the tunnel (what the core will take to seal, MO-6), and Android's two ABIs (ring's C wants
      # the NDK's compiler, hence cargo ndk).
      - name: Format and Clippy
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo ndk -P 26 -t arm64-v8a -t x86_64 clippy --locked --all-targets --features uniffi -- -D warnings

      - name: Tests (nextest)
        run: cargo nextest run --locked --all-features --no-fail-fast

      # With the generator of the bindings (--all-features): its licenses too.
      - name: cargo deny
        run: cargo deny --locked --all-features check

      - name: Android libraries, Kotlin bindings and the plugin's AAR (unsigned)
        working-directory: .
        run: bash scripts/mobile-android.sh --aar

      - name: The plugin's TypeScript API
        working-directory: apps/mobile-plugin
        run: npx tsc -p tsconfig.json --noEmit

      - name: Upload the plugin's AAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-plugin-android
          path: apps/mobile-plugin/android/build/outputs/aar/
          retention-days: 7

  mobile-ios:
    name: Mobile (iOS build)
    needs: mobile-changes
    # Not for Dependabot's pull requests (see the rule above `jobs:`).
    if: needs.mobile-changes.outputs.mobile == 'true' && github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: crates/escouade-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned in crates/escouade-mobile/rust-toolchain.toml)
        run: rustup toolchain install && rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/escouade-mobile
          shared-key: mobile-ios

      - name: Clippy for iOS (the device and the simulator)
        run: |
          cargo clippy --locked --features uniffi --target aarch64-apple-ios -- -D warnings
          cargo clippy --locked --features uniffi --target aarch64-apple-ios-sim -- -D warnings

      # The XCFramework, the Swift bindings, then the plugin's Swift package (Capacitor by SwiftPM) for the simulator.
      - name: XCFramework, Swift bindings and the plugin (unsigned)
        working-directory: .
        run: bash scripts/mobile-ios.sh --build

      - name: Upload the XCFramework and its Swift bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-plugin-ios
          path: |
            apps/mobile-plugin/ios/escouade_mobileFFI.xcframework
            apps/mobile-plugin/ios/Sources/EscouadeMobileCore
          retention-days: 7

  # The phone's app (apps/mobile, MO-1, docs/MOBILE.md): Capacitor 8 around the app's Svelte interface (src/, shared),
  # built when it or the shared interface changes. Linux builds the APK and the AAB (release, R8, unsigned); a Mac
  # builds the app for the simulator (unsigned). No key, no account: the artifacts are there to be looked at, never
  # published (MO-8 signs and publishes). Its e2e (apps/mobile/e2e, at 360 × 780 and 430 × 932 against an
  # escouade-server) and its Vitest tests run with the app's (the frontend job; the e2e on the machine of the ticket).
  mobile-app-android:
    name: Mobile app (APK and AAB, unsigned)
    needs: mobile-changes
    if: needs.mobile-changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      # Svelte, Vite and the fonts are the repository's; Capacitor's packages the app's own.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/mobile --no-audit --no-fund

      # The app's native side (MO-4): the plugin (apps/mobile-plugin) and its Rust, built into it before Gradle.
      - name: Rust toolchain (pinned in crates/escouade-mobile/rust-toolchain.toml)
        working-directory: crates/escouade-mobile
        run: rustup toolchain install && rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/escouade-mobile

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-ndk@4.1.2

      - name: The plugin's Android libraries and Kotlin bindings
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash scripts/mobile-android.sh

      # Java 21 (Capacitor 8's), the runner's Android SDK; the Gradle wrapper checks its distribution's SHA-256.
      - name: The page, then the Android project
        working-directory: apps/mobile
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          node ../../node_modules/vite/bin/vite.js build
          npx cap sync android

      - name: APK and AAB (release, R8, unsigned)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease bundleRelease
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/out/escouade-mobile-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/escouade-mobile-unsigned.aab"
          # Unsigned: no signature in either (`!` would not fail the step under `bash -e`: an `if`).
          for f in "$RUNNER_TEMP"/out/*; do
            if unzip -l "$f" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)$'; then echo "signed: $f"; exit 1; fi
          done
          ls -l "$RUNNER_TEMP/out"

      - name: Upload the APK and the AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-app-android
          path: ${{ runner.temp }}/out/
          retention-days: 7

  mobile-app-ios:
    name: Mobile app (iOS simulator, unsigned)
    needs: mobile-changes
    # Not for Dependabot's pull requests (see the rule above `jobs:`).
    if: needs.mobile-changes.outputs.app == 'true' && github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/mobile --no-audit --no-fund

      # The app's native side (MO-4): the plugin's XCFramework and Swift bindings, before Xcode.
      - name: Rust toolchain (pinned in crates/escouade-mobile/rust-toolchain.toml)
        working-directory: crates/escouade-mobile
        run: rustup toolchain install && rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/escouade-mobile
          shared-key: mobile-ios

      - name: The plugin's XCFramework and Swift bindings
        run: bash scripts/mobile-ios.sh

      - name: The page, then the iOS project
        working-directory: apps/mobile
        run: |
          node ../../node_modules/vite/bin/vite.js build
          npx cap sync ios

      # Capacitor by SwiftPM (no CocoaPods); for the simulator, without signing. ARCHS=arm64: a Release build for the
      # generic simulator would also link x86_64, and the plugin's XCFramework has only the arm64 simulator slice
      # (aarch64-apple-ios-sim, scripts/mobile-ios.sh): its libescouade_mobile.a would be ignored and the link fail.
      - name: The app for the simulator (unsigned)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build -quiet
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name 'App.app' -path '*Release-iphonesimulator*' | head -1)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/out/escouade-mobile-simulator.zip"
          ls -l "$RUNNER_TEMP/out"

      - name: Upload the app for the simulator
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-app-ios-simulator
          path: ${{ runner.temp }}/out/
          retention-days: 7

  # escouade-js, the Javy plugin of the run.js plugins (ESC-320, docs/PLUGINS-DESIGN.md §5): built once for wasm32-wasip1 with the
  # pinned Javy (scripts/escouade-js.sh), its SHA-256 noted, then handed to every job that builds the app, which embeds it.
  escouade-js:
    name: escouade-js (the JS/TS plugins' engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned in src-tauri/escouade-js/rust-toolchain.toml) and wasm32-wasip1
        working-directory: src-tauri/escouade-js
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri/escouade-js
          # The script decides what rustc is given (its wrapper is no input cargo sees): a cache made by another one would hand
          # back a module with this machine's paths, and the store's image would embed another escouade-js.
          key: ${{ hashFiles('scripts/escouade-js.sh') }}

      - name: Build escouade-js
        run: |
          sh scripts/escouade-js.sh
          echo "escouade-js.wasm: $(wc -c < src-tauri/escouade-js/target/escouade-js.wasm) bytes, SHA-256 $(cat src-tauri/escouade-js/target/escouade-js.wasm.sha256)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escouade-js
          path: |
            src-tauri/escouade-js/target/escouade-js.wasm
            src-tauri/escouade-js/target/escouade-js.wasm.sha256
          retention-days: 7

  # The kit of the plugins in Rust as modules (ESC-334, docs/PLUGINS-DESIGN.md §8.10, A4): these crates compile for wasm32-wasip1, the
  # toolchain's file brings the target; Linear and Codex, compiled from their crates, prove it. What A9 will publish stays
  # publishable.
  plugin-kit-wasm:
    name: Plugin kit (wasm32-wasip1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Clippy for wasm32-wasip1
        working-directory: src-tauri
        run: cargo clippy --locked --target wasm32-wasip1 -p escouade-plugin-protocol -p escouade-plugin-kit -p escouade-acp -p escouade-voice -- -D warnings

      # The workspace of plugins/: the plugins in run.wasm, which that of src-tauri does not hold.
      - name: The modules' workspace, formatted and without warnings
        working-directory: plugins
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --target wasm32-wasip1 -- -D warnings

      - name: The modules
        run: sh scripts/plugins-wasm.sh

      - name: The examples and the documentation of the crates of crates.io
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo test --doc --locked -p escouade-plugin-protocol -p escouade-plugin-kit -p escouade-acp -p escouade-voice
          cargo doc --no-deps --locked -p escouade-plugin-protocol -p escouade-plugin-kit -p escouade-acp -p escouade-voice
          cargo doc --no-deps --locked --target wasm32-wasip1 -p escouade-plugin-protocol -p escouade-plugin-kit -p escouade-acp -p escouade-voice

      # The dry run verifies each crate against the others packaged in a registry of its own, unpacked under
      # ~/.cargo/registry/{src,cache}/-<hash>. The Rust cache restores them, and cargo does not unpack a version again:
      # a crate changed under the same unpublished version (0.1.4 of the protocol, 2026-11-20) would be verified against
      # its old copy. They go before each run.
      - name: The crates of crates.io can be published (a dry run)
        working-directory: src-tauri
        run: |
          rm -rf -- "$HOME"/.cargo/registry/src/-* "$HOME"/.cargo/registry/cache/-*
          cargo publish --dry-run --locked -p escouade-plugin-protocol -p escouade-plugin-kit -p escouade-acp -p escouade-voice

  windows-lint:
    name: Windows (Rust format and Clippy)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      # whisper-rs generates its bindings with libclang: the runner's LLVM (cmake is there too).
      - name: libclang for whisper.cpp
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      # No crate of a normal build has the `testing` feature on: it enters only through dev-dependencies (SEC-18 of the
      # security audit, ESC-594). The release checks it again on the tag.
      - name: No test code in a normal build
        run: node scripts/no-testing.mjs

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  windows-build:
    name: Windows (build)
    # Not for Dependabot's pull requests (see the rule above `jobs:`).
    if: github.actor != 'dependabot[bot]'
    needs: escouade-js
    runs-on: windows-latest
    # 55: a build without its cache (a new Cargo.lock) takes 37 min, and the cache's save after it 3 more; cut at 40, the
    # cache was never saved, so each run started cold again (release/2.3, 2026-11-22).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # escouade-js, embedded in the app (src-tauri/build.rs).
      - name: Download escouade-js
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: escouade-js
          path: src-tauri/escouade-js/target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      # whisper-rs generates its bindings with libclang: the runner's LLVM (cmake is there too).
      - name: libclang for whisper.cpp
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      # The cache of the one Windows job there was (named `test`): its dependencies are those of these builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: test

      - name: Install dependencies
        run: npm ci

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      # What the tests of the app and its end-to-end tests play in its host (docs/PLUGINS-DESIGN.md §8.6.4), in the archive below
      # (.config/nextest.toml) and in the app's artifact.
      - name: The modules of the plugins
        shell: bash
        run: sh scripts/plugins-wasm.sh

      # The test binaries, with what they run beside them (escouade-hook, examples/fake_codex): built once, run by
      # the two windows-rust runners.
      - name: Rust tests, built once (nextest archive)
        working-directory: src-tauri
        # The app's own crates without debug information (ESC-409, docs/CRATES.md § 8): less work and ≈ 0.5 GB less memory
        # for the tests' compilation. A failure keeps its file and line (the panic's message carries them, not the debug
        # information); only a backtrace, which the CI never asks for (no RUST_BACKTRACE), would lose its files and lines.
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo nextest archive --profile ci --archive-file ../nextest-windows.tar.zst

      # The core without a window, which server.spec.ts drives the app on (ESC-514): built here too, before the app's
      # build (nothing is built between the app's build and the end-to-end tests).
      - name: Build escouade-server for end-to-end tests
        working-directory: src-tauri
        run: cargo build --locked --bin escouade-server

      # The team server the end-to-end tests of the part « team server » start (tests/e2e/team*.spec.ts, ESC-519): built
      # once here, with the profile of the archive above (its test of the binary built it already), never in each part.
      - name: The team server, for the end-to-end tests
        working-directory: src-tauri
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo build -p escouade-team-server

      - name: Build the app for end-to-end tests
        run: npx tauri build --debug --no-bundle

      - name: Upload the Rust tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-windows
          path: nextest-windows.tar.zst
          retention-days: 1
          compression-level: 0

      # The app, its hook (looked for beside it) and the workspace's modules: what the end-to-end tests drive. Without
      # plugins-wasm/, a build of development has no plugin of the first hand (GitHub, isola, the voice…) to run.
      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-windows
          path: |
            src-tauri/target/debug/escouade.exe
            src-tauri/target/debug/escouade-hook.exe
            src-tauri/target/debug/escouade-server.exe
            src-tauri/target/debug/escouade-team-server.exe
            src-tauri/target/plugins-wasm/
          retention-days: 1

  windows-rust:
    name: Windows (Rust tests ${{ matrix.part }}/2)
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The fake harnesses of the tests (tests/fixtures) are Node scripts, with Node's own modules only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The author’s path in TS (plugins_wasm_tests.rs, issue #43) bundles the model by the repository’s esbuild.
      - name: The repository’s esbuild, for a test of the plugins
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      - name: Download the Rust tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-windows

      # One process per test (src-tauri/.config/nextest.toml): a test that hangs is killed after
      # 3 minutes and named, one that fails runs again twice. Reading the job's log takes admin
      # rights: the failures, and the tests that passed at a new try, are also annotations.
      - name: Rust tests (unit + integration with the fake claude CLI)
        working-directory: src-tauri
        shell: bash
        # As in the environment of an agent of Escouade: the tests must not depend on it.
        env:
          CLAUDE_CODE_ENABLE_TODO_TOOLS: '1'
        # Extracted where the build put it (src-tauri/target, the same path on every Windows runner): the paths cargo
        # wrote into the tests (`CARGO_BIN_EXE_escouade-hook`, the fake codex beside them) are right as they are.
        run: |
          set +e
          cargo nextest run --archive-file ../nextest-windows.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
            --profile ci --partition count:${{ matrix.part }}/2 2>&1 | tee nextest.log
          status=${PIPESTATUS[0]}
          node ../scripts/nextest-annotations.mjs nextest.log target/nextest/ci/junit.xml $status
          exit $status

  # Five parts of all the end-to-end tests, and a part of its own (ESC-495) where a set of them runs again with the window
  # on the remote API of the core (its WebSocket on the loopback, not Tauri's IPC), with the e2e of a cut: beside the
  # others, it adds no time to the CI's.
  # The part « team server » (ESC-519): the specs of the team server (tests/e2e/team*.spec.ts, two clients against a real
  # escouade-team-server, built once by windows-build) at the runner's size, then again at 1024 × 728; the five parts
  # leave them out (ESCOUADE_E2E_PART, playwright.config.ts). Its 8 specs took 6 min 08 at the window's size and 4 min 30 at
  # 1024 × 728 on a desktop (2026-11-17): about 13 min with its setup, beside the others (11 to 18 min), and 3 to 4 min
  # fewer in the part that held them before (the build of the server among them).
  windows-e2e:
    name: Windows (end-to-end ${{ matrix.shard == 'remote' && 'remote API' || matrix.shard == 'team' && 'team server' || format('{0}/5', matrix.shard) }})
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, remote, team]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src-tauri/target: the artifact holds debug/ and plugins-wasm/.
      - name: Download the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-windows
          path: src-tauri/target

      # Surfaced as an annotation: the end-to-end tests need the Evergreen WebView2 runtime.
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id", "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$id"
          $v = $keys | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          if ($v) { "::notice::WebView2 runtime $v" } else { "::warning::WebView2 runtime not found" }

      # WebView2 150+ ignores the WEBVIEW2_* variables (and the per-user policy) in elevated processes,
      # and CI runners are elevated: open the app's DevTools port through the machine policy instead,
      # with the options that keep its window drawing out of sight (RENDER_UNSEEN in tests/e2e/fixture.ts).
      # The policy goes by the program's name only: the second app of a test of two live clients
      # (`second()` of the fixture) runs from a copy, escouade-second.exe, to get a port of its own
      # (9223, ESCOUADE_E2E_CDP_PORT + 1); under the same name, it would be given 9222, already the
      # first app's, and open none (ESC-496). Each app's WebView2 folder is given by the app's API
      # (ESCOUADE_WEBVIEW_DIR, which an elevated process follows), one per app and per test.
      - name: Open the app's WebView2 DevTools port
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $unseen = '--disable-backgrounding-occluded-windows --disable-renderer-backgrounding --disable-background-timer-throttling'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'escouade.exe' -Value "--remote-debugging-port=9222 $unseen" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name 'escouade-second.exe' -Value "--remote-debugging-port=9223 $unseen" -PropertyType String -Force | Out-Null

      # A test that fails runs again twice (playwright.config.ts): the one that passes then is reported
      # as flaky, and its trace is kept. Each runner takes a fifth of the tests (Playwright's shards): in 3, a part took
      # up to 19 min after the 16 of the build.
      - name: End-to-end tests (Playwright over WebView2)
        if: matrix.shard != 'remote' && matrix.shard != 'team'
        env:
          ESCOUADE_E2E_CDP_PORT: 9222
          # The specs of the team server are the part « team server »'s.
          ESCOUADE_E2E_PART: rest
          # As in the environment of an agent of Escouade: the tests must not depend on it.
          CLAUDE_CODE_ENABLE_TODO_TOOLS: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/5

      # The team server (ESC-519): each spec of tests/e2e/team*.spec.ts, the journey of two clients among them
      # (team-journey.spec.ts), at the runner's size, then at 1024 × 728. The server is the build's (src-tauri/target/debug).
      - name: End-to-end tests of the team server
        if: matrix.shard == 'team'
        env:
          ESCOUADE_E2E_CDP_PORT: 9222
          ESCOUADE_E2E_PART: team
          CLAUDE_CODE_ENABLE_TODO_TOOLS: '1'
        run: npx playwright test

      - name: End-to-end tests of the team server at 1024 × 728
        if: matrix.shard == 'team' && !cancelled()
        env:
          ESCOUADE_E2E_CDP_PORT: 9222
          ESCOUADE_E2E_PART: team
          ESCOUADE_E2E_VIEWPORT: 1024x728
          CLAUDE_CODE_ENABLE_TODO_TOOLS: '1'
        run: npx playwright test --output=test-results/1024x728

      # The window on the remote API (ESC-495): the app, a conversation, a terminal, the Kanban, the MCP server, and the
      # WebSocket closed by force while a terminal writes.
      - name: End-to-end tests on the remote API
        if: matrix.shard == 'remote'
        env:
          ESCOUADE_E2E_CDP_PORT: 9222
          ESCOUADE_E2E_REMOTE: '1'
          CLAUDE_CODE_ENABLE_TODO_TOOLS: '1'
        run: npx playwright test ${{ env.REMOTE_E2E }}

      # The traces of the tests that failed, or that ran again (there is none when all passed first time).
      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # escouade-server (ESC-514, docs/CRATES.md § 14, docs/REMOTE.md « Le mode serveur »): the core without the desktop, for
  # Linux x64 and arm64, built where neither WebKitGTK nor GTK is installed; no library of the desktop linked
  # (scripts/server-libs.sh); started in a bare Debian container, no display: served on 127.0.0.1, a pairing code, a
  # clean stop at SIGTERM (scripts/server-trial.sh). The team server too (ESC-586), as the Release publishes it.
  server-linux:
    name: Server (Linux ${{ matrix.arch }})
    needs: escouade-js
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download escouade-js
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: escouade-js
          path: src-tauri/escouade-js/target

      - name: System libraries (whisper.cpp's tools; no WebKitGTK, no GTK, no sound)
        run: sh scripts/linux-deps.sh server

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: server-${{ matrix.arch }}

      - name: Build escouade-server without the desktop
        working-directory: src-tauri
        run: cargo build --locked -p escouade --bin escouade-server --no-default-features

      - name: No library of the desktop linked (ldd)
        run: sh scripts/server-libs.sh src-tauri/target/debug/escouade-server

      - name: In a bare Debian container, no display
        run: >-
          docker run --rm -v "$PWD/src-tauri/target/debug:/srv/bin:ro" -v "$PWD/scripts:/srv/scripts:ro"
          debian:trixie-slim bash /srv/scripts/server-trial.sh /srv/bin/escouade-server

      # The image (ESC-515, deploy/Dockerfile) made from this build as the Release makes it from its own, then tried as a
      # user runs it: a new volume, read-only, no capability, its HEALTHCHECK, the pairing by `docker exec`, a clean stop,
      # a restart on the same volume, and Claude Code installed by its plugin's command into the volume. Nothing pushed.
      - name: The image, from this build, tried as a user runs it
        run: |
          strip -o "$RUNNER_TEMP/escouade-server" src-tauri/target/debug/escouade-server
          sh scripts/server-package.sh "$RUNNER_TEMP/escouade-server" 0.0.0-ci ${{ matrix.arch }} "$RUNNER_TEMP/dist"
          docker build -f deploy/Dockerfile --build-arg VERSION=0.0.0-ci -t escouade-server:ci "$RUNNER_TEMP/dist"
          sh scripts/server-image-test.sh escouade-server:ci --harness

      # deploy/install.sh on the runner's systemd: a service of the system and of a user, idempotent, a changed archive
      # refused, `escouade-server update` checked and restarted by systemd, uninstalled (a fake release, a key of the test's).
      - name: install.sh with systemd
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 minisign
          sudo sh scripts/server-install-test.sh "$RUNNER_TEMP/escouade-server"

      # The team server as the Release publishes it (ESC-586): tried in a bare Debian container, archived, its image made
      # from the archive (crates/escouade-team-server/Dockerfile, PROGRAM=archive), then tried as a user runs it.
      - name: Build escouade-team-server
        working-directory: src-tauri
        run: cargo build --locked -p escouade-team-server

      - name: The team server in a bare Debian container, then its image from its archive
        run: |
          docker run --rm -v "$PWD/src-tauri/target/debug:/srv/bin:ro" -v "$PWD/scripts:/srv/scripts:ro" \
            debian:bookworm-slim bash /srv/scripts/team-server-trial.sh /srv/bin/escouade-team-server
          strip -o "$RUNNER_TEMP/escouade-team-server" src-tauri/target/debug/escouade-team-server
          sh scripts/server-package.sh "$RUNNER_TEMP/escouade-team-server" 0.0.0-ci ${{ matrix.arch }} "$RUNNER_TEMP/team-dist"
          docker build -f crates/escouade-team-server/Dockerfile --build-arg PROGRAM=archive --build-arg VERSION=0.0.0-ci \
            -t escouade-team-server:ci "$RUNNER_TEMP/team-dist"
          sh scripts/team-server-image-test.sh escouade-team-server:ci

  # The Rust tests built once, as on Windows and macOS: compiling them took 4 min and running them 9 to 13 on one runner
  # of 4 vCPUs (2026-11-10).
  linux:
    name: Linux (build)
    needs: escouade-js
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # escouade-js, embedded in the app (src-tauri/build.rs).
      - name: Download escouade-js
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: escouade-js
          path: src-tauri/escouade-js/target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # libasound2-dev: the microphone (cpal); libclang-dev and cmake: whisper.cpp, built by whisper-rs.
      - name: System libraries (WebKitGTK, tray, AppImage, sound, whisper.cpp)
        # The mirrors of a runner fail in turns: each order of them tried for a bounded time (scripts/linux-deps.sh).
        run: sh scripts/linux-deps.sh

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      # What the tests play in the app's host, in the archive below (.config/nextest.toml).
      - name: The modules of the plugins, which the tests play
        run: sh scripts/plugins-wasm.sh

      # The test binaries, with what they run beside them (escouade-hook, examples/fake_codex): built once, run by
      # the two linux-rust runners.
      - name: Rust tests, built once (nextest archive)
        working-directory: src-tauri
        # The app's own crates without debug information (ESC-409, docs/CRATES.md § 8): less work and ≈ 0.5 GB less memory
        # for the tests' compilation. A failure keeps its file and line (the panic's message carries them, not the debug
        # information); only a backtrace, which the CI never asks for (no RUST_BACKTRACE), would lose its files and lines.
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo nextest archive --profile ci --archive-file ../nextest-linux.tar.zst

      - name: Upload the Rust tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-linux
          path: nextest-linux.tar.zst
          retention-days: 1
          compression-level: 0

  linux-rust:
    name: Linux (Rust tests ${{ matrix.part }}/2)
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    # The team server's tests also run on PostgreSQL (crates/escouade-team-server, `postgres::` variants, ESC-456):
    # started before the job's steps, each test in a schema of its own.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: team
          POSTGRES_PASSWORD: team
          POSTGRES_DB: team
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U team"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The fake harnesses of the tests (tests/fixtures) are Node scripts, with Node's own modules only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The author’s path in TS (plugins_wasm_tests.rs, issue #43) bundles the model by the repository’s esbuild.
      - name: The repository’s esbuild, for a test of the plugins
        run: npm ci --ignore-scripts --no-audit --no-fund

      # libasound2-dev: the microphone (cpal); libclang-dev and cmake: whisper.cpp, built by whisper-rs.
      - name: System libraries (WebKitGTK, tray, AppImage, sound, whisper.cpp)
        # The mirrors of a runner fail in turns: each order of them tried for a bounded time (scripts/linux-deps.sh).
        run: sh scripts/linux-deps.sh

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      - name: Download the Rust tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-linux

      # The app's MCP server takes its port in 47000-47999, which a runner also hands out to the
      # outgoing connections of other programs: keep that range out of the ephemeral ones, so a test
      # (or the app) never finds its port taken by one of them.
      - name: Keep the MCP port range out of the ephemeral ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=47000-47999

      # One process per test (src-tauri/.config/nextest.toml): a test that hangs is killed after
      # 3 minutes and named, one that fails runs again twice. Reading the job's log takes admin
      # rights: the failures, and the tests that passed at a new try, are also annotations.
      - name: Rust tests (unit + integration with the fake claude CLI)
        working-directory: src-tauri
        shell: bash
        # As in the environment of an agent of Escouade: the tests must not depend on it.
        env:
          CLAUDE_CODE_ENABLE_TODO_TOOLS: '1'
          ESCOUADE_TEST_POSTGRES_URL: postgres://team:team@localhost:5432/team
          # Here, a PostgreSQL variant without its base fails instead of passing without a word (ESC-519).
          ESCOUADE_TEST_POSTGRES_REQUIRED: '1'
        # Extracted where the build put it (the same path on every Linux runner): the paths cargo wrote into the tests
        # (`CARGO_BIN_EXE_escouade-hook`, the fake codex beside them) are right as they are.
        run: |
          set +e
          cargo nextest run --archive-file ../nextest-linux.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
            --profile ci --partition count:${{ matrix.part }}/2 2>&1 | tee nextest.log
          status=${PIPESTATUS[0]}
          node ../scripts/nextest-annotations.mjs nextest.log target/nextest/ci/junit.xml $status
          exit $status

  # The short pass of the fuzzing of the team server and its client (TS-18, ESC-519): every target of fuzz/ for 15 s, from
  # its committed seeds, on its own runner beside the others (a few minutes, its build first). The long pass is
  # .github/workflows/fuzz.yml (weekly, or by hand). fuzz/ is a package of its own (its lock, its nightly): nothing of it
  # reaches src-tauri/Cargo.lock nor `cargo deny`.
  fuzz:
    name: Linux (fuzzing, short pass)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust nightly (pinned in fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz@0.13.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - name: Fuzzing, 15 s a target
        run: sh scripts/fuzz.sh 15

      # A failure's input (fuzz/artifacts/<target>/): to play again with `cargo fuzz run --fuzz-dir fuzz <target> <file>`.
      - name: Upload what the fuzzing found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Beside the tests, off their way (all of it took 26 to 44 min one after the other, on 2026-11-10): Clippy, the webview
  # probe, the packages, the plugin templates and Escouade's own plugins.
  linux-packages:
    name: Linux (Clippy, webview, packages and plugins)
    needs: escouade-js
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      # Two commits: on a pull request, the merge and its base, which `plugins/ci.mjs --changed` compares.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # escouade-js, embedded in the app (src-tauri/build.rs).
      - name: Download escouade-js
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: escouade-js
          path: src-tauri/escouade-js/target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # libasound2-dev: the microphone (cpal); libclang-dev and cmake: whisper.cpp, built by whisper-rs.
      - name: System libraries (WebKitGTK, tray, AppImage, sound, whisper.cpp)
        # The mirrors of a runner fail in turns: each order of them tried for a bounded time (scripts/linux-deps.sh).
        run: sh scripts/linux-deps.sh

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      # The cache of the tests' job (named `linux`): the dependencies built there serve the packages too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: linux

      - name: Install dependencies
        run: npm ci

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # A launch's page in a real WebKitGTK (ESC-311): no command of Escouade answers it, its storage is
      # its project's, its devtools open, and it sees a phone's then a tablet's width.
      - name: A launch's page in a real webview
        working-directory: src-tauri
        run: xvfb-run -a cargo run --example devpage_probe

      # An agent's page in a real WebKitGTK (ESC-667): the trap of docs/AGENT-PAGES.md § 8.4 reaches nothing (two
      # listeners of the loopback say so), no command answers it, its storage does not last; and whether the CSP of a
      # header of the scheme, or of its <meta>, holds alone.
      - name: An agent's page in a real webview
        working-directory: src-tauri
        run: xvfb-run -a cargo run --example agentpage_probe

      # The read bridge of the browsers in a real WebKitGTK (ESC-672, AB-5): a page that defends itself is read (its
      # secrets masked), captured (the view, an element, the document) and its console and failed requests kept from the
      # browser's creation, across a navigation. The probe exits 1 when a step does not hold, which fails the job.
      - name: The agents read a browser in a real webview
        working-directory: src-tauri
        run: xvfb-run -a cargo run --example agentbrowser_probe

      # The conversation's voice under Linux: Microsoft's ONNX Runtime (glibc 2.27), in the .deb and the AppImage
      # (tauri.ort-linux.conf.json), its checksum checked; pyke's needs glibc 2.38.
      - name: ONNX Runtime for Linux
        run: scripts/onnxruntime.sh linux

      # Without the updater key: only checks that the AppImage and the .deb build, ONNX Runtime in the .deb.
      - name: Build the packages
        run: |
          npx tauri build --debug --config src-tauri/tauri.ort-linux.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}'
          dpkg -c src-tauri/target/debug/bundle/deb/*.deb | grep -q usr/lib/escouade/libonnxruntime.so.1.23.2

      # escouade-hook, the hook of the harnesses that run theirs as commands, and escouade-plugin, the command of the
      # plugins' authors (their conformance bench), ship beside the app; escouade-plugins left with ESC-355. On Linux no
      # signature is checked by the system: the packages are the updater's and the repository's.
      - name: The packages hold escouade-hook and escouade-plugin, and no escouade-plugins
        run: |
          appimage=$(ls "$PWD"/src-tauri/target/debug/bundle/appimage/*.AppImage)
          ! dpkg -c src-tauri/target/debug/bundle/deb/*.deb | grep -E "usr/bin/escouade-plugins$"
          for bin in escouade-hook escouade-plugin; do
            dpkg -c src-tauri/target/debug/bundle/deb/*.deb | grep -E "usr/bin/$bin$"
            (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract "usr/bin/$bin" >/dev/null && test -x "squashfs-root/usr/bin/$bin")
          done

      # npm create escouade-plugin, as an author gets it: both templates installed against this @escouade-dev/plugin, their
      # tests and build, then validate and the conformance bench of the escouade-plugin just built.
      - name: The plugin templates pass validate and the bench
        env:
          ESCOUADE_PLUGIN_BIN: src-tauri/target/debug/escouade-plugin
        run: node sdk/scripts/template-ci.mjs

      # The plugins whose crates wait for crates.io (AWAITING_PUBLICATION, plugins/ci-lib.mjs) are played by the bench
      # from the repository's modules, built here as the tests' jobs build theirs.
      - name: The modules of the plugins that wait for their crates
        run: |
          waiting=$(node --input-type=module -e "import('./plugins/ci-lib.mjs').then((m) => console.log(Object.keys(m.AWAITING_PUBLICATION).join(' ')))")
          if [ -n "$waiting" ]; then sh scripts/plugins-wasm.sh $waiting; fi

      # Escouade's own plugins (plugins/<id>/, PLG-10's examples, ESC-182, ESC-314 and ESC-340), as their author checks them
      # before a tag: LICENSE and CHANGELOG, their tests (cargo test for the crates), the TypeScript ones' dist/ rebuilt
      # and compared, a crate's version against its manifest, then validate, and the bench for all but those the app still
      # gives (--first-party: their ids dev.escouade.*; the SDK built by the step above). All of them on main; on a
      # pull request, those it touches (docs/PLUGINS-DESIGN.md §8.6.4).
      - name: Escouade's own plugins pass their tests, validate and the bench
        env:
          ESCOUADE_PLUGIN_BIN: src-tauri/target/debug/escouade-plugin
        run: node plugins/ci.mjs ${{ github.event_name == 'pull_request' && '--changed HEAD^1' || '' }}

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escouade-linux-debug
          path: |
            src-tauri/target/debug/bundle/appimage/*.AppImage
            src-tauri/target/debug/bundle/deb/*.deb
          retention-days: 7

  # The Rust tests built once, as on Windows: compiling them took 12 min and running them 16 on one runner of 3 vCPUs.
  macos-build:
    name: macOS (build)
    # Not for Dependabot's pull requests (see the rule above `jobs:`).
    if: github.actor != 'dependabot[bot]'
    needs: escouade-js
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # escouade-js, embedded in the app (src-tauri/build.rs).
      - name: Download escouade-js
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: escouade-js
          path: src-tauri/escouade-js/target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      # The cache the macOS tests had (their job was named `macos`), which the bundle shares.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: macos

      - name: Install dependencies
        run: npm ci

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      # What the tests play in the app's host, in the archive below (.config/nextest.toml).
      - name: The modules of the plugins, which the tests play
        run: sh scripts/plugins-wasm.sh

      # The app's library (≈ 4 GB to compile) before its tests (≈ 8 GB), not beside them: the tests alone go past the
      # runner's 7 GB, the library beside them made it page more (ESC-409, docs/CRATES.md § 8: the archive went from
      # 13 min 11 to 1 min 41 + 10 min 11 on one run). `cargo test --no-run --bins` builds the library
      # as the archive needs it (the test profile, the dev-dependencies' features): the archive then takes it as built.
      - name: The app's library first, alone (its tests' compilation then has the memory)
        working-directory: src-tauri
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo test --no-run --bins

      # The test binaries, with what they run beside them (escouade-hook, examples/fake_codex): built once, run by
      # the three macos-rust runners (two took 11 to 12 min each).
      - name: Rust tests, built once (nextest archive)
        working-directory: src-tauri
        # The app's own crates without debug information (ESC-409, docs/CRATES.md § 8): less work and ≈ 0.5 GB less memory
        # for the tests' compilation. A failure keeps its file and line (the panic's message carries them, not the debug
        # information); only a backtrace, which the CI never asks for (no RUST_BACKTRACE), would lose its files and lines.
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo nextest archive --profile ci --archive-file ../nextest-macos.tar.zst

      - name: Upload the Rust tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-macos
          path: nextest-macos.tar.zst
          retention-days: 1
          compression-level: 0

  macos-rust:
    name: macOS (Rust tests ${{ matrix.part }}/3)
    needs: macos-build
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The fake harnesses of the tests (tests/fixtures) are Node scripts, with Node's own modules only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The author’s path in TS (plugins_wasm_tests.rs, issue #43) bundles the model by the repository’s esbuild.
      - name: The repository’s esbuild, for a test of the plugins
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      - name: Download the Rust tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-macos

      # One process per test (src-tauri/.config/nextest.toml): a test that hangs is killed after
      # 3 minutes and named, one that fails runs again twice. Reading the job's log takes admin
      # rights: the failures, and the tests that passed at a new try, are also annotations.
      # The runner has 3 vCPUs.
      - name: Rust tests (unit + integration with the fake claude CLI)
        working-directory: src-tauri
        shell: bash
        # As in the environment of an agent of Escouade: the tests must not depend on it.
        env:
          CLAUDE_CODE_ENABLE_TODO_TOOLS: '1'
        # Extracted where the build put it (the same path on every macOS runner): the paths cargo wrote into the tests
        # (`CARGO_BIN_EXE_escouade-hook`, the fake codex beside them) are right as they are.
        run: |
          set +e
          cargo nextest run --archive-file ../nextest-macos.tar.zst --workspace-remap . --extract-to . --extract-overwrite             --profile ci --test-threads 3 --partition count:${{ matrix.part }}/3 2>&1 | tee nextest.log
          status=${PIPESTATUS[0]}
          node ../scripts/nextest-annotations.mjs nextest.log target/nextest/ci/junit.xml $status
          exit $status

  # Beside the tests, off their way: the bundle, Clippy (6 min) and the webview probe (4 min).
  macos-bundle:
    name: macOS (app bundle, Clippy and webview)
    # Not for Dependabot's pull requests (see the rule above `jobs:`).
    if: github.actor != 'dependabot[bot]'
    needs: escouade-js
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # escouade-js, embedded in the app (src-tauri/build.rs).
      - name: Download escouade-js
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: escouade-js
          path: src-tauri/escouade-js/target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      # The cache of the macOS job: the dependencies built there serve the bundle too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: macos

      - name: Install dependencies
        run: npm ci

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The Release builds one app for Apple Silicon and Intel Macs: whisper.cpp (dictation) is built for Intel
      # here too, as it is there (a check builds what build scripts build, cmake's whisper.cpp among them).
      - name: whisper.cpp for Intel Macs (as the universal Release builds it)
        working-directory: src-tauri
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --lib --target x86_64-apple-darwin

      # The conversation's voice on Intel Macs: Microsoft's ONNX Runtime, in the bundle's Frameworks
      # (tauri.ort-macos.conf.json), its checksum checked.
      - name: ONNX Runtime for Intel Macs
        run: scripts/onnxruntime.sh macos

      # Without the updater key: only checks that the app and its disk image build, ONNX Runtime in its Frameworks.
      - name: Build the app bundle
        run: |
          npx tauri build --debug --bundles app,dmg --config src-tauri/tauri.ort-macos.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}'
          test -f src-tauri/target/debug/bundle/macos/Escouade.app/Contents/Frameworks/libonnxruntime.1.23.2.dylib

      # escouade-hook and escouade-plugin ship beside the app, each with a code signature that holds (ad hoc here, as the
      # Release signs without its certificate); escouade-plugins left with ESC-355.
      - name: The app holds escouade-hook and escouade-plugin, signed, and no escouade-plugins
        run: |
          macos=src-tauri/target/debug/bundle/macos/Escouade.app/Contents/MacOS
          test ! -e "$macos/escouade-plugins"
          for bin in escouade-hook escouade-plugin; do
            test -x "$macos/$bin"
            codesign --verify --strict --verbose=2 "$macos/$bin"
          done

      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escouade-macos-debug
          path: src-tauri/target/debug/bundle/dmg/*.dmg
          retention-days: 7

      # A launch's page in a real WKWebView (ESC-311), in the runner's own session: its devtools last,
      # then first, as a user opens them.
      - name: A launch's page in a real webview
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo run --example devpage_probe -- --devtools-last; last=$?
          cargo run --example devpage_probe; first=$?
          exit $((last || first))

      # An agent's page in a real WKWebView (ESC-667): the same trap, the same verdict.
      - name: An agent's page in a real webview
        working-directory: src-tauri
        run: cargo run --example agentpage_probe

      # The read bridge of the browsers in a real WKWebView (ESC-672, AB-5), its first true trial: the same page read,
      # captured and its console kept; the probe exits 1 when a step does not hold.
      - name: The agents read a browser in a real webview
        working-directory: src-tauri
        run: cargo run --example agentbrowser_probe
