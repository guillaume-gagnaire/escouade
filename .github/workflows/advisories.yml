name: Advisories

# The advisories of the dependencies (SEC-02 of the security audit of 2026-11, ESC-422): `cargo deny check advisories` for
# the app (src-tauri), the plugins' workspace (plugins) and the phone's crate (crates/escouade-mobile, MO-3), `npm audit
# --omit=dev` for the app, the store and the site. On
# every pull request and every push on main, and every night: an advisory published after the last merge fails the night's
# run. Its own workflow, so that the CI's concurrency and path filters do not touch it. The rules (and the advisories
# ignored, each with its reason) are in deny.toml at the root. The nightly run is only in guillaume-gagnaire/escouade: a
# copy runs the push and the pull requests, not a nightly run it would pay (ESC-483).
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: advisories-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny (${{ matrix.dir }})
    if: github.event_name != 'schedule' || github.repository == 'guillaume-gagnaire/escouade'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [src-tauri, plugins, crates/escouade-mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cargo reads the toolchain from the folder it runs in (src-tauri/rust-toolchain.toml pins one).
      - name: Rust toolchain
        working-directory: ${{ matrix.dir }}
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      # The database is fetched at each run: this is the point of the nightly run.
      - name: Advisories
        working-directory: ${{ matrix.dir }}
        run: cargo deny --locked check advisories

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    if: github.event_name != 'schedule' || github.repository == 'guillaume-gagnaire/escouade'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app's interface: nothing is left, so any new advisory fails.
          - dir: .
            level: low
          # The store and the site (SEC-04 of the security audit, ESC-594): a high or critical advisory fails the job, a
          # low or moderate one is listed in the run without failing it. How soon each must be closed is written in
          # docs/SECURITY-DEPENDENCIES.md (7 days for a high one).
          - dir: store
            level: high
          - dir: website
            level: high
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: npm audit (production dependencies)
        working-directory: ${{ matrix.dir }}
        # Every advisory is listed; those of `level` or above fail the job.
        run: npm audit --omit=dev --audit-level=${{ matrix.level }}
