name: Étude ESC-444 (vue VS Code)

# ESC-444, a study, never merged: the bench of the editors (CodeMirror, the VS Code view, with the Node extension host)
# on the three systems, under their webview (WebView2, WKWebView, WebKitGTK): memory, opening time, page errors, what
# works of the extensions, screenshots. Only on its own branch, never on main nor a pull request. No secret of the
# repository: the downloads are public (VSCodium's releases, Open VSX).
on:
  push:
    branches: [study/esc-444]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-esc-444
  cancel-in-progress: true

env:
  # The Node extension host: VSCodium's server (MIT, no vsda), its commit written as the client's (VS Code 1.138 of
  # monaco-vscode-api 37.6.1).
  REH_VERSION: 1.140.06880
  CLIENT_COMMIT: 7debcd0e2acdea1c52de81bf9ee1620444407dda

jobs:
  escouade-js:
    name: escouade-js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and wasm32-wasip1
        working-directory: src-tauri/escouade-js
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1
      - run: sh scripts/escouade-js.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escouade-js
          path: |
            src-tauri/escouade-js/target/escouade-js.wasm
            src-tauri/escouade-js/target/escouade-js.wasm.sha256
          retention-days: 3

  # What the VS Code view adds to the frontend: the same on every system (the app embeds it compressed).
  weight:
    name: Weight of the frontend (branch and main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build both frontends
        run: |
          npm ci && npx vite build --outDir study-dist-branch
          git worktree add ../main-src origin/main
          (cd ../main-src && npm ci && npx vite build --outDir "$GITHUB_WORKSPACE/study-dist-main")
      - name: Measure
        run: node scripts/study/weight.mjs study-dist-main study-dist-branch | tee -a "$GITHUB_STEP_SUMMARY"

  bench:
    name: Bench (${{ matrix.os }})
    needs: escouade-js
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            reh: linux-x64
            exe: src-tauri/target/debug/escouade
          - os: macos-latest
            reh: darwin-arm64
            exe: src-tauri/target/debug/escouade
          - os: windows-latest
            reh: win32-x64
            exe: src-tauri/target/debug/escouade.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: escouade-js
          path: src-tauri/escouade-js/target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: System libraries (WebKitGTK…) and the screenshot tool
        if: runner.os == 'Linux'
        run: |
          sh scripts/linux-deps.sh
          sudo apt-get install -y imagemagick xvfb

      - name: libclang for whisper.cpp
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - name: Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: study-esc-444

      - run: npm ci

      - name: Build the app
        run: npx tauri build --debug --no-bundle

      - name: VSCodium's server (REH), its checksum checked, its commit the client's
        shell: bash
        run: |
          f="vscodium-reh-${{ matrix.reh }}-${REH_VERSION}.tar.gz"
          base="https://github.com/VSCodium/vscodium/releases/download/${REH_VERSION}"
          curl -fsSL -o "$f" "$base/$f"
          curl -fsSL -o "$f.sha256" "$base/$f.sha256"
          [ "$(cut -d' ' -f1 "$f.sha256")" = "$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync('$f')).digest('hex'))")" ]
          mkdir -p reh && tar -xzf "$f" -C reh
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('reh/product.json'));p.commit=process.env.CLIENT_COMMIT;fs.writeFileSync('reh/product.json',JSON.stringify(p,null,2))"
          echo "Node of the runner: $(node --version); Node of the server: $(./reh/node --version 2>/dev/null || ./reh/node.exe --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Bench
        shell: bash
        run: |
          run="node scripts/study/editor-bench.mjs --exe ${{ matrix.exe }} --out study-out --modes codemirror,vscode,vscode-node --server reh --runs 2 --shots"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1600x1000x24" $run; else $run; fi | tee study-out-${{ matrix.reh }}.txt
          grep '^|' study-out-${{ matrix.reh }}.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: The webview's version
        if: always()
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) dpkg -l | grep -E 'libwebkit2gtk-4.1-0 ' | awk '{print "WebKitGTK " $3}' ;;
            macOS) sw_vers; defaults read /System/Library/Frameworks/WebKit.framework/Resources/Info CFBundleVersion ;;
            Windows) reg query "HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" /v pv || true ;;
          esac | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: study-${{ matrix.reh }}
          path: |
            study-out
            study-out-*.txt
          retention-days: 14
