name: Release

# A tag `vX.Y.Z` (pushed, or created with a release on GitHub's page) publishes a release: NSIS
# installer (Windows), universal app and disk image (macOS), AppImage and .deb (Linux), signed
# updater artifacts and the latest.json of the in-app updater, which holds the three systems. The app gets the tag's version.
# The release is a draft while the three builds upload to it (~30 min, each one rewriting
# latest.json), and the last job publishes it once latest.json and every file it names are in:
# the in-app updater reads the latest release, so it never meets a half-built one. A failed build
# just leaves the draft, and the previous release stays the latest.
# It only builds: the tests run on each push to main (ci.yml), and a tag is put on a commit whose
# CI is green.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create:
    name: Create the release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # Sets it in this checkout only: fails unless the tag is a version.
      - name: Check that the tag is a version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs "$TAG"

      # Created before the long builds, while the tag is still the head of main: once main has
      # moved past it, GITHUB_TOKEN may no longer create the release ("Resource not accessible by
      # integration", it would need the `workflows` permission it cannot have). It is a draft, and
      # the builds and the last job find it by its id: the by-tag lookups do not see a draft. A
      # release that already exists for the tag (made on GitHub's page, or a run started again)
      # goes back to draft; the API lists drafts too, `gh release view` does not.
      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          release_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq 'map(select(.tag_name == env.TAG)) | first | .id // empty'
          }
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          id=$(release_id)
          if [ -n "$id" ]; then
            # A pre-release tag keeps its mark too, whatever the page of GitHub was ticked with.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true -F prerelease=$prerelease > /dev/null
          else
            flags=()
            [ "$prerelease" = true ] && flags+=(--prerelease)
            # The version's section of CHANGELOG.en.md, in English (a sentence pointing at the
            # commits without one; a CI test keeps every version in it, scripts/changelog.test.ts).
            node scripts/changelog.mjs "$TAG" --lang en > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag --draft --title "Escouade $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
            # The list may take a moment to show the new draft.
            for attempt in 1 2 3 4 5; do
              id=$(release_id)
              [ -n "$id" ] && break
              sleep 3
            done
          fi
          if [ -z "$id" ]; then
            echo "::error::No release found for $TAG, the builds have nowhere to upload"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # escouade-js, the Javy plugin of the run.js plugins (ESC-320, docs/PLUGINS.md §5): built once for wasm32-wasip1 with the
  # pinned Javy (scripts/escouade-js.sh), its SHA-256 noted, then handed to every job that builds the app, which embeds it.
  escouade-js:
    name: escouade-js (the JS/TS plugins' engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (pinned in src-tauri/escouade-js/rust-toolchain.toml) and wasm32-wasip1
        working-directory: src-tauri/escouade-js
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/escouade-js
          # The script decides what rustc is given (its wrapper is no input cargo sees): a cache made by another one would hand
          # back a module with this machine's paths, and the store's image would embed another escouade-js.
          key: ${{ hashFiles('scripts/escouade-js.sh') }}

      - name: Build escouade-js
        run: |
          sh scripts/escouade-js.sh
          echo "escouade-js.wasm: $(wc -c < src-tauri/escouade-js/target/escouade-js.wasm) bytes, SHA-256 $(cat src-tauri/escouade-js/target/escouade-js.wasm.sha256)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: escouade-js
          path: |
            src-tauri/escouade-js/target/escouade-js.wasm
            src-tauri/escouade-js/target/escouade-js.wasm.sha256
          retention-days: 7

  build:
    name: Build and upload (${{ matrix.name }})
    needs: [create, escouade-js]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          # One app for Apple Silicon and Intel Macs; escouade-hook made universal too, which Tauri
          # leaves out (scripts/universal-hook.sh).
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.ort-macos.conf.json --config src-tauri/tauri.universal-macos.conf.json
          # The oldest Ubuntu GitHub still runs: the AppImage (which the in-app updater replaces)
          # and the .deb then start on the glibc of most distributions since 2022.
          - name: Linux
            os: ubuntu-22.04
            args: --config src-tauri/tauri.ort-linux.conf.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      # escouade-js, embedded in the app (src-tauri/build.rs).
      - name: Download escouade-js
        uses: actions/download-artifact@v7
        with:
          name: escouade-js
          path: src-tauri/escouade-js/target

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The seed of the plugins (ESC-338, docs/PLUGINS.md §8.7): what plugins/seed.json names, the store's bytes, every
      # signature checked with the public keys of store/keys/. A version not published, not signed or revoked stops the
      # release: the chef publishes first, the release comes after. Tauri packs src-tauri/seed/ in the installer.
      - name: Download and check the seed of the plugins
        shell: bash
        run: npx --yes tsx@4.23.15 store/scripts/seed.ts fetch

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - name: Rust targets of the universal macOS app
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # libasound2-dev: the microphone (cpal); libclang-dev and cmake: whisper.cpp, built by whisper-rs.
      - name: System libraries of the Linux app (WebKitGTK, tray, AppImage, sound, whisper.cpp)
        if: runner.os == 'Linux'
        run: |
          # A stalled mirror once held this step 28 minutes (2026-11-04): each request gives up after 30 s and is tried again.
          # Then Azure's mirror crawled through the big packages for all the 45 minutes of a job (2026-11-06): apt only leaves
          # a mirror that fails, so Canonical's, already in the runner's list, goes first and Azure's stays behind it.
          [ ! -f /etc/apt/apt-mirrors.txt ] || sudo sed -i -E 's/^(http:\/\/azure\.archive\S*\s+priority:)1/\14/' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libclang-dev cmake

      # whisper-rs generates its bindings with libclang: the runner's LLVM (cmake is there too).
      - name: libclang for whisper.cpp (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # whisper.cpp built again each time, as src-tauri/.cargo/whisper.cmake has it (its optimizations, which MSVC
      # lost, ESC-135): cargo would not see a change to that file, and the cache, restored from an older key when
      # Cargo.lock or config.toml changed, could hold a build of before (~1 min).
      - name: whisper.cpp from scratch (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo clean --release -p whisper-rs-sys

      - name: Install dependencies
        run: npm ci

      # Even when main's version was not bumped (a release created on GitHub's page): v0.1.12 was
      # refused for that, its release stayed empty and the updater found no latest.json.
      - name: App version from the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs "$TAG"

      # No tests here: the tag's commit passed them on main (the CI workflow, on each push). Run
      # again on each system, an intermittent test sent whole releases back to draft (1.7.0, 1.7.4).

      # Optional: with an Apple Developer ID certificate in the repository secrets, the app is
      # signed and notarized (no Gatekeeper warning). Without it, it is signed ad hoc. Only set
      # when present: an empty APPLE_CERTIFICATE would make the build try to import it.
      - name: Apple signing (when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              echo "::add-mask::${!v}"
              echo "$v=${!v}" >> "$GITHUB_ENV"
            fi
          done

      # Optional: with the Azure Artifact Signing account in the repository secrets (AZURE_*: an app registration that
      # has the Certificate Profile Signer role), Tauri signs escouade.exe, escouade-hook.exe, escouade-plugin.exe, the uninstaller and the
      # installer (Authenticode), before the updater's signature: SmartScreen then weighs the publisher's reputation
      # rather than each new file's. The script fetches Microsoft's dlib for signtool and gives the build a
      # configuration that signs through it; the dlib authenticates with the AZURE_* variables of the build step.
      # Without the secrets, a warning, and the build is not signed.
      - name: Windows signing (when configured)
        id: windows-signing
        if: runner.os == 'Windows'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: node scripts/windows-signing.mjs setup "$env:RUNNER_TEMP\windows-signing"

      # The conversation's voice on Intel Macs and Linux: Microsoft's ONNX Runtime, in the bundle (the Frameworks of the
      # app, the .deb and the AppImage: tauri.ort-<os>.conf.json, in the args of the matrix), its checksum checked.
      - name: ONNX Runtime for Intel Macs and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/onnxruntime.sh ${{ runner.os == 'macOS' && 'macos' || 'linux' }}

      # Uploads to the draft the create job made, by its id: tauri-action looks a release up by
      # tag (getReleaseByTag), which does not see a draft, and would make a second release. With
      # releaseId it creates and edits nothing, it only uploads the installers, their signatures
      # and latest.json. A job started again replaces its files of the same name: harmless.
      # tagName is still needed, it rewrites the `…/download/untagged-…/` links a draft gives in
      # latest.json to `…/download/<tag>/`. No releaseBody: tauri-action hands its inputs to the
      # build as variables, and Windows starts no process (MSBuild's nodes, whisper.cpp) with one
      # of more than 32,767 characters, which the notes of 1.8.0 are; the publish job writes them
      # into latest.json.
      - name: Build, sign and upload to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # What signtool's dlib signs with (Windows signing, above), on Windows only.
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
        with:
          releaseId: ${{ needs.create.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.windows-signing.outputs.args }}

      # Once signed, the installer and the binaries of the app in it: one publisher, and a timestamp (Artifact Signing's
      # certificates last three days; the timestamp keeps the signature valid after). A failure keeps the release a
      # draft, as a failed build does.
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && steps.windows-signing.outputs.args != ''
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Sort-Object LastWriteTime | Select-Object -Last 1
          node scripts/windows-signing.mjs verify $setup.FullName "$env:RUNNER_TEMP\signed-binaries"

      # escouade-plugins, the program of the plugins the app gives (INT-4), signed with the app on each system: the app
      # checks before it runs it that it is its own (its path in the app's folder and, where the system checks it, its
      # signature). Windows: the installer's check above covers it (scripts/windows-signing.mjs lists it). macOS: its code
      # signature holds in the universal app and, with the Developer ID secrets, Gatekeeper is asked (a warning only: the build requires the notarization itself).
      # Linux: the packages hold it; the updater's signature covers the AppImage. A failure keeps the release a draft.
      - name: Check the signature of escouade-plugins (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n 1)
          bin="$app/Contents/MacOS/escouade-plugins"
          test -x "$bin"
          lipo -info "$bin" | grep -q arm64
          lipo -info "$bin" | grep -q x86_64
          codesign --verify --strict --verbose=2 "$bin"
          codesign --verify --deep --strict "$app"
          # Only a warning: the build already requires the notarization, and Gatekeeper's reading must not keep a release a draft.
          if [ -n "$APPLE_ID" ]; then spctl --assess --type execute --verbose=2 "$app" || echo "::warning::spctl does not accept $app (the notarization is required by the build itself)"; fi
          # The plugins' WASM modules run from memory wasmtime makes executable: without these entitlements the hardened
          # runtime kills the app as soon as a plugin starts (2.2.0-beta.3 on every Mac). Their absence keeps the release a draft.
          ent=$(codesign -d --entitlements - --xml "$app" 2>/dev/null || codesign -d --entitlements :- "$app" 2>/dev/null)
          for k in com.apple.security.cs.allow-jit com.apple.security.cs.allow-unsigned-executable-memory com.apple.security.device.audio-input; do
            echo "$ent" | grep -q "$k" || { echo "::error::$app is signed without the entitlement $k"; exit 1; }
          done

      # escouade-plugin, the authors' command, compiles and plays the run.js plugins without Node (ESC-322): it embeds the
      # escouade-js of the `escouade-js` job, the same as the app's. A build without it keeps the release a draft.
      - name: Check escouade-plugin embeds escouade-js
        shell: bash
        run: |
          # The first that is there: under `-e -o pipefail`, an `ls` of the three would fail on the two missing.
          bin=
          for b in src-tauri/target/universal-apple-darwin/release/escouade-plugin src-tauri/target/release/escouade-plugin src-tauri/target/release/escouade-plugin.exe; do
            if [ -f "$b" ]; then bin=$b; break; fi
          done
          test -n "$bin"
          "$bin" --version
          "$bin" --version | grep -qx "escouade-js $(cat src-tauri/escouade-js/target/escouade-js.wasm.sha256)"

      - name: Check escouade-plugins is in the Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg -c src-tauri/target/release/bundle/deb/*.deb | grep -E 'usr/bin/escouade-plugins$'
          appimage=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage)
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract usr/bin/escouade-plugins >/dev/null && test -x squashfs-root/usr/bin/escouade-plugins)

  # Runs only when the three builds succeeded. The updater reads the latest release, so the draft
  # is published once its latest.json holds every system and each file it names is in: the three
  # builds each rewrite latest.json, and two at the same instant can lose one's system.
  publish:
    name: Publish the release once every system is in
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The notes of latest.json, which the in-app updater shows, are the version's section of
      # CHANGELOG.md, in French (the release's are in English, CHANGELOG.en.md): written here, once
      # the three builds are in (see the build step for why they don't). Then latest.json and the
      # files it names are checked.
      - name: Notes of latest.json, then check it and the files it names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create.outputs.release-id }}
          TAG: ${{ github.ref_name }}
        run: |
          latest_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
            jq -r 'map(select(.name == "latest.json")) | first | .id // empty' "$RUNNER_TEMP/assets.json"
          }
          asset=$(latest_id)
          if [ -z "$asset" ]; then
            echo "::error::The draft of $TAG has no latest.json"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/latest.json"
          node scripts/changelog.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          node -e '
            const fs = require("fs");
            const [file, notes] = process.argv.slice(1);
            const latest = JSON.parse(fs.readFileSync(file, "utf8"));
            latest.notes = fs.readFileSync(notes, "utf8").trimEnd();
            fs.writeFileSync(file, JSON.stringify(latest, null, 2));
          ' "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/notes.md"
          jq -e '.notes | length > 0' "$RUNNER_TEMP/latest.json" > /dev/null
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/latest.json" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" > /dev/null
          asset=$(latest_id)
          if [ -z "$asset" ]; then
            echo "::error::latest.json of $TAG could not be uploaded again with its notes"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/latest.json"
          jq -e '.notes | length > 0' "$RUNNER_TEMP/latest.json" > /dev/null
          node scripts/release-check.mjs "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/assets.json" "$TAG"

      # The beta channel (ESC-374): beta.json, always in the latest stable release, holds the most
      # recent version, stable or beta (scripts/beta-channel.mjs picks it); an app with « Recevoir
      # les versions bêta » reads it before latest.json, which never holds a beta. A stable version
      # puts its own in its draft, before it becomes the latest: its latest.json, or the beta.json of
      # the latest release now when that one is newer (a beta of the next version under way).
      - name: Beta channel of a stable version
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create.outputs.release-id }}
          TAG: ${{ github.ref_name }}
        run: |
          # The beta.json of the latest release now, into $RUNNER_TEMP/beta-now.json (empty without one).
          beta_now() {
            : > "$RUNNER_TEMP/beta-now.json"
            latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id' 2>/dev/null || true)
            [ -n "$latest_release" ] || return 0
            gh api "repos/$GITHUB_REPOSITORY/releases/$latest_release/assets?per_page=100" > "$RUNNER_TEMP/latest-assets.json"
            local id
            id=$(jq -r 'map(select(.name == "beta.json")) | first | .id // empty' "$RUNNER_TEMP/latest-assets.json")
            [ -z "$id" ] || gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$RUNNER_TEMP/beta-now.json"
          }
          # Puts $RUNNER_TEMP/beta.json in the release $1, in place of the one there.
          put_beta() {
            local id
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$1/assets?per_page=100"               --jq 'map(select(.name == "beta.json")) | first | .id // empty')
            [ -z "$id" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json"               --data-binary "@$RUNNER_TEMP/beta.json"               "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$1/assets?name=beta.json" > /dev/null
          }
          beta_now
          node scripts/beta-channel.mjs pick "$TAG" "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/beta-now.json" > "$RUNNER_TEMP/beta.json"
          put_beta "$RELEASE_ID"

      # By id, as the draft is not found by tag. A pre-release cannot be the latest release. If
      # GitHub refuses ("Resource not accessible by integration"), the draft is complete: publish
      # it by hand, `gh release edit <tag> --draft=false --latest`.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create.outputs.release-id }}
          TAG: ${{ github.ref_name }}
        run: |
          latest=true
          if [[ "$TAG" == *-* ]]; then latest=false; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=$latest > /dev/null

      # A beta, once published (beta.json names its files, which a draft does not serve): its
      # latest.json, notes included, becomes the beta.json of the latest release, in place of the
      # one there, unless that one is newer. Its own latest.json stays in its release, which is
      # never the latest: the versions without the option never see it.
      - name: Beta channel of a beta
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The beta.json of the latest release now, into $RUNNER_TEMP/beta-now.json (empty without one).
          beta_now() {
            : > "$RUNNER_TEMP/beta-now.json"
            latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id' 2>/dev/null || true)
            [ -n "$latest_release" ] || return 0
            gh api "repos/$GITHUB_REPOSITORY/releases/$latest_release/assets?per_page=100" > "$RUNNER_TEMP/latest-assets.json"
            local id
            id=$(jq -r 'map(select(.name == "beta.json")) | first | .id // empty' "$RUNNER_TEMP/latest-assets.json")
            [ -z "$id" ] || gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$RUNNER_TEMP/beta-now.json"
          }
          # Puts $RUNNER_TEMP/beta.json in the release $1, in place of the one there.
          put_beta() {
            local id
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$1/assets?per_page=100"               --jq 'map(select(.name == "beta.json")) | first | .id // empty')
            [ -z "$id" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json"               --data-binary "@$RUNNER_TEMP/beta.json"               "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$1/assets?name=beta.json" > /dev/null
          }
          beta_now
          if [ -z "$latest_release" ]; then
            echo "::error::No latest release to hold the beta.json of $TAG"
            exit 1
          fi
          node scripts/beta-channel.mjs pick "$TAG" "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/beta-now.json" > "$RUNNER_TEMP/beta.json"
          put_beta "$latest_release"

      # What the in-app updater downloads: the latest release's, or the pre-release's own (it is
      # never the latest). GitHub's cache can take a moment to follow the publication.
      - name: Check what the updater reads
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latest.json"
          else
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          fi
          expected="${TAG#v}"
          for attempt in 1 2 3 4 5 6; do
            version=$(curl -fsSL "$url" | jq -r '.version // empty') || version=
            if [ "$version" = "$expected" ]; then
              echo "$url says version $version"
              exit 0
            fi
            echo "Try $attempt of 6: $url says '${version}', expected '$expected'"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::The updater would not read $TAG: $url does not say version $expected"
          exit 1

      # What the updater reads with « Recevoir les versions bêta »: beta.json of the latest release,
      # the tag's version or a newer one; and latest.json there never holds a beta.
      - name: Check what the updater reads with the betas
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$base/beta.json" -o "$RUNNER_TEMP/beta-read.json"               && node scripts/beta-channel.mjs check "$TAG" "$RUNNER_TEMP/beta-read.json" > "$RUNNER_TEMP/beta-check.txt"; then
              cat "$RUNNER_TEMP/beta-check.txt"
              stable=$(curl -fsSL "$base/latest.json" | jq -r '.version // empty')
              if [[ -z "$stable" || "$stable" == *-* ]]; then
                echo "::error::$base/latest.json says version '$stable': it must be a stable version"
                exit 1
              fi
              exit 0
            fi
            echo "Try $attempt of 6: $base/beta.json is not right yet"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          cat "$RUNNER_TEMP/beta-check.txt" 2>/dev/null || true
          echo "::error::The updater with the betas would not read $TAG: $base/beta.json is not right"
          exit 1

  # Once the updater reads the version, its notes go to the Discord. A job of its own: `gh run
  # rerun <id> --failed` after a refusal of Discord's posts them again without publishing again,
  # and a failed build announces nothing. A pre-release is not announced.
  announce:
    name: Announce on Discord
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/discord.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
