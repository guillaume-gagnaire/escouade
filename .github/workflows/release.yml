name: Release

# A tag `vX.Y.Z` (pushed, or created with a release on GitHub's page) publishes a release: NSIS
# installer (Windows), universal app and disk image (macOS), AppImage and .deb (Linux), signed
# updater artifacts and the latest.json of the in-app updater, which holds the three systems. The app gets the tag's version.
# The release is a draft while the three builds upload to it (~30 min, each one rewriting
# latest.json), and the last job publishes it once latest.json and every file it names are in:
# the in-app updater reads the latest release, so it never meets a half-built one. A failed build
# just leaves the draft, and the previous release stays the latest.
# It only builds: the tests run on each push to main (ci.yml), and a tag is put on a commit whose
# CI is green.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create:
    name: Create the release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # Sets it in this checkout only: fails unless the tag is a version.
      - name: Check that the tag is a version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs "$TAG"

      # Created before the long builds, while the tag is still the head of main: once main has
      # moved past it, GITHUB_TOKEN may no longer create the release ("Resource not accessible by
      # integration", it would need the `workflows` permission it cannot have). It is a draft, and
      # the builds and the last job find it by its id: the by-tag lookups do not see a draft. A
      # release that already exists for the tag (made on GitHub's page, or a run started again)
      # goes back to draft; the API lists drafts too, `gh release view` does not.
      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          release_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq 'map(select(.tag_name == env.TAG)) | first | .id // empty'
          }
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          id=$(release_id)
          if [ -n "$id" ]; then
            # A pre-release tag keeps its mark too, whatever the page of GitHub was ticked with.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true -F prerelease=$prerelease > /dev/null
          else
            flags=()
            [ "$prerelease" = true ] && flags+=(--prerelease)
            # The version's section of CHANGELOG.en.md, in English (a sentence pointing at the
            # commits without one; a CI test keeps every version in it, scripts/changelog.test.ts).
            node scripts/changelog.mjs "$TAG" --lang en > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag --draft --title "Escouade $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
            # The list may take a moment to show the new draft.
            for attempt in 1 2 3 4 5; do
              id=$(release_id)
              [ -n "$id" ] && break
              sleep 3
            done
          fi
          if [ -z "$id" ]; then
            echo "::error::No release found for $TAG, the builds have nowhere to upload"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build and upload (${{ matrix.name }})
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          # One app for Apple Silicon and Intel Macs; escouade-hook made universal too, which Tauri
          # leaves out (scripts/universal-hook.sh).
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.ort-macos.conf.json --config src-tauri/tauri.universal-macos.conf.json
          # The oldest Ubuntu GitHub still runs: the AppImage (which the in-app updater replaces)
          # and the .deb then start on the glibc of most distributions since 2022.
          - name: Linux
            os: ubuntu-22.04
            args: --config src-tauri/tauri.ort-linux.conf.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - name: Rust targets of the universal macOS app
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # libasound2-dev: the microphone (cpal); libclang-dev and cmake: whisper.cpp, built by whisper-rs.
      - name: System libraries of the Linux app (WebKitGTK, tray, AppImage, sound, whisper.cpp)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libclang-dev cmake

      # whisper-rs generates its bindings with libclang: the runner's LLVM (cmake is there too).
      - name: libclang for whisper.cpp (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # whisper.cpp built again each time, as src-tauri/.cargo/whisper.cmake has it (its optimizations, which MSVC
      # lost, ESC-135): cargo would not see a change to that file, and the cache, restored from an older key when
      # Cargo.lock or config.toml changed, could hold a build of before (~1 min).
      - name: whisper.cpp from scratch (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo clean --release -p whisper-rs-sys

      - name: Install dependencies
        run: npm ci

      # Even when main's version was not bumped (a release created on GitHub's page): v0.1.12 was
      # refused for that, its release stayed empty and the updater found no latest.json.
      - name: App version from the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs "$TAG"

      # No tests here: the tag's commit passed them on main (the CI workflow, on each push). Run
      # again on each system, an intermittent test sent whole releases back to draft (1.7.0, 1.7.4).

      # Optional: with an Apple Developer ID certificate in the repository secrets, the app is
      # signed and notarized (no Gatekeeper warning). Without it, it is signed ad hoc. Only set
      # when present: an empty APPLE_CERTIFICATE would make the build try to import it.
      - name: Apple signing (when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              echo "::add-mask::${!v}"
              echo "$v=${!v}" >> "$GITHUB_ENV"
            fi
          done

      # Optional: with the Azure Artifact Signing account in the repository secrets (AZURE_*: an app registration that
      # has the Certificate Profile Signer role), Tauri signs escouade.exe, escouade-hook.exe, escouade-plugin.exe, the uninstaller and the
      # installer (Authenticode), before the updater's signature: SmartScreen then weighs the publisher's reputation
      # rather than each new file's. The script fetches Microsoft's dlib for signtool and gives the build a
      # configuration that signs through it; the dlib authenticates with the AZURE_* variables of the build step.
      # Without the secrets, a warning, and the build is not signed.
      - name: Windows signing (when configured)
        id: windows-signing
        if: runner.os == 'Windows'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: node scripts/windows-signing.mjs setup "$env:RUNNER_TEMP\windows-signing"

      # The conversation's voice on Intel Macs and Linux: Microsoft's ONNX Runtime, in the bundle (the Frameworks of the
      # app, the .deb and the AppImage: tauri.ort-<os>.conf.json, in the args of the matrix), its checksum checked.
      - name: ONNX Runtime for Intel Macs and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/onnxruntime.sh ${{ runner.os == 'macOS' && 'macos' || 'linux' }}

      # Uploads to the draft the create job made, by its id: tauri-action looks a release up by
      # tag (getReleaseByTag), which does not see a draft, and would make a second release. With
      # releaseId it creates and edits nothing, it only uploads the installers, their signatures
      # and latest.json. A job started again replaces its files of the same name: harmless.
      # tagName is still needed, it rewrites the `…/download/untagged-…/` links a draft gives in
      # latest.json to `…/download/<tag>/`. No releaseBody: tauri-action hands its inputs to the
      # build as variables, and Windows starts no process (MSBuild's nodes, whisper.cpp) with one
      # of more than 32,767 characters, which the notes of 1.8.0 are; the publish job writes them
      # into latest.json.
      - name: Build, sign and upload to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # What signtool's dlib signs with (Windows signing, above), on Windows only.
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
        with:
          releaseId: ${{ needs.create.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.windows-signing.outputs.args }}

      # Once signed, the installer and the binaries of the app in it: one publisher, and a timestamp (Artifact Signing's
      # certificates last three days; the timestamp keeps the signature valid after). A failure keeps the release a
      # draft, as a failed build does.
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && steps.windows-signing.outputs.args != ''
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Sort-Object LastWriteTime | Select-Object -Last 1
          node scripts/windows-signing.mjs verify $setup.FullName "$env:RUNNER_TEMP\signed-binaries"

  # Runs only when the three builds succeeded. The updater reads the latest release, so the draft
  # is published once its latest.json holds every system and each file it names is in: the three
  # builds each rewrite latest.json, and two at the same instant can lose one's system.
  publish:
    name: Publish the release once every system is in
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The notes of latest.json, which the in-app updater shows, are the version's section of
      # CHANGELOG.md, in French (the release's are in English, CHANGELOG.en.md): written here, once
      # the three builds are in (see the build step for why they don't). Then latest.json and the
      # files it names are checked.
      - name: Notes of latest.json, then check it and the files it names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create.outputs.release-id }}
          TAG: ${{ github.ref_name }}
        run: |
          latest_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
            jq -r 'map(select(.name == "latest.json")) | first | .id // empty' "$RUNNER_TEMP/assets.json"
          }
          asset=$(latest_id)
          if [ -z "$asset" ]; then
            echo "::error::The draft of $TAG has no latest.json"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/latest.json"
          node scripts/changelog.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          node -e '
            const fs = require("fs");
            const [file, notes] = process.argv.slice(1);
            const latest = JSON.parse(fs.readFileSync(file, "utf8"));
            latest.notes = fs.readFileSync(notes, "utf8").trimEnd();
            fs.writeFileSync(file, JSON.stringify(latest, null, 2));
          ' "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/notes.md"
          jq -e '.notes | length > 0' "$RUNNER_TEMP/latest.json" > /dev/null
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/latest.json" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" > /dev/null
          asset=$(latest_id)
          if [ -z "$asset" ]; then
            echo "::error::latest.json of $TAG could not be uploaded again with its notes"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/latest.json"
          jq -e '.notes | length > 0' "$RUNNER_TEMP/latest.json" > /dev/null
          node scripts/release-check.mjs "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/assets.json" "$TAG"

      # By id, as the draft is not found by tag. A pre-release cannot be the latest release. If
      # GitHub refuses ("Resource not accessible by integration"), the draft is complete: publish
      # it by hand, `gh release edit <tag> --draft=false --latest`.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create.outputs.release-id }}
          TAG: ${{ github.ref_name }}
        run: |
          latest=true
          if [[ "$TAG" == *-* ]]; then latest=false; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=$latest > /dev/null

      # What the in-app updater downloads: the latest release's, or the pre-release's own (it is
      # never the latest). GitHub's cache can take a moment to follow the publication.
      - name: Check what the updater reads
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latest.json"
          else
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          fi
          expected="${TAG#v}"
          for attempt in 1 2 3 4 5 6; do
            version=$(curl -fsSL "$url" | jq -r '.version // empty') || version=
            if [ "$version" = "$expected" ]; then
              echo "$url says version $version"
              exit 0
            fi
            echo "Try $attempt of 6: $url says '${version}', expected '$expected'"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::The updater would not read $TAG: $url does not say version $expected"
          exit 1

  # Once the updater reads the version, its notes go to the Discord. A job of its own: `gh run
  # rerun <id> --failed` after a refusal of Discord's posts them again without publishing again,
  # and a failed build announces nothing. A pre-release is not announced.
  announce:
    name: Announce on Discord
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/discord.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
