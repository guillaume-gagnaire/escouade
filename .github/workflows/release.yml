name: Release

# A tag `vX.Y.Z` (pushed, or created with a release on GitHub's page) publishes a release: NSIS
# installer (Windows), universal app and disk image (macOS), signed updater artifacts and the
# latest.json of the in-app updater, which holds both systems. The app gets the tag's version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create:
    name: Create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sets it in this checkout only: fails unless the tag is a version.
      - name: Check that the tag is a version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs "$TAG"

      # Created before the long builds, while the tag is still the head of main: once main has
      # moved past it, GITHUB_TOKEN may no longer create the release ("Resource not accessible by
      # integration", it would need the `workflows` permission it cannot have). tauri-action then
      # finds this release and only uploads the installers, their signatures and latest.json to it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 && exit 0
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          # The version's section of CHANGELOG.md (a sentence pointing at the commits without one).
          node scripts/changelog.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "Escouade $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

  build:
    name: Build and publish (${{ matrix.name }})
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          # One app for Apple Silicon and Intel Macs.
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - name: Rust targets of the universal macOS app
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Even when main's version was not bumped (a release created on GitHub's page): v0.1.12 was
      # refused for that, its release stayed empty and the updater found no latest.json.
      - name: App version from the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs "$TAG"

      - name: Tests
        run: |
          npm test
          cd src-tauri
          cargo test

      # Optional: with an Apple Developer ID certificate in the repository secrets, the app is
      # signed and notarized (no Gatekeeper warning). Without it, it is signed ad hoc. Only set
      # when present: an empty APPLE_CERTIFICATE would make the build try to import it.
      - name: Apple signing (when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              echo "::add-mask::${!v}"
              echo "$v=${!v}" >> "$GITHUB_ENV"
            fi
          done

      # The same notes go into latest.json, which the in-app updater reads.
      - name: Release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo 'body<<ESCOUADE_NOTES_END'
            node scripts/changelog.mjs "$TAG"
            echo 'ESCOUADE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Escouade ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The updater reads the latest release: one without latest.json, or whose latest.json misses a
  # system (one build failed), would stop updates. Back to draft, the previous release is the
  # latest again.
  guard:
    name: Keep the updater on a complete release
    needs: [create, build]
    if: always() && needs.build.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Back to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || exit 0
          echo "::error::$TAG was not built for every system: back to draft, the updater stays on the previous release"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          exit 1
