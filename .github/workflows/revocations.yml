name: Revocations

# The copy of the store's revocation list on escouade.dev (docs/STORE.md §4.6 and §8.1): every 15 minutes, the list
# store.escouade.dev serves is copied into website/public/ if one of the public keys of store/keys/ signed it and its
# serial is above the copy's (store/scripts/copy-revocations.ts); the commit on main makes Coolify redeploy the site,
# which serves it at https://escouade.dev/revocations.json and its .minisig. An hour late at most. A list that does
# not hold fails the run, which GitHub tells by e-mail; the store down leaves the copy as it is.
#
# Every Monday (audit SEC-15), the list copied is republished even unchanged: the freshness key (secret
# REVOCATIONS_FRESHNESS_KEY, given to that step alone) signs « the list n° N of fingerprint X still holds on <date> »
# (store/scripts/attest-revocations.ts), served beside it as revocations-fresh.json. The app warns when what it holds
# is more than 7 days old. Without the secret, the list stays as it was signed and the run's summary says so.

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revocations
  cancel-in-progress: false

jobs:
  copy:
    name: Copy the revocation list
    # Only in the origin repository: a copy would commit the list on its own main (ESC-483).
    if: github.repository == 'guillaume-gagnaire/escouade'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The commit on main is all it writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The script imports node's modules alone (and minisign.ts): tsx, pinned, is all it needs.
      - name: Copy the list if it changed
        id: copy
        run: npx --yes tsx@4.23.15 store/scripts/copy-revocations.ts --out website/public --keys store/keys

      # The weekly republication: an attestation of freshness, never a list. Asked by hand too.
      - name: Attest that the list still holds
        id: attest
        if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          REVOCATIONS_FRESHNESS_KEY: ${{ secrets.REVOCATIONS_FRESHNESS_KEY }}
        run: npx --yes tsx@4.23.15 store/scripts/attest-revocations.ts --out website/public --keys store/keys --fresh store/freshness

      - name: Commit the copy on main
        if: steps.copy.outputs.changed == 'true' || steps.attest.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/public/revocations.json website/public/revocations.json.minisig
          if [ -f website/public/revocations-fresh.json ]; then
            git add website/public/revocations-fresh.json website/public/revocations-fresh.json.minisig
          fi
          git commit -m "chore(site): la liste de révocation du store copiée ou attestée sur escouade.dev"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
