<!doctype html>
<!-- A made-up project's page (the « Atelier » project's login), drawn where the app's own webview would be.
     ?theme=light|dark; ?lang=en; ?sso=1: « Continue with Exemple ID » first; ?marque=<label> (?cible=<id>): the contour drive_browser puts (src-tauri/src/browserdrive.js, highlight). -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atelier · Connexion</title>
    <style>
      :root {
        --fond: #f4f1ec;
        --carte: #fff;
        --texte: #1f1d1a;
        --doux: #6f6a62;
        --bord: #e2ddd4;
        --accent: #2f6f5e;
      }
      :root.dark {
        --fond: #17181b;
        --carte: #202226;
        --texte: #ecebe8;
        --doux: #9c9a95;
        --bord: #33353a;
        --accent: #5fb39b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--fond);
        color: var(--texte);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--bord);
        font-weight: 650;
      }
      header i {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--accent);
      }
      main {
        max-width: 380px;
        margin: 56px auto;
        padding: 28px;
        border: 1px solid var(--bord);
        border-radius: 12px;
        background: var(--carte);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      p {
        margin: 0 0 22px;
        color: var(--doux);
      }
      label {
        display: block;
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .champ {
        height: 38px;
        margin: 0 0 16px;
        border: 1px solid var(--bord);
        border-radius: 8px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        color: var(--doux);
      }
      button {
        width: 100%;
        height: 40px;
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font:
          600 15px system-ui,
          sans-serif;
      }
      .sso,
      .ou {
        display: none;
      }
      .sso-on .sso {
        display: block;
        margin: 0;
        background: var(--carte);
        color: var(--texte);
        border: 1px solid var(--bord);
      }
      .sso-on .ou {
        display: block;
        margin: 14px 0;
        text-align: center;
        font-size: 13px;
        color: var(--doux);
      }
      .bas {
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
        color: var(--doux);
      }
    </style>
  </head>
  <body>
    <header><i></i>Atelier</header>
    <main>
      <h1 data-en="Sign in">Connexion</h1>
      <p data-en="Find your workshops and who signed up.">Retrouve tes ateliers et tes inscrits.</p>
      <button class="sso" id="sso" data-en="Continue with Exemple ID">Continuer avec Exemple ID</button>
      <div class="ou" data-en="or">ou</div>
      <label data-en="Email address">Adresse e-mail</label>
      <div class="champ">camille@exemple.test</div>
      <label data-en="Password">Mot de passe</label>
      <div class="champ">••••••••</div>
      <button id="entrer" data-en="Sign in">Se connecter</button>
      <div class="bas" data-en="No account yet? Create one">Pas encore de compte ? Créer un compte</div>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
      if (q.get('sso')) document.documentElement.classList.add('sso-on');
      if (q.get('lang') === 'en') {
        document.documentElement.lang = 'en';
        document.title = 'Atelier · Sign in';
        for (const el of document.querySelectorAll('[data-en]')) el.textContent = el.dataset.en;
      }
      const label = q.get('marque');
      if (label) {
        // As browserdrive.js draws it: a contour at the project's colour, its label above.
        const el = document.getElementById(q.get('cible') || 'entrer'),
          r = el.getBoundingClientRect(),
          color = '#e0884a';
        const ring = document.createElement('div');
        ring.style.cssText = `position:absolute;box-sizing:border-box;border:2px solid ${color};border-radius:6px;box-shadow:0 0 0 4px ${color}33;left:${r.x - 4}px;top:${r.y + scrollY - 4}px;width:${r.width + 8}px;height:${r.height + 8}px;pointer-events:none`;
        const tag = document.createElement('div');
        tag.textContent = label;
        tag.style.cssText = `position:absolute;font:600 12px/1.4 system-ui,sans-serif;color:#fff;background:${color};padding:2px 8px;border-radius:4px;white-space:nowrap;left:${Math.max(4, r.x - 4)}px;top:${r.y + scrollY - 26}px`;
        document.documentElement.append(ring, tag);
      }
    </script>
  </body>
</html>
