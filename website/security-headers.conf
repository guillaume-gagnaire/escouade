# The security headers of the site's answers (SEC-16 of the 2.2.0 audit). Included in the site's server and again in
# each location that sets a header of its own: nginx drops the server's add_header where a location has one.
# The policy of the scripts is in each page, named by their hashes (website/csp.ts); this one adds what a page's
# <meta> cannot carry (frame-ancestors), and holds for what is not a page.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
