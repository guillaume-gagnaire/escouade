# Coolify's proxy terminates HTTPS and passes the requests on here.

# The site's former address (GitHub Pages) and www lead to the same page on escouade.dev, for good.
server {
    listen 80;
    server_name escouade.gagnaire.dev www.escouade.dev;
    # The reverse proxy in front already logs every request.
    access_log off;
    return 301 https://escouade.dev$request_uri;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    # The reverse proxy in front already logs every request.
    access_log off;

    # Relative redirects (/docs → /docs/): an absolute one would name the container's own scheme and port.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/vtt;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Nuxt's files carry a hash of their content in their name.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The copy of the store's revocation list (docs/STORE.md §4.6), committed by .github/workflows/revocations.yml:
    # asked again each time, so that an app never reads a stale one from a cache.
    location = /revocations.json {
        add_header Cache-Control "public, no-cache";
        types {}
        default_type application/json;
    }
    location = /revocations.json.minisig {
        add_header Cache-Control "public, no-cache";
        types {}
        default_type text/plain;
    }

    # The video's subtitles: nginx knows no type for them, and Firefox drops a track not served as text/vtt.
    location ~ \.vtt$ {
        types {}
        default_type text/vtt;
    }

    error_page 404 /404.html;
}
