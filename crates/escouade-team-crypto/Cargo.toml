[package]
name = "escouade-team-crypto"
version = "0.1.0"
description = "Escouade's team server, mock-up of its cryptography (TS-0a): the team as an MLS group (RFC 9420, openmls), project keys by epoch, the history layer, invitations, recovery and escrow, fork and rollback detection"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
# openmls 0.9 asks for 1.91.
rust-version = "1.91"
workspace = "../../src-tauri"
# A mock-up, wired into nothing yet (docs/TEAM-SERVER.md §16, TS-0a): never published.
publish = false

[dependencies]
# MLS (RFC 9420): the group, its commits, Welcome and KeyPackages. MIT, by the OpenMLS authors (Phoenix R&D, Cryspen).
openmls = "0.9.2"
# The crypto of openmls on RustCrypto (and hpke-rs), and its in-memory storage.
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
# What is ours above MLS: the content (XChaCha20-Poly1305, as openmls_rust_crypto's own chacha20poly1305), HKDF, HMAC.
chacha20poly1305 = "0.10"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
# The recovery key's 24 words (BIP-39, English list), and the Ed25519 key they give.
bip39 = { version = "3", default-features = false, features = ["std"] }
ed25519-dalek = "2"
base64 = "0.22"
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
