[package]
name = "escouade-voice-local"
version = "0.1.0"
description = "Escouade's voice on the machine: the microphone (cpal), the dictation (whisper.cpp), the end of a sentence heard (VAD), the reading (Piper's voices, eSpeak NG and ONNX Runtime) and the download of their models"
authors = ["Guillaume Gagnaire"]
# eSpeak NG's port (GPL-3.0-or-later) is linked in, as in the app.
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../src-tauri"
# A part of the app, cut out of its crate for it to compile faster (docs/CRATES.md): never published.
publish = false

[features]
# ONNX Runtime loaded from a library at run time, as on Intel Macs and Linux (the app's `ort-dynamic`).
ort-dynamic = ["ort/load-dynamic"]

[dependencies]
# The texts of the errors, in the app's two languages (`tr_in!`, `Lang`), and those of a service on line.
escouade-plugin-cli = { path = "../escouade-plugin-cli" }
escouade-plugin-kit = { path = "../escouade-plugin-kit" }
escouade-voice = { path = "../escouade-voice" }
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
# The microphone through cpal (WASAPI, CoreAudio, ALSA), transcribed by whisper.cpp (whisper-rs builds it, with cmake).
cpal = "0.18"
whisper-rs = { version = "0.16", features = ["log_backend"] }
# A WAV file as the sound source: the end-to-end tests, which have no microphone.
hound = "3.5"
# Piper's voices: the text becomes phonemes through eSpeak NG (its port to Rust, the data of French and English built
# in), which the voice's VITS model, run by ONNX Runtime, turns into sound.
espeak-ng = { version = "0.2", default-features = false, features = ["bundled-data-fr", "bundled-data-en"] }

[dev-dependencies]
escouade-base = { path = "../escouade-base", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
dirs = "6"

# ONNX Runtime, linked in statically on Windows and Apple Silicon (pyke's builds, downloaded by its build script). Pyke
# builds none for Intel Macs, and its Linux one needs glibc 2.38: there Microsoft's own library (1.23.2, glibc 2.27) is
# shipped in the bundle (scripts/onnxruntime.sh, tauri.ort-<os>.conf.json) and loaded at run time.
[target.'cfg(any(windows, all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-22"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Dictation on the GPU (Metal), whisper.cpp's shaders built into the binary.
whisper-rs = { version = "0.16", features = ["log_backend", "metal"] }
