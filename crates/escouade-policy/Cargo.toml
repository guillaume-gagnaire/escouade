[package]
name = "escouade-policy"
version = "0.1.0"
description = "Escouade's managed-device policies (TS-0b, TS-12): the single list of the policies and what is generated from it, the Policies registry keys on Windows, the managed preferences domain on macOS, /etc/escouade/policies on Linux, read into one model and watched"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../src-tauri"
# Read by the app (locks.rs); never published.
publish = false

[dependencies]
# The one bound of the tickets at once (`parallel`, ESC-620), that `projects.maxParallel` lowers.
escouade-model = { path = "../escouade-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# The registry, as the app's own dependencies already read it (winreg 0.55 is in the lock).
winreg = "0.55"
# Whether this process is elevated (a Policies key it may write without being so has had its ACL loosened), and
# RegNotifyChangeKeyValue to read the policies again when they change (watch.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# CFPreferencesCopyAppValue and CFPreferencesAppValueIsForced (core-foundation-sys), and the CF types around them.
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3"
# The generated property lists and XML read back by the tests (both already in the lock, by tauri).
plist = "1"
quick-xml = "0.42"
