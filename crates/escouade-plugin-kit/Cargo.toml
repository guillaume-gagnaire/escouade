[package]
name = "escouade-plugin-kit"
version = "0.1.0"
description = "What Escouade's plugins in Rust share, in process or as a WASM module: the loop, the service of code hosts and Kanban sources, their typed errors and their rate limits"
authors = ["Guillaume Gagnaire"]
license = "MIT"
repository = "https://github.com/guillaume-gagnaire/escouade"
homepage = "https://escouade.dev"
documentation = "https://docs.rs/escouade-plugin-kit"
readme = "README.md"
keywords = ["escouade","plugin","sdk","wasm","async"]
categories = ["development-tools","wasm","asynchronous"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]
edition = "2021"
rust-version = "1.88"
workspace = "../../src-tauri"

# Shared by the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3) and by the core, which takes from it the contract of
# a code host (`Forge`) and its errors, so that a plugin's client and the core's adapters speak the same.
[dependencies]
escouade-plugin-protocol = { path = "../escouade-plugin-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
chrono = "0.4"
base64 = "0.22"

# In a module (wasm32-wasip1), neither of them: `serve` is a reactor and `http::reqwest` goes through `net/fetch`.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# docs.rs builds the two targets a plugin compiles for.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "wasm32-wasip1"]
