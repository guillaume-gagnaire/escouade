[package]
name = "escouade-plugin-{{package}}"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# `cdylib` is the module Escouade runs; `rlib` lets your own tests reach the crate.
[lib]
name = "plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
escouade-plugin-kit = "0.1.0"
serde_json = "1"

# Only for `cargo test`, on your machine: the module has no tokio.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt"] }

# The plugin stands alone: a repository with several plugins does not make it a member of anything.
[workspace]
