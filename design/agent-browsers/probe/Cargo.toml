# The probe of ESC-663: what an agent could do in a real webview of this system (capture, console,
# read, click, type, width, highlight), and what a hostile page can do against it. A study, outside
# the product: its own workspace, never built by the app's CI. `README.md` says how to run it.
[package]
name = "agent-browsers-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The versions the app's Tauri uses (src-tauri/Cargo.lock).
wry = { version = "=0.57.0", features = ["devtools"] }
tao = "=0.37.1"
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
javascriptcore-rs = "=1.1.2"

# Built on the macOS runner only (not in ESC-663: nothing was pushed).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
