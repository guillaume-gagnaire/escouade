<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Escouade — écran partagé (ESC-392), aperçu</title>
    <!-- Les aperçus de l'écran partagé (ESC-392) : apercu.html#<direction>-<scène>, direction a, b ou c, scène cote
         (un agent et un terminal côte à côte), pile (deux agents l'un sur l'autre) ou glisser (le geste en cours).
         Les jetons sont ceux de src/app.css (thème sombre, projet orange), la coque celle de la 2.0. -->
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/opsz.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/500.css" />
    <style>
      :root {
        --p: oklch(0.72 0.12 48);
        --frame: color-mix(in oklch, var(--p) 8%, #08090a);
        --panel: color-mix(in oklch, var(--p) 4.5%, #0e0f11);
        --raise: color-mix(in oklch, var(--p) 6%, #15161a);
        --well: color-mix(in oklch, var(--p) 2%, #0a0b0d);
        --line: rgba(255, 255, 255, 0.075);
        --line-2: rgba(255, 255, 255, 0.12);
        --hover: rgba(255, 255, 255, 0.045);
        --text: #f7f8f8;
        --soft: #d0d3d8;
        --muted: #989da6;
        --dim: #8f949e;
        --brand: #35c1bd;
        --p-ink: color-mix(in oklch, var(--p) 70%, white);
        --p-soft: color-mix(in oklch, var(--p) 14%, transparent);
        --run: oklch(0.79 0.15 155);
        --wait: oklch(0.84 0.14 82);
        --wait-bg: oklch(from var(--wait) l c h / 0.07);
        --wait-line: oklch(from var(--wait) l c h / 0.32);
        --add: oklch(0.8 0.13 155);
        --del: oklch(0.74 0.14 22);
        --idle: #7a7f88;
        --primary: #f2f3f4;
        --on-primary: #08090a;
        --code-fg: #d5d8dd;
        --syn-k: oklch(0.78 0.11 300);
        --syn-f: oklch(0.83 0.09 235);
        --syn-s: oklch(0.82 0.11 150);
        --syn-n: oklch(0.84 0.11 65);
        --ansi-y: oklch(0.85 0.12 85);
        --ansi-cy: oklch(0.82 0.09 205);
        --font: 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        --rail: 52px;
        --side: 276px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1440px; height: 900px; overflow: hidden; background: var(--frame); }
      body { font-family: var(--font); font-size: 13px; color: var(--text); -webkit-font-smoothing: antialiased; }
      svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      .mono { font-family: var(--mono); }

      /* La coque (App.svelte) */
      .root { position: relative; isolation: isolate; height: 900px; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); grid-template-rows: 44px minmax(0, 1fr) 30px; overflow: hidden; }
      .root::before { content: ''; position: absolute; inset: 0 0 auto; height: 520px; z-index: -1; background: radial-gradient(80% 100% at 18% 0%, color-mix(in oklch, var(--p) 14%, transparent), transparent 75%); }
      .title { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 0 0 14px; }
      .logo { width: 22px; height: 22px; border-radius: 6px; background: #35c1bd; display: grid; place-items: center; color: #08090a; font-weight: 800; font-size: 12px; }
      .pname { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; margin-left: 10px; }
      .pname .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--p); }
      .pname small { color: var(--muted); font-weight: 500; font-size: 12px; }
      .search { margin-left: auto; margin-right: auto; transform: translateX(-60px); width: 340px; height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--muted); }
      .search kbd { margin-left: auto; }
      kbd { font-family: var(--font); font-size: 11px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; line-height: 17px; }
      .winbtns { display: flex; align-items: center; height: 44px; color: var(--soft); }
      .winbtns span { width: 46px; display: grid; place-items: center; }
      .tb-ed { display: flex; gap: 7px; align-items: center; color: var(--soft); margin-right: 18px; }

      .rail { grid-row: 2 / 3; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px; }
      .tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #101114; position: relative; }
      .tile.on { box-shadow: 0 0 0 2px var(--frame), 0 0 0 3.5px var(--p-ink); }
      .rail .sep { width: 24px; height: 1px; background: var(--line-2); }
      .rail .add { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--muted); }
      .badge { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--wait); color: #1a1405; font-size: 10px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--frame); }

      .body { grid-column: 2; grid-row: 2; display: flex; min-width: 0; min-height: 0; padding-right: 8px; }
      .side { width: var(--side); flex: none; display: flex; flex-direction: column; padding: 6px 10px 0 10px; gap: 4px; min-height: 0; }
      .tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; }
      .tabs span { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 28px; border-radius: 7px; color: var(--muted); font-weight: 500; }
      .tabs span.on { background: var(--raise); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
      .tabs small { color: var(--muted); font-weight: 500; }
      .newag { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px; color: var(--soft); font-weight: 500; }
      .newag .pl { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line-2); display: grid; place-items: center; }
      .newag kbd { margin-left: auto; }
      .card { position: relative; border-radius: 9px; padding: 8px 10px 9px; display: flex; flex-direction: column; gap: 4px; border: 1px solid transparent; }
      .card.sel { background: var(--raise); border-color: var(--line-2); }
      .card.wait { background: var(--wait-bg); border-color: var(--wait-line); }
      .card.ghosted { opacity: .38; border: 1px dashed var(--line-2); background: transparent; }
      .card .r1 { white-space: nowrap; display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; }
      .card .r1 .st { margin-left: auto; font-size: 12px; font-weight: 500; }
      .card .r2 { white-space: nowrap; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
      .card .r3 { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
      .card .r3 b { color: var(--soft); font-weight: 600; }
      .card .r3 .num { margin-left: auto; }
      .chip { font-size: 10.5px; font-weight: 600; color: var(--soft); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; line-height: 16px; }
      .sd { width: 7px; height: 7px; border-radius: 50%; flex: none; }
      .sd.run { background: var(--run); } .sd.wait { background: var(--wait); } .sd.idle { background: var(--idle); }
      .st.run { color: var(--run); } .st.wait { color: var(--wait); } .st.idle { color: var(--muted); }
      .where { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--p-ink); background: var(--p-soft); border-radius: 4px; padding: 0 5px; line-height: 17px; }
      .where svg { width: 12px; height: 12px; }
      .sec { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
      .sec h4 { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--soft); padding: 0 6px 6px; }
      .sec h4 small { color: var(--muted); font-weight: 500; }
      .sec h4 .r { margin-left: auto; color: var(--muted); font-weight: 500; }
      .row { display: flex; align-items: center; gap: 8px; height: 29px; padding: 0 6px; border-radius: 7px; color: var(--soft); font-weight: 500; position: relative; }
      .row.sel { background: var(--raise); box-shadow: 0 0 0 1px var(--line-2); color: var(--text); }
      .row.ghosted { opacity: .38; outline: 1px dashed var(--line-2); }
      .row .path { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
      .row .where { flex: none; }
      .card .r2 .where { margin-left: auto; }
      .row .r { margin-left: auto; font-size: 12px; color: var(--run); font-weight: 500; }
      .row .r.bad { color: var(--del); }
      .side .foot { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 6px 12px; display: flex; flex-direction: column; gap: 9px; color: var(--soft); font-size: 12.5px; }
      .side .foot div { display: flex; align-items: center; gap: 8px; }
      .side .foot .mono { font-size: 11.5px; }

      .status { grid-column: 1 / 3; grid-row: 3; display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 12px; color: var(--muted); }
      .status b { color: var(--soft); font-weight: 600; }
      .status .g { display: flex; align-items: center; gap: 6px; }
      .status .act { color: var(--p-ink); }
      .status .r { margin-left: auto; display: flex; gap: 14px; }

      /* Le travail */
      .work { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; }
      .panel { border-radius: 12px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 8px 24px -6px rgba(0, 0, 0, .5); overflow: hidden; position: relative; }

      /* Un volet */
      .pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1; background: var(--panel); }
      .ph { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); flex: none; }
      .ph .nm { font-weight: 650; font-size: 14.5px; white-space: nowrap; }
      .ph .pill { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; border-radius: 5px; padding: 0 6px; line-height: 19px; }
      .pill.run { color: var(--run); background: oklch(from var(--run) l c h / .1); }
      .pill.wait { color: var(--wait); background: var(--wait-bg); }
      .pill.tpill { color: var(--soft); background: var(--hover); }
      .ph .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ph .stats { display: flex; gap: 16px; margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
      .ph .stats b { color: var(--text); font-weight: 600; }
      .ph .tools { display: flex; gap: 2px; color: var(--muted); margin-left: 6px; }
      .ph .tools span { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; }
      .ph .tools span.x:hover { background: var(--hover); }
      .ph.slim { height: 40px; }
      .ph.slim .nm { font-size: 13.5px; }

      .conv { flex: 1; min-height: 0; overflow: hidden; padding: 16px 22px 0; display: flex; flex-direction: column; gap: 12px; }
      .bubble { align-self: flex-end; max-width: 82%; background: var(--raise); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 13px; line-height: 1.5; font-size: 13.5px; }
      .ai { line-height: 1.55; font-size: 13.5px; color: #e9ebee; }
      .ai b { color: var(--text); }
      .think { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
      .tool { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
      .tool b { color: var(--soft); font-weight: 600; }
      .tool .ok { margin-left: auto; color: var(--muted); }
      code.p { font-family: var(--mono); font-size: 11.5px; color: var(--soft); }
      .code { border: 1px solid var(--line); border-radius: 9px; background: var(--well); font-family: var(--mono); font-size: 12px; line-height: 1.65; color: var(--code-fg); }
      .code .hd { padding: 6px 12px; border-bottom: 1px solid var(--line); color: var(--soft); font-size: 11.5px; }
      .code pre { padding: 8px 12px; white-space: pre; overflow: hidden; }
      .k { color: var(--syn-k); } .f { color: var(--syn-f); } .s { color: var(--syn-s); } .n { color: var(--syn-n); }
      .ask { border: 1px solid var(--wait-line); background: var(--wait-bg); border-radius: 10px; padding: 11px 14px; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; }
      .ask .q { display: flex; gap: 8px; align-items: center; font-weight: 600; }
      .ask .q .tag { color: var(--wait); font-size: 12px; font-weight: 600; }
      .ask .opts { display: flex; gap: 8px; }
      .ask .opts span { border: 1px solid var(--line-2); border-radius: 7px; padding: 4px 10px; display: flex; gap: 7px; align-items: center; font-weight: 600; background: var(--raise); }
      .ask .opts kbd { line-height: 15px; }
      .composer { margin: 10px 16px 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--raise); padding: 11px 14px 9px; flex: none; }
      .composer .ph2 { color: var(--muted); font-size: 13.5px; }
      .composer .bar { display: flex; align-items: center; gap: 14px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
      .composer .bar b { color: var(--soft); font-weight: 600; }
      .composer .send { margin-left: auto; background: var(--primary); color: var(--on-primary); font-weight: 650; border-radius: 8px; padding: 5px 12px; display: flex; gap: 8px; align-items: center; }
      .composer .mic { color: var(--soft); display: flex; align-items: center; gap: 4px; }
      .composer.focus { border-color: color-mix(in oklch, var(--p-ink) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--p) 16%, transparent); }
      .composer.compact { margin: 8px 14px 10px; padding: 8px 12px 7px; }
      .composer.compact .bar { margin-top: 8px; }

      .term { flex: 1; min-height: 0; background: var(--well); padding: 12px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--code-fg); overflow: hidden; white-space: pre; }
      .term .pr { color: var(--ansi-cy); } .term .ok { color: var(--add); } .term .ko { color: var(--del); } .term .y { color: var(--ansi-y); } .term .d { color: var(--muted); }
      .cursor { display: inline-block; width: 8px; height: 15px; background: var(--soft); vertical-align: -3px; }

      /* La poignée entre deux volets */
      .handle { flex: none; position: relative; }
      .handle.v { width: 1px; background: var(--line-2); }
      .handle.h { height: 1px; background: var(--line-2); }
      .handle .grip { position: absolute; display: flex; gap: 3px; color: var(--muted); }
      .handle.v .grip { top: 50%; left: -3px; width: 7px; height: 34px; margin-top: -17px; border-radius: 4px; background: var(--raise); border: 1px solid var(--line-2); }
      .handle.h .grip { left: 50%; top: -3px; height: 7px; width: 34px; margin-left: -17px; border-radius: 4px; background: var(--raise); border: 1px solid var(--line-2); }

      /* Le geste */
      .ghost { position: absolute; z-index: 30; display: flex; align-items: center; gap: 8px; padding: 7px 11px 7px 9px; border-radius: 9px; background: var(--raise); border: 1px solid var(--line-2); box-shadow: 0 14px 34px -8px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.3); font-weight: 600; font-size: 13px; transform: rotate(-1.5deg); }
      .ghost small { color: var(--muted); font-weight: 500; font-size: 11.5px; }
      .ptr { position: absolute; z-index: 31; width: 20px; height: 24px; }
      .hint { position: absolute; z-index: 32; left: 876px; bottom: 112px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; padding: 7px 14px; border-radius: 9px; background: rgba(10,11,13,.92); border: 1px solid var(--line-2); font-size: 12px; color: var(--muted); white-space: nowrap; }
      .hint b { color: var(--soft); font-weight: 600; }

      /* ===== Direction A : un seul panneau, un filet entre les volets ===== */
      .A .panel { flex: 1; display: flex; }
      .A .split-v { display: flex; flex: 1; min-width: 0; }
      .A .split-h { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .A .pane .ph { position: relative; }
      .A .pane.active .ph::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--p-ink); }
      .A .pane:not(.active) .ph .nm { color: var(--soft); }
      .A .pane:not(.active) .conv, .A .pane:not(.active) .term { filter: saturate(.85); }
      .A .dropzone { position: absolute; z-index: 20; background: color-mix(in oklch, var(--p) 20%, rgba(14,15,17,.55)); border: 1.5px dashed var(--p-ink); border-radius: 10px; display: grid; place-items: center; }
      .A .dropzone .lbl { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 9px; background: rgba(10,11,13,.9); border: 1px solid var(--line-2); font-weight: 600; font-size: 13.5px; }
      .A .dropzone .lbl small { color: var(--muted); font-weight: 500; }
      .A .edge { position: absolute; z-index: 19; background: color-mix(in oklch, var(--p-ink) 55%, transparent); border-radius: 3px; }

      /* ===== Direction B : des panneaux séparés, posés sur le cadre ===== */
      .B .work { gap: 8px; }
      .B .col { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
      .B .panel { display: flex; flex: 1; min-width: 0; min-height: 0; }
      .B .panel.active { box-shadow: 0 0 0 1px color-mix(in oklch, var(--p-ink) 65%, transparent), 0 0 0 4px color-mix(in oklch, var(--p) 12%, transparent), 0 8px 24px -6px rgba(0,0,0,.5); }
      .B .panel:not(.active) .pane { background: color-mix(in oklch, var(--panel) 88%, var(--frame)); }
      .B .gap-v { width: 8px; margin: 0 -8px; position: relative; flex: none; z-index: 2; }
      .B .gap-v::after { content: ''; position: absolute; left: 2.5px; top: 50%; width: 3px; height: 36px; margin-top: -18px; border-radius: 2px; background: var(--line-2); }
      .B .gap-h { height: 8px; margin: -8px 0; position: relative; flex: none; z-index: 2; }
      .B .gap-h::after { content: ''; position: absolute; top: 2.5px; left: 50%; height: 3px; width: 36px; margin-left: -18px; border-radius: 2px; background: var(--line-2); }
      .B .compass { position: absolute; z-index: 25; display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 5px; padding: 8px; border-radius: 14px; background: rgba(10,11,13,.86); border: 1px solid var(--line-2); box-shadow: 0 16px 40px -10px rgba(0,0,0,.7); }
      .B .compass span { border-radius: 8px; border: 1px solid var(--line-2); background: var(--raise); display: grid; place-items: center; color: var(--muted); }
      .B .compass span.blank { visibility: hidden; }
      .B .compass span.hot { background: color-mix(in oklch, var(--p) 32%, var(--raise)); border-color: var(--p-ink); color: var(--text); }
      .B .compass svg { width: 22px; height: 22px; stroke-width: 1.3; }
      .B .preview { position: absolute; z-index: 18; border-radius: 12px; background: color-mix(in oklch, var(--p) 10%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in oklch, var(--p-ink) 75%, transparent); }
      .B .preview .lbl { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: rgba(10,11,13,.9); border: 1px solid var(--line-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
      .B .preview .lbl small { color: var(--muted); font-weight: 500; }

      /* ===== Direction C : des groupes d'onglets ===== */
      .C .panel { flex: 1; display: flex; }
      .C .split-v { display: flex; flex: 1; min-width: 0; }
      .C .split-h { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .C .tabsbar { display: flex; align-items: stretch; height: 36px; border-bottom: 1px solid var(--line); background: color-mix(in oklch, var(--frame) 40%, var(--panel)); flex: none; position: relative; }
      .C .tab { display: flex; align-items: center; gap: 7px; padding: 0 12px 0 11px; font-size: 12.5px; font-weight: 550; color: var(--muted); border-right: 1px solid var(--line); position: relative; white-space: nowrap; }
      .C .tab.on { background: var(--panel); color: var(--text); }
      .C .tab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--panel); }
      .C .pane.active .tab.on::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--p-ink); }
      .C .tab .x { color: var(--dim); margin-left: 3px; }
      .C .tabsbar .more { margin-left: auto; display: flex; align-items: center; gap: 2px; padding: 0 8px; color: var(--muted); }
      .C .tabsbar .more span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; }
      .C .pane .ph { height: 38px; }
      .C .pane .ph .nm { display: none; }
      .C .zones i { background: color-mix(in oklch, var(--p-ink) 45%, transparent); }
      .C .caret { position: absolute; top: 5px; bottom: 5px; width: 2px; border-radius: 1px; background: var(--p-ink); box-shadow: 0 0 0 3px color-mix(in oklch, var(--p) 22%, transparent); }
