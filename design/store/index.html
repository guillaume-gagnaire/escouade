<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escouade Store — aperçu (ESC-202)</title>
    <!--
      L'aperçu de store.escouade.dev (ESC-202, docs/STORE.md) : les pages du store, dans le monde du site
      (website/app/assets/main.css : fond presque noir, Inter, filets blancs translucides, le teal pour l'action
      principale et le focus), avec un thème clair qui suit le système. Une page par ancre : #home, #search, #plugin,
      #account, #submit, #review ; ?theme=light. Données fictives. Captures : node design/store/render.mjs.
    -->
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url('../../website/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../../website/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
      }
      :root {
        --bg: #08090a;
        --surface: #0f1012;
        --surface-2: #15161a;
        --hover: rgba(255, 255, 255, 0.035);
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --text: #f7f8f8;
        --soft: #c9ccd1;
        --muted: #8a8f98;
        --dim: #7b8089;
        --brand: #35c1bd;
        --brand-hi: #5ad3cf;
        --brand-ink: #5ad3cf;
        --ink: #041413;
        --seal-bg: rgba(53, 193, 189, 0.1);
        --seal-line: rgba(53, 193, 189, 0.32);
        --danger: oklch(0.72 0.15 25);
        --danger-bg: oklch(0.72 0.15 25 / 0.1);
        --warn: oklch(0.82 0.12 80);
        --warn-bg: oklch(0.82 0.12 80 / 0.09);
        --ok: oklch(0.78 0.12 155);
        --shot: 0 30px 80px -20px rgba(0, 0, 0, 0.7);
        --font: 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --wrap: 1200px;
        --gutter: clamp(16px, 4vw, 40px);
        color-scheme: dark;
      }
      /* Le thème clair : les mêmes rôles lus à l'envers, le teal assombri là où il est du texte. */
      :root[data-theme='light'] {
        --bg: #ffffff;
        --surface: #f7f7f8;
        --surface-2: #eff0f2;
        --hover: rgba(15, 17, 22, 0.035);
        --line: rgba(15, 17, 22, 0.09);
        --line-strong: rgba(15, 17, 22, 0.16);
        --text: #101216;
        --soft: #343840;
        --muted: #5a5f68;
        --dim: #62676f;
        --brand: #35c1bd;
        --brand-hi: #2bb0ac;
        --brand-ink: #0b6f6c;
        --ink: #041413;
        --seal-bg: rgba(11, 111, 108, 0.07);
        --seal-line: rgba(11, 111, 108, 0.3);
        --danger: oklch(0.5 0.18 25);
        --danger-bg: oklch(0.5 0.18 25 / 0.07);
        --warn: oklch(0.5 0.11 70);
        --warn-bg: oklch(0.6 0.12 75 / 0.1);
        --ok: oklch(0.47 0.12 155);
        --shot: 0 24px 60px -24px rgba(15, 17, 22, 0.25);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        scrollbar-color: var(--line-strong) var(--bg);
      }
      body {
        margin: 0;
        color: var(--text);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.55;
        font-feature-settings: 'cv11', 'ss03';
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
        border-radius: 4px;
      }
      ::selection {
        background: color-mix(in srgb, var(--brand) 40%, transparent);
      }
      .mono {
        font-family: var(--mono);
        font-size: 0.86em;
        font-variant-numeric: tabular-nums;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .wrap {
        width: min(var(--wrap), 100% - 2 * var(--gutter));
        margin-inline: auto;
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* L'en-tête : celui de la documentation du site, la recherche au milieu. */
      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: saturate(1.4) blur(14px);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 28px;
        height: 60px;
        padding: 0 var(--gutter);
      }
      .where {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.015em;
      }
      .slash {
        color: var(--line-strong);
        font-size: 20px;
        font-weight: 300;
      }
      .crumb {
        font-size: 15px;
        font-weight: 560;
        letter-spacing: -0.01em;
      }
      .find {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        max-width: 420px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--dim);
        font-size: 14px;
      }
      .find span {
        flex: 1;
      }
      .find kbd,
      kbd {
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        font: 11.5px var(--mono);
        color: var(--dim);
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-left: auto;
      }
      .tools .link {
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
      }
      .tools .link:hover {
        color: var(--text);
      }
      .me {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 550;
      }
      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 650;
        color: #fff;
        background: oklch(0.55 0.1 var(--h, 30));
        flex: none;
      }

      .icon-btn {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: none;
        color: var(--muted);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 38px;
        padding: 0 16px;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        background: var(--hover);
        color: var(--text);
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.2s var(--ease),
          border-color 0.2s var(--ease);
      }
      .btn:hover {
        border-color: color-mix(in srgb, var(--text) 26%, transparent);
      }
      .btn.primary {
        border-color: transparent;
        background: var(--brand);
        color: var(--ink);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .btn.primary:hover {
        background: var(--brand-hi);
      }
      .btn.sm {
        height: 30px;
        padding: 0 11px;
        font-size: 13px;
        border-radius: 7px;
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.ghost {
        border-color: transparent;
        background: none;
        color: var(--muted);
      }
      .btn.danger {
        color: var(--danger);
      }

      /* La tuile d'un plugin : ses deux lettres sur sa teinte, comme la tuile d'un projet dans l'app. */
      .tile {
        --s: 40px;
        width: var(--s);
        height: var(--s);
        flex: none;
        display: grid;
        place-items: center;
        border-radius: calc(var(--s) * 0.26);
        background: oklch(0.36 0.07 var(--h));
        color: oklch(0.93 0.05 var(--h));
        font-weight: 680;
        font-size: calc(var(--s) * 0.38);
        letter-spacing: -0.02em;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      :root[data-theme='light'] .tile {
        background: oklch(0.9 0.05 var(--h));
        color: oklch(0.35 0.09 var(--h));
        box-shadow: inset 0 0 0 1px rgba(15, 17, 22, 0.06);
      }
      .tile.lg {
        --s: 72px;
      }
      .tile.sm {
        --s: 28px;
      }

      /* Le sceau « Vérifié par Escouade » : l'étincelle du logo dans sa petite tuile, puis la version qu'il couvre. */
      .seal {
        letter-spacing: normal;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 8px 0 3px;
        border: 1px solid var(--seal-line);
        border-radius: 6px;
        background: var(--seal-bg);
        color: var(--brand-ink);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .seal .spark {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        background: var(--brand);
        display: grid;
        place-items: center;
      }
      .seal .spark svg {
        width: 10px;
        height: 10px;
      }
      .seal.lg {
        height: 28px;
        padding: 0 11px 0 4px;
        font-size: 13px;
        border-radius: 8px;
      }
      .seal.lg .spark {
        width: 20px;
        height: 20px;
        border-radius: 5px;
      }
      .seal.lg .spark svg {
        width: 12px;
        height: 12px;
      }
      .seal .v {
        font: 500 11px var(--mono);
        opacity: 0.85;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 550;
        white-space: nowrap;
      }
      .tag.review {
        border-style: dashed;
      }
      .tag.warn {
        border-color: color-mix(in oklch, var(--warn) 45%, transparent);
        background: var(--warn-bg);
        color: var(--warn);
      }
      .tag.bad {
        border-color: color-mix(in oklch, var(--danger) 45%, transparent);
        background: var(--danger-bg);
        color: var(--danger);
      }
      .tag.ok {
        border-color: color-mix(in oklch, var(--ok) 40%, transparent);
        color: var(--ok);
      }

      /* Ce que demande un plugin, en une ligne. */
      .asks {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        color: var(--dim);
        font-size: 12.5px;
      }
      .asks span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .asks svg.i {
        width: 13px;
        height: 13px;
      }
      .asks .strong {
        color: var(--soft);
      }
      .asks .red {
        color: var(--danger);
      }

      main {
        padding-bottom: 96px;
      }
      .page-title {
        font-size: clamp(26px, 2.6vw, 34px);
        font-weight: 620;
        letter-spacing: -0.03em;
        line-height: 1.15;
        text-wrap: balance;
      }
      .page-title .more {
        color: var(--muted);
      }
      .h2 {
        font-size: 17px;
        font-weight: 620;
        letter-spacing: -0.015em;
      }
      .sub {
        color: var(--muted);
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin: 56px 0 14px;
      }
      .section-head .arrow {
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
      }
      .section-head .arrow::after {
        content: ' →';
      }

      /* Accueil */
      .hero {
        padding: 72px 0 8px;
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
        gap: 64px;
        align-items: end;
      }
      .hero h1 {
        font-size: clamp(32px, 3.5vw, 50px);
        font-weight: 640;
        letter-spacing: -0.04em;
        line-height: 1.02;
        text-wrap: balance;
      }
      .hero h1 .more {
        color: var(--muted);
      }
      .hero p {
        margin-top: 18px;
        max-width: 34em;
        color: var(--muted);
        font-size: 16.5px;
      }
      .bigfind {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 16px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--surface);
        color: var(--dim);
        font-size: 16px;
      }
      .bigfind svg.i {
        width: 18px;
        height: 18px;
      }
      .bigfind span {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .trust {
        margin-top: 14px;
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        color: var(--dim);
        font-size: 13px;
      }
      .trust span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .cats {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 40px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--soft);
        font-size: 13.5px;
        font-weight: 520;
        background: none;
        white-space: nowrap;
      }
      .chip .n {
        color: var(--dim);
        font: 11.5px var(--mono);
      }
      .chip.on {
        border-color: var(--line-strong);
        background: var(--surface-2);
        color: var(--text);
      }
      .chip svg.i {
        width: 14px;
        height: 14px;
        color: var(--dim);
      }

      /* Une liste de plugins : des rangées entre filets, deux colonnes. */
      .rows {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 40px;
        border-top: 1px solid var(--line);
      }
      .row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 14px;
        padding: 18px 4px;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        transition: background-color 0.15s var(--ease);
      }
      .row:hover {
        background: var(--hover);
      }
      .row .name {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .row .name b {
        font-size: 15px;
        font-weight: 620;
        letter-spacing: -0.01em;
      }
      .row .by {
        color: var(--dim);
        font-size: 13px;
      }
      .row .desc {
        margin: 4px 0 8px;
        color: var(--muted);
        font-size: 14px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .row .meta {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        color: var(--dim);
        font-size: 12.5px;
      }
      .row .meta .grow {
        flex: 1;
      }
      .cols3 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
      }
      .mini {
        border-top: 1px solid var(--line);
      }
      .mini a {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 11px 4px;
        border-bottom: 1px solid var(--line);
      }
      .mini a:hover {
        background: var(--hover);
      }
      .mini .t {
        min-width: 0;
      }
      .mini .t b {
        font-weight: 600;
        font-size: 14px;
      }
      .mini .t div {
        color: var(--dim);
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini .r {
        color: var(--dim);
        font-size: 12.5px;
        text-align: right;
      }
      .publish {
        margin-top: 72px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
        gap: 48px;
        padding: 36px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
      }
      .publish h2 {
        font-size: 24px;
        font-weight: 620;
        letter-spacing: -0.03em;
        line-height: 1.2;
      }
      .publish p {
        margin: 10px 0 20px;
        color: var(--muted);
      }
      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 14px;
        counter-reset: s;
      }
      .steps li {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 12px;
        counter-increment: s;
        font-size: 14px;
        color: var(--muted);
      }
      .steps li::before {
        content: counter(s);
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        font: 12px var(--mono);
        color: var(--text);
      }
      .steps b {
        color: var(--text);
        font-weight: 600;
      }
      code,
      .code {
        font-family: var(--mono);
        font-size: 0.86em;
        padding: 1px 5px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface-2);
      }

      /* Recherche */
      .search-layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 48px;
        padding-top: 36px;
      }
      .filters h3 {
        margin: 26px 0 8px;
        color: var(--dim);
        font-size: 12.5px;
        font-weight: 600;
      }
      .filters h3:first-child {
        margin-top: 0;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 8px;
        margin: 0 -8px;
        border-radius: 7px;
        color: var(--soft);
        font-size: 14px;
      }
      .opt:hover {
        background: var(--hover);
      }
      .opt .n {
        margin-left: auto;
        color: var(--dim);
        font: 11.5px var(--mono);
      }
      .opt.on {
        background: var(--surface-2);
        color: var(--text);
        font-weight: 560;
      }
      .box {
        width: 15px;
        height: 15px;
        border: 1.5px solid var(--line-strong);
        border-radius: 4px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .box.on {
        background: var(--brand);
        border-color: var(--brand);
      }
      .box.on::after {
        content: '';
        width: 7px;
        height: 4px;
        border: 2px solid var(--ink);
        border-top: 0;
        border-right: 0;
        transform: translateY(-1px) rotate(-45deg);
      }
      .switch {
        width: 30px;
        height: 18px;
        border-radius: 9px;
        background: var(--line-strong);
        position: relative;
        flex: none;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--text);
      }
      .switch.on {
        background: var(--brand);
      }
      .switch.on::after {
        left: 14px;
        background: var(--ink);
      }
      .results-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 14px;
      }
      .results-head .q {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: var(--surface);
        font-size: 15px;
      }
      .results-head .q svg.i {
        color: var(--dim);
      }
      .results-head .q .caret {
        width: 1.5px;
        height: 18px;
        background: var(--brand);
        margin-left: -8px;
      }
      .sort {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        font-size: 13.5px;
        white-space: nowrap;
      }
      .count {
        color: var(--dim);
        font-size: 13px;
        margin-bottom: 4px;
      }
      .results .rows {
        grid-template-columns: 1fr;
      }
      .results .row {
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: start;
      }
      .results .row .side {
        text-align: right;
        color: var(--dim);
        font-size: 12.5px;
        display: grid;
        gap: 6px;
        justify-items: end;
      }
      mark {
        background: color-mix(in srgb, var(--brand) 22%, transparent);
        color: inherit;
        border-radius: 2px;
      }

      /* La page d'un plugin */
      .plug-head {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 22px;
        align-items: start;
        padding: 44px 0 28px;
      }
      .plug-head h1 {
        font-size: clamp(28px, 2.8vw, 36px);
        font-weight: 640;
        letter-spacing: -0.035em;
        line-height: 1.1;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .plug-head .line {
        margin-top: 8px;
        display: flex;
        gap: 8px 16px;
        flex-wrap: wrap;
        color: var(--dim);
        font-size: 13.5px;
        align-items: center;
      }
      .plug-head .line a {
        color: var(--soft);
      }
      .plug-head .desc {
        margin-top: 12px;
        max-width: 40em;
        color: var(--muted);
        font-size: 16px;
      }
      .plug-head .act {
        display: grid;
        gap: 8px;
        justify-items: stretch;
        min-width: 230px;
      }
      .plug-head .act .hint {
        color: var(--dim);
        font-size: 12px;
        text-align: center;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--line);
      }
      .tabs a {
        padding: 10px 0;
        margin-bottom: -1px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 550;
        border-bottom: 1.5px solid transparent;
      }
      .tabs a.on {
        color: var(--text);
        border-color: var(--text);
      }
      .tabs .n {
        color: var(--dim);
        font: 11.5px var(--mono);
        margin-left: 4px;
      }
      .plug-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 56px;
        padding-top: 28px;
      }
      .readme {
        max-width: 68ch;
        font-size: 15.5px;
        color: var(--soft);
      }
      .readme h2 {
        margin: 30px 0 10px;
        color: var(--text);
        font-size: 19px;
        font-weight: 620;
        letter-spacing: -0.02em;
      }
      .readme h2:first-child {
        margin-top: 0;
      }
      .readme p {
        margin: 0 0 12px;
      }
      .readme ul {
        margin: 0 0 12px;
        padding-left: 18px;
      }
      .readme li {
        margin: 4px 0;
      }
      .readme pre {
        margin: 0 0 14px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        font: 13px/1.6 var(--mono);
        color: var(--soft);
        overflow: auto;
      }
      .readme pre .k {
        color: var(--brand-ink);
      }
      .readme pre .c {
        color: var(--dim);
      }
      .shot {
        margin: 6px 0 22px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shot);
        background: #1a1d21;
        color: #d1d2d3;
        font-size: 13.5px;
      }
      .shot .chan {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font-weight: 650;
        color: #fff;
      }
      .shot .msg {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 10px;
        padding: 12px 16px;
      }
      .shot .msg .who {
        color: #fff;
        font-weight: 650;
      }
      .shot .msg .who small {
        color: #9a9b9e;
        font-weight: 400;
        margin-left: 6px;
      }
      .shot .msg .att {
        margin-top: 6px;
        padding: 8px 12px;
        border-left: 3px solid #35c1bd;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 0 6px 6px 0;
      }
      .shot .msg .att b {
        color: #fff;
      }
      .shot .bot {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: #35c1bd;
        display: grid;
        place-items: center;
      }
      .shot figcaption {
        padding: 8px 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        color: #8b8d91;
        font-size: 12px;
      }
      .aside {
        display: grid;
        gap: 28px;
        align-content: start;
      }
      .aside h3 {
        margin-bottom: 10px;
        color: var(--dim);
        font-size: 12.5px;
        font-weight: 600;
      }
      .perm {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 10px;
        padding: 9px 0;
        border-top: 1px solid var(--line);
        font-size: 14px;
        color: var(--soft);
      }
      .perm:first-of-type {
        border-top: 0;
      }
      .perm svg.i {
        margin-top: 2px;
        color: var(--dim);
      }
      .perm.strong {
        color: var(--text);
        font-weight: 560;
      }
      .perm.strong svg.i {
        color: var(--text);
      }
      .perm.red,
      .perm.red svg.i {
        color: var(--danger);
      }
      .perm small {
        display: block;
        color: var(--dim);
        font-weight: 400;
        font-size: 12.5px;
      }
      .perm .host {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      /* La chaîne : du dépôt à la signature, chaque maillon vérifiable. */
      .chain {
        list-style: none;
        margin: 0;
        padding: 0;
        position: relative;
      }
      .chain::before {
        content: '';
        position: absolute;
        left: 8px;
        top: 12px;
        bottom: 12px;
        width: 1px;
        background: var(--line-strong);
      }
      .chain li {
        position: relative;
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 12px;
        padding: 6px 0;
        font-size: 13px;
      }
      .chain .dot {
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        display: grid;
        place-items: center;
        margin-top: 1px;
        color: var(--muted);
      }
      .chain .dot svg.i {
        width: 10px;
        height: 10px;
        stroke-width: 2;
      }
      .chain li.signed .dot {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--ink);
      }
      .chain .k {
        color: var(--dim);
      }
      .chain .v {
        display: block;
        color: var(--soft);
        font-family: var(--mono);
        font-size: 12px;
        word-break: break-all;
      }
      .chain li.signed .v {
        color: var(--brand-ink);
        font-family: var(--font);
        font-size: 13px;
        font-weight: 560;
      }
      .review-note {
        padding: 14px 16px;
        border: 1px solid var(--seal-line);
        border-radius: 10px;
        background: var(--seal-bg);
        font-size: 13.5px;
        color: var(--soft);
      }
      .review-note b {
        color: var(--text);
        font-weight: 600;
      }
      .review-note ul {
        margin: 8px 0 0;
        padding-left: 16px;
      }
      .facts {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 16px;
        font-size: 13.5px;
      }
      .facts dt {
        color: var(--dim);
      }
      .facts dd {
        margin: 0;
        color: var(--soft);
        text-align: right;
      }
      .report {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--dim);
        font-size: 13px;
      }
      .versions {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      /* Tableaux : compte, file de revue */
      table.t {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      table.t th {
        text-align: left;
        color: var(--dim);
        font-size: 12.5px;
        font-weight: 600;
        padding: 0 12px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      table.t td {
        padding: 14px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      table.t th:first-child,
      table.t td:first-child {
        padding-left: 4px;
      }
      table.t td.r,
      table.t th.r {
        text-align: right;
      }
      table.t tr:has(+ .why-row) td {
        border-bottom: 0;
      }
      table.t tr.why-row td {
        padding-top: 0;
      }
      table.t tr.sel td {
        background: var(--surface);
      }
      .pl {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .pl b {
        font-weight: 600;
      }
      .pl small {
        display: block;
        color: var(--dim);
        font-size: 12.5px;
      }
      .acct-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 56px;
        padding-top: 36px;
      }
      .banner {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        margin: 24px 0 28px;
        padding: 14px 16px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--surface);
        font-size: 14px;
      }
      .banner .sub {
        font-size: 13px;
      }
      .banner .acts {
        display: flex;
        gap: 8px;
      }
      .why {
        margin-top: 10px;
        padding: 12px 14px;
        border: 1px solid color-mix(in oklch, var(--danger) 35%, transparent);
        border-radius: 10px;
        background: var(--danger-bg);
        font-size: 13.5px;
        color: var(--soft);
        max-width: 60ch;
      }
      .why b {
        color: var(--danger);
        font-weight: 600;
      }
      .why .fix {
        margin-top: 6px;
        color: var(--muted);
      }
      .menu-acts {
        display: flex;
        gap: 2px;
        justify-content: flex-end;
      }
      .side-card {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        display: grid;
        gap: 14px;
        align-content: start;
        font-size: 14px;
      }
      .side-card + .side-card {
        margin-top: 16px;
      }
      .side-card p {
        color: var(--muted);
        font-size: 13.5px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field label {
        color: var(--dim);
        font-size: 12.5px;
        font-weight: 600;
      }
      .input {
        display: flex;
        align-items: center;
        height: 36px;
        padding: 0 11px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--surface);
        font-size: 14px;
        gap: 8px;
      }
      .input .ok {
        margin-left: auto;
        color: var(--ok);
        font-size: 12.5px;
      }
      .stat-n {
        font-size: 26px;
        font-weight: 620;
        letter-spacing: -0.03em;
      }
      .bars {
        display: flex;
        align-items: end;
        gap: 3px;
        height: 54px;
      }
      .bars i {
        flex: 1;
        background: color-mix(in srgb, var(--text) 22%, transparent);
        border-radius: 2px 2px 0 0;
      }
      .bars i:last-child {
        background: var(--brand);
      }
      .axis {
        display: flex;
        justify-content: space-between;
        color: var(--dim);
        font: 11px var(--mono);
      }

      /* Soumission */
      .submit-layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        gap: 56px;
        padding-top: 36px;
      }
      .stepper {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
        align-content: start;
      }
      .stepper li {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 12px;
        padding: 10px 10px;
        border-radius: 9px;
        font-size: 14px;
        color: var(--muted);
      }
      .stepper li small {
        display: block;
        color: var(--dim);
        font-size: 12.5px;
      }
      .stepper li .d {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid var(--line-strong);
        display: grid;
        place-items: center;
        font: 11.5px var(--mono);
        color: var(--muted);
      }
      .stepper li.done .d {
        background: var(--surface-2);
        color: var(--text);
      }
      .stepper li.on {
        background: var(--surface);
        color: var(--text);
        font-weight: 560;
      }
      .stepper li.on .d {
        border-color: var(--text);
        color: var(--text);
      }
      .picked {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 22px 0 30px;
      }
      .pick {
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 14px;
      }
      .pick .k {
        color: var(--dim);
        font-size: 12.5px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
      }
      .pick .k a {
        color: var(--muted);
        font-weight: 500;
      }
      .pick .v {
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .pick .s {
        color: var(--dim);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .checks {
        border-top: 1px solid var(--line);
      }
      .check {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) auto;
        gap: 12px;
        padding: 12px 4px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        align-items: start;
      }
      .check .st {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin-top: 1px;
      }
      .check .st svg.i {
        width: 12px;
        height: 12px;
        stroke-width: 2.2;
      }
      .check.pass .st {
        color: var(--ok);
        background: color-mix(in oklch, var(--ok) 14%, transparent);
      }
      .check.fail .st {
        color: var(--danger);
        background: var(--danger-bg);
      }
      .check.run .st {
        border: 1.5px solid var(--line-strong);
        border-top-color: var(--text);
      }
      .check .w {
        color: var(--dim);
        font-size: 12.5px;
        white-space: nowrap;
      }
      .check .x {
        color: var(--dim);
        font-size: 13px;
      }
      .foot-acts {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 24px;
      }
      .foot-acts .sub {
        font-size: 13px;
      }

      /* File de revue */
      .review-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 400px;
        gap: 40px;
        padding-top: 32px;
      }
      .qtabs {
        display: flex;
        gap: 8px;
        margin: 18px 0 14px;
        flex-wrap: wrap;
      }
      .grown {
        color: var(--warn);
        font-size: 12.5px;
      }
      .detail {
        position: sticky;
        top: 84px;
        align-self: start;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        display: grid;
        gap: 18px;
        font-size: 14px;
      }
      .acct-layout > *,
      .submit-layout > *,
      .review-layout > *,
      .search-layout > *,
      .plug-body > *,
      .detail > *,
      .aside > * {
        min-width: 0;
      }
      .cmd {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        background: var(--bg);
        font: 12.5px var(--mono);
        color: var(--soft);
      }
      .cmd span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cmd .p {
        color: var(--dim);
      }
      .diffstat {
        display: flex;
        gap: 10px;
        align-items: center;
        font: 12.5px var(--mono);
      }
      .diffstat .a {
        color: var(--ok);
      }
      .diffstat .d {
        color: var(--danger);
      }
      .flag {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 13px;
        color: var(--soft);
      }
      .flag small {
        display: block;
        color: var(--dim);
      }

      .foot {
        border-top: 1px solid var(--line);
        padding: 28px 0;
        color: var(--dim);
        font-size: 13px;
      }
      .foot .wrap {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        align-items: center;
      }
      .foot .grow {
        flex: 1;
      }

      /* 1028 px : la colonne de droite se resserre, la navigation garde l'essentiel. */
      @media (max-width: 1180px) {
        .plug-body {
          grid-template-columns: minmax(0, 1fr) 300px;
          gap: 40px;
        }
        .review-layout {
          grid-template-columns: minmax(0, 1fr) 340px;
          gap: 28px;
        }
        .acct-layout {
          grid-template-columns: minmax(0, 1fr) 260px;
          gap: 36px;
        }
        .search-layout {
          grid-template-columns: 190px minmax(0, 1fr);
          gap: 36px;
        }
        .submit-layout {
          grid-template-columns: 200px minmax(0, 1fr);
          gap: 40px;
        }
        .tools .wide {
          display: none;
        }
        .hide-mid {
          display: none;
        }
      }
      /* Mobile : une colonne, l'en-tête réduit à la marque, la recherche et le menu. */
      @media (max-width: 720px) {
        body {
          font-size: 14.5px;
        }
        .bar {
          gap: 12px;
          height: 56px;
        }
        .find,
        .tools .link,
        .tools .me span,
        .gh-label {
          display: none;
        }
        .icon-btn.only-narrow {
          display: grid;
        }
        .tools {
          gap: 8px;
        }
        .hero {
          grid-template-columns: 1fr;
          gap: 24px;
          padding-top: 36px;
        }
        .cats {
          flex-wrap: nowrap;
          overflow-x: auto;
          margin: 28px calc(-1 * var(--gutter)) 0;
          padding: 0 var(--gutter);
          scrollbar-width: none;
        }
        .rows,
        .cols3,
        .publish,
        .search-layout,
        .plug-body,
        .acct-layout,
        .submit-layout,
        .review-layout,
        .picked {
          grid-template-columns: 1fr;
        }
        .publish {
          padding: 24px;
          gap: 24px;
        }
        .filters {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          margin: 0 calc(-1 * var(--gutter));
          padding: 0 var(--gutter);
          scrollbar-width: none;
        }
        .filters > :not(.chips-sm) {
          display: none;
        }
        .chips-sm {
          display: flex !important;
          gap: 8px;
        }
        .search-layout {
          gap: 16px;
          padding-top: 20px;
        }
        .results .row {
          grid-template-columns: auto minmax(0, 1fr);
        }
        .results .row .side {
          display: none;
        }
        .plug-head {
          grid-template-columns: auto minmax(0, 1fr);
          gap: 16px;
          padding-top: 28px;
        }
        .plug-head .tile.lg {
          --s: 56px;
        }
        .plug-head .act {
          grid-column: 1 / -1;
          min-width: 0;
        }
        .plug-head .desc {
          grid-column: 1 / -1;
        }
        .readme {
          order: 2;
        }
        .aside {
          order: 1;
        }
        table.t .hide-sm,
        .hide-sm {
          display: none;
        }
        .stepper {
          grid-auto-flow: column;
          overflow-x: auto;
        }
        .stepper li small {
          display: none;
        }
        .banner {
          grid-template-columns: auto minmax(0, 1fr);
        }
        .banner .acts {
          grid-column: 1 / -1;
        }
        .detail {
          position: static;
        }
        .why-row .why {
          margin-left: 0 !important;
        }
        .mine thead {
          display: none;
        }
        .mine tr {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          border-bottom: 1px solid var(--line);
        }
        .mine tr:has(+ .why-row) {
          border-bottom: 0;
        }
        .mine td {
          border: 0 !important;
        }
        .mine td:nth-child(2) {
          grid-row: 2;
          padding: 0 12px 14px 44px;
        }
        .mine td:last-child {
          grid-column: 2;
          grid-row: 1;
        }
        .mine tr.why-row {
          display: block;
        }
        .banner .sub {
          overflow-wrap: anywhere;
        }
      }
      .chips-sm,
      .only-narrow {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="bar">
        <div class="where">

<span class="k">plugins</span>:
  <span class="k">dev.lmartin.slack</span>:
    <span class="k">channel</span>: escouade-studio-web
    <span class="k">events</span>: [ticket.column, agent.waiting]</pre>
