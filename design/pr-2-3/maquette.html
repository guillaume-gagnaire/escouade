<!doctype html>
<!--
  ESC-449 : les PR dans Escouade (2.3), trois directions. Maquette statique, rien n'est branché.
  ?d=a|b|c, &theme=light, puis #fenetre (la PR et la relecture de l'agent, 1440 × 900), #controle (le contrôle de la PR :
  verdict, relecteurs, étiquettes, merge) ou #etats (relecture en cours, CI rouge, conflit, prête à fusionner).
  Jetons, polices et icônes de l'app (src/app.css, src/lib/icons.ts) ; données fictives (projet « atlas-web »).
  Captures : node design/pr-2-3/render.mjs
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>ESC-449 · les PR dans Escouade</title>
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/opsz.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/400.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/500.css" />
<script src="icons.js"></script>
<style>
  /* Les jetons de src/app.css (sombre, puis clair). Teint du projet : --p. */
  :root {
    --p: oklch(0.72 0.12 48);
    --frame: color-mix(in oklch, var(--p) 8%, #08090a);
    --panel: color-mix(in oklch, var(--p) 4.5%, #0e0f11);
    --raise: color-mix(in oklch, var(--p) 6%, #15161a);
    --raise-2: color-mix(in oklch, var(--p) 6%, #1b1c20);
    --well: color-mix(in oklch, var(--p) 2%, #0a0b0d);
    --fg-rgb: 255, 255, 255;
    --line: rgba(255, 255, 255, 0.075);
    --line-2: rgba(255, 255, 255, 0.12);
    --line-3: rgba(255, 255, 255, 0.2);
    --hover: rgba(255, 255, 255, 0.045);
    --text: #f7f8f8;
    --soft: #d0d3d8;
    --muted: #989da6;
    --dim: #8f949e;
    --text-ai: #e9ebee;
    --brand: #35c1bd;
    --p-ink: color-mix(in oklch, var(--p) 70%, white);
    --p-soft: color-mix(in oklch, var(--p) 14%, transparent);
    --run: oklch(0.79 0.15 155);
    --wait: oklch(0.84 0.14 82);
    --wait-bg: oklch(from var(--wait) l c h / 0.07);
    --wait-line: oklch(from var(--wait) l c h / 0.32);
    --add: oklch(0.8 0.13 155);
    --del: oklch(0.74 0.14 22);
    --info: oklch(0.8 0.1 235);
    --brain: oklch(0.8 0.12 300);
    --merged: oklch(0.74 0.13 300);
    --idle: #7a7f88;
    --primary: #f2f3f4;
    --on-primary: #08090a;
    --on-wait: #1a1405;
    --code-fg: #d5d8dd;
    --code-ln: #555a62;
    --syn-k: oklch(0.78 0.11 300);
    --syn-f: oklch(0.83 0.09 235);
    --syn-s: oklch(0.82 0.11 150);
    --syn-n: oklch(0.84 0.11 65);
    --add-bg: oklch(from var(--add) l c h / 0.09);
    --add-bg-2: oklch(from var(--add) l c h / 0.2);
    --del-bg: oklch(from var(--del) l c h / 0.09);
    --del-bg-2: oklch(from var(--del) l c h / 0.2);
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  :root[data-theme='light'] {
    --frame: color-mix(in oklch, var(--p) 7%, #f0f1f3);
    --panel: color-mix(in oklch, var(--p) 2.5%, #fdfdfd);
    --raise: color-mix(in oklch, var(--p) 4%, #f4f5f7);
    --raise-2: color-mix(in oklch, var(--p) 5%, #eceef1);
    --well: color-mix(in oklch, var(--p) 2.5%, #f6f7f9);
    --fg-rgb: 15, 17, 22;
    --line: rgba(15, 17, 22, 0.09);
    --line-2: rgba(15, 17, 22, 0.14);
    --line-3: rgba(15, 17, 22, 0.24);
    --hover: rgba(15, 17, 22, 0.045);
    --text: #15171c;
    --soft: #363a42;
    --muted: #555a63;
    --dim: #5c616a;
    --text-ai: #1d2026;
    --brand: oklch(0.52 0.09 190);
    --p-ink: color-mix(in oklch, var(--p) 50%, #15171c);
    --run: oklch(0.48 0.13 155);
    --wait: oklch(0.5 0.11 70);
    --wait-bg: oklch(from var(--wait) l c h / 0.09);
    --wait-line: oklch(from var(--wait) l c h / 0.4);
    --add: oklch(0.47 0.12 155);
    --del: oklch(0.5 0.18 25);
    --info: oklch(0.5 0.12 245);
    --brain: oklch(0.5 0.16 300);
    --merged: oklch(0.5 0.16 300);
    --primary: #1b1d22;
    --on-primary: #f7f8f8;
    --on-wait: #fff;
    --code-fg: #24272e;
    --code-ln: #8f949c;
    --syn-k: oklch(0.5 0.16 300);
    --syn-f: oklch(0.5 0.13 250);
    --syn-s: oklch(0.5 0.12 150);
    --syn-n: oklch(0.53 0.13 55);
    --add-bg: oklch(from var(--add) l c h / 0.08);
    --add-bg-2: oklch(from var(--add) l c h / 0.17);
    --del-bg: oklch(from var(--del) l c h / 0.07);
    --del-bg-2: oklch(from var(--del) l c h / 0.15);
    --shadow: 0 14px 32px rgba(15, 17, 22, 0.16);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { background: var(--frame); }
  body { font-variant-ligatures: none; margin: 0; font: 13px/1.45 'Inter Variable', Inter, 'Segoe UI', system-ui, sans-serif; font-feature-settings: 'cv11', 'ss03';
    color: var(--text); -webkit-font-smoothing: antialiased; }
  p { margin: 0; }
  svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  code, .code, .log { font-feature-settings: 'calt' 0, 'liga' 0; }
  .mono { font-feature-settings: 'calt' 0, 'liga' 0; font-family: var(--mono); font-size: 0.92em; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sp { margin-left: auto; }

  /* ───────── La fenêtre : barre de titre, rail des projets, barre latérale, place de travail, barre d'état ───────── */
  .win { width: 1440px; height: 900px; display: grid; grid-template-columns: 52px 276px 1fr; grid-template-rows: 44px 1fr 30px;
    background: var(--frame); overflow: hidden; position: relative; }
  .win.wide { grid-template-columns: 52px 1fr; }
  .tb { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 0 0 14px; font-size: 13px; color: var(--muted); }
  .tb .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); display: grid; place-items: center; color: #08090a; }
  .tb .proj { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; margin-left: 18px; }
  .tb .proj .sq { width: 8px; height: 8px; border-radius: 2.5px; background: var(--p); }
  .tb .search { margin-left: 330px; width: 340px; height: 30px; border-radius: 8px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line);
    display: flex; align-items: center; gap: 8px; padding: 0 6px 0 11px; }
  .tb .search kbd { margin-left: auto; }
  .tb .ed { margin-left: auto; display: inline-flex; gap: 7px; align-items: center; color: var(--soft); }
  .tb .wbtn { width: 46px; height: 44px; display: grid; place-items: center; color: var(--muted); }
  kbd { font: 500 11px/1 'Inter Variable', Inter, sans-serif; padding: 3px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--muted); }
  .rail { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 8px; } .rail .low { margin-top: auto; display: grid; gap: 6px; }
  .rail .r-i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .rail .tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #101114;
    background: var(--p); box-shadow: 0 0 0 2px var(--frame), 0 0 0 3.5px var(--p); }
  .rail .tile.o { background: oklch(0.72 0.11 250); box-shadow: none; opacity: 0.9; }
  .side { min-width: 0; padding: 4px 10px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
  .stabs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); }
  .stabs span { flex: 1 1 auto; padding: 0 4px; font-size: 12px !important; display: inline-flex; justify-content: center; align-items: center; gap: 5px; height: 26px; border-radius: 7px; color: var(--muted);
    font-weight: 550; font-size: 12.5px; white-space: nowrap; }
  .stabs span.on { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(0, 0, 0, 0.18); }
  .stabs .c { color: var(--dim); font-size: 11.5px; font-weight: 500; }
  .new { display: flex; align-items: center; gap: 8px; height: 32px; margin: 8px 0 4px; padding: 0 8px 0 9px; color: var(--soft); font-weight: 550; }
  .new .plus { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: rgba(var(--fg-rgb), 0.07);
    box-shadow: inset 0 0 0 1px var(--line); }
  .new kbd { margin-left: auto; }
  .agent { border-radius: 11px; padding: 10px 12px; display: grid; gap: 3px; font-size: 12.5px; }
  .agent.on { background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }
  .agent .r { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .agent .n { font-weight: 620; }
  .agent .key { color: var(--muted); font-size: 11.5px; font-weight: 550; }
  .agent .m { color: var(--muted); font-size: 12px; }
  .ring { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.6px var(--run); flex: none; }
  .ring.wt { box-shadow: inset 0 0 0 1.6px var(--wait); }
  .ring.idle { box-shadow: inset 0 0 0 1.6px var(--idle); }
  .ring.brain { box-shadow: inset 0 0 0 1.6px var(--brain); }
  .side .foot { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 6px 0; display: grid; gap: 8px; color: var(--muted); font-size: 12px; }
  .side .foot .r { display: flex; gap: 8px; align-items: center; }
  .main { min-width: 0; min-height: 0; background: var(--panel); border-radius: 12px 0 0 0; box-shadow: inset 0 0 0 1px var(--line); display: flex;
    flex-direction: column; overflow: hidden; position: relative; }
  .status { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 14px; color: var(--muted); font-size: 12px; }
  .status b { color: var(--text); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--idle); flex: none; }
  .dot.ok { background: var(--run); } .dot.wt { background: var(--wait); } .dot.ko { background: var(--del); }

  /* ───────── Commun aux trois : boutons, pastilles, CI, menus, diff, fils ───────── */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2);
    color: var(--text); font-weight: 550; font-size: 12.5px; white-space: nowrap; background: rgba(var(--fg-rgb), 0.03); flex: none; }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
  .btn.icon { width: 30px; padding: 0; justify-content: center; color: var(--soft); }
  .btn.sm.icon { width: 26px; }
  .btn.quiet { box-shadow: none; background: none; color: var(--muted); }
  .btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .btn.go { background: oklch(from var(--run) calc(l - 0.12) c h); color: #fff; box-shadow: none; }
  :root[data-theme='light'] .btn.go { background: var(--run); }
  .btn.ko { color: var(--del); box-shadow: inset 0 0 0 1px oklch(from var(--del) l c h / 0.4); }
  .btn.off { opacity: 0.45; }
  .btn.agentic { color: var(--brain); box-shadow: inset 0 0 0 1px oklch(from var(--brain) l c h / 0.4); background: oklch(from var(--brain) l c h / 0.06); }
  .split { display: inline-flex; flex: none; }
  .split .btn:first-child { border-radius: 8px 0 0 8px; }
  .split .btn:last-child { border-radius: 0 8px 8px 0; width: 28px; padding: 0; justify-content: center; margin-left: 1px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
    white-space: nowrap; flex: none; color: var(--soft); box-shadow: inset 0 0 0 1px var(--line-2); }
  .pill.open { color: var(--run); box-shadow: inset 0 0 0 1px oklch(from var(--run) l c h / 0.4); background: oklch(from var(--run) l c h / 0.07); }
  .pill.draft { color: var(--muted); }
  .pill.merged { color: var(--merged); box-shadow: inset 0 0 0 1px oklch(from var(--merged) l c h / 0.4); }
  .pill.ko { color: var(--del); box-shadow: inset 0 0 0 1px oklch(from var(--del) l c h / 0.4); background: oklch(from var(--del) l c h / 0.07); }
  .pill.wt { color: var(--wait); box-shadow: inset 0 0 0 1px var(--wait-line); background: var(--wait-bg); }
  .pill.ai { color: var(--brain); box-shadow: inset 0 0 0 1px oklch(from var(--brain) l c h / 0.4); background: oklch(from var(--brain) l c h / 0.06); }
  .lbl { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11.5px; font-weight: 550;
    color: var(--soft); box-shadow: inset 0 0 0 1px var(--line-2); white-space: nowrap; }
  .lbl i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .ci { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 7px; border-radius: 7px; font-size: 12px; font-weight: 550;
    color: var(--soft); background: rgba(var(--fg-rgb), 0.04); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; flex: none; }
  .ci.ok svg { color: var(--run); }
  .ci.ko { color: var(--del); box-shadow: inset 0 0 0 1px oklch(from var(--del) l c h / 0.35); background: oklch(from var(--del) l c h / 0.07); }
  .ci.wt { color: var(--wait); }
  .spin { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid var(--wait); border-right-color: transparent; flex: none; display: inline-block; }
  .spin.ai { border-color: var(--brain); border-right-color: transparent; }
  .av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; flex: none;
    background: oklch(0.72 0.11 250); color: #0d0f12; }
  .av.me { background: var(--p); }
  .av.ai { background: oklch(from var(--brain) l c h / 0.16); color: var(--brain); box-shadow: inset 0 0 0 1px oklch(from var(--brain) l c h / 0.45); }
  .av.tk { background: oklch(from var(--run) l c h / 0.14); color: var(--run); box-shadow: inset 0 0 0 1px oklch(from var(--run) l c h / 0.4); }
  .av.sm { width: 18px; height: 18px; font-size: 9px; }
  .tag-ai { font-size: 10.5px; font-weight: 650; color: var(--brain); padding: 1px 5px; border-radius: 4px; background: oklch(from var(--brain) l c h / 0.1); }
  .sev { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
  .sev.hi { color: var(--del); background: oklch(from var(--del) l c h / 0.1); }
  .sev.md { color: var(--wait); background: var(--wait-bg); }
  .sev.lo { color: var(--muted); background: rgba(var(--fg-rgb), 0.05); }
  .menu { position: absolute; z-index: 9; padding: 6px; border-radius: 12px; background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow);
    font-size: 12.5px; display: grid; gap: 1px; }
  :root[data-theme='light'] .menu { background: #fff; }
  .menu h4 { margin: 4px 8px 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .menu .it { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; padding: 7px 8px; border-radius: 7px; align-items: start; }
  .menu .it.hl { background: var(--hover); }
  .menu .it b { font-weight: 600; }
  .menu .it small { grid-column: 2; color: var(--muted); font-size: 11.5px; }
  .menu .it .sel { color: var(--text); }
  .menu .sepl { height: 1px; background: var(--line); margin: 4px 2px; }
  .menu .it .k { margin-left: auto; }
  .cb { width: 15px; height: 15px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--line-3); display: inline-grid; place-items: center; flex: none; }
  .cb.on { background: var(--text); color: var(--panel); box-shadow: none; }
  .radio { width: 15px; height: 15px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-3); display: inline-block; flex: none; margin-top: 1px; }
  .radio.on { box-shadow: inset 0 0 0 4.5px var(--text); }

  /* Le code : diff unifié ou côte à côte. */
  .code { font-variant-ligatures: none; font-family: var(--mono); font-size: 12px; line-height: 20px; color: var(--code-fg); }
  .dl { display: grid; grid-template-columns: 44px 44px 18px 1fr; white-space: pre; min-height: 20px; }
  .dl .ln { color: var(--code-ln); text-align: right; padding-right: 8px; user-select: none; }
  .dl .k { color: var(--code-ln); text-align: center; }
  .dl.add { background: var(--add-bg); } .dl.add .ln { background: var(--add-bg); color: oklch(from var(--add) l c h / 0.8); } .dl.add .k { color: var(--add); }
  .dl.del { background: var(--del-bg); } .dl.del .ln { background: var(--del-bg); color: oklch(from var(--del) l c h / 0.8); } .dl.del .k { color: var(--del); }
  .dl.hunk { color: var(--info); background: oklch(from var(--info) l c h / 0.06); grid-template-columns: 106px 1fr; }
  .dl.hunk .tx { color: var(--muted); }
  .dl.mark { box-shadow: inset 3px 0 0 var(--brain); }
  .dl.mark .ln { color: var(--brain); }
  .tk-k { color: var(--syn-k); } .tk-f { color: var(--syn-f); } .tk-s { color: var(--syn-s); } .tk-n { color: var(--syn-n); } .tk-c { color: var(--code-ln); font-style: italic; }

  /* Un fil de discussion de relecture. */
  .thread { border-radius: 10px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); overflow: hidden; font-family: 'Inter Variable', Inter, sans-serif;
    font-size: 12.5px; line-height: 1.5; white-space: normal; color: var(--text); }
  .thread.ai { box-shadow: inset 0 0 0 1px var(--line-2), inset 3px 0 0 var(--brain); }
  .thread .msg { display: grid; grid-template-columns: 22px 1fr; gap: 3px 9px; padding: 10px 12px 8px; }
  .thread .msg + .msg { border-top: 1px solid var(--line); }
  .thread .who { display: flex; align-items: center; gap: 7px; min-width: 0; white-space: nowrap; }
  .thread .who b { font-weight: 620; }
  .thread .who .t { color: var(--muted); font-size: 11.5px; }
  .thread .bd { grid-column: 2; color: var(--text-ai); }
  .thread .bd code { display: inline; font-family: var(--mono); font-size: 11.5px; padding: 0 4px; border-radius: 4px; background: rgba(var(--fg-rgb), 0.06); }
  .thread .sugg { grid-column: 2; margin-top: 6px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2); overflow: hidden; }
  .thread .sugg .sh { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 6px 0 10px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line);
    background: rgba(var(--fg-rgb), 0.025); }
  .thread .sugg .dl { grid-template-columns: 18px 1fr; }
  .thread .acts { display: flex; align-items: center; gap: 6px; padding: 8px 12px 10px 43px; flex-wrap: wrap; }
  .thread .reply { margin: 0 12px 10px 43px; height: 30px; border-radius: 8px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line); display: flex;
    align-items: center; padding: 0 10px; color: var(--dim); font-size: 12.5px; }
  .thread .fixing { display: flex; align-items: center; gap: 8px; margin: 0 12px 10px 43px; padding: 7px 10px; border-radius: 8px; font-size: 12px; color: var(--soft);
    background: oklch(from var(--run) l c h / 0.06); box-shadow: inset 0 0 0 1px oklch(from var(--run) l c h / 0.3); }
  .thread .fixing b { font-weight: 600; }
  .thread.resolved { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .thread .rz { display: flex; align-items: center; gap: 8px; padding: 8px 12px; color: var(--muted); font-size: 12px; }
  .thread .rz b { color: var(--soft); font-weight: 550; }

  /* Planche des états. */
  .sheet { width: 1440px; min-height: 900px; padding: 22px 26px 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 22px; background: var(--frame); align-content: start; }
  .sheet > h1 { grid-column: 1 / -1; margin: 0; font-size: 15px; font-weight: 620; letter-spacing: -0.01em; }

    const dels = [], adds = [];

  return `<div class="rem"><div class="rh">${ic('file', 13)}<span class="mono">${t.file}</span><span class="muted">ligne ${t.line}</span><span class="sp"></span>${t.state === 'resolved' ? '' : `<span class="btn sm quiet">${ic('read', 12)}Dans l'éditeur</span>`}</div>
    <div class="code">${diff.slice(from, to).map((l) => dline(l, { mark: true }).replace('<span class="ln">' + l[1] + '</span>', '')).join('')}</div>${thread(id)}</div>`;
}
function cPr(state, tabOn = 'Remarques') {
  const tabs = [['Remarques', '4'], ['Fichiers', '4'], ['Commits', '4'], ['Contrôles', '5'], ['Description', '']];
  const feed = tabOn === 'Remarques'
    ? `${cRem('t1', DIFF_ML, 9, 13)}${cRem('t3', DIFF_SE, 3, 6)}`
    : '';
  return `<div class="pr">${cPrHead()}${cReady(state)}<div class="ptabs">${tabs.map(([l, c]) => `<span class="${l === tabOn ? 'on' : ''}">${l}${c ? `<span class="c">${c}</span>` : ''}</span>`).join('')}
    <span class="flt">Ouvertes d'abord ${ic('down', 11)}</span></div><div class="feed">${feed}</div></div>`;
}
function C_fenetre() {
  return shell(`<div class="C" style="display:contents"><div class="cols">${cChat()}${cPr('base')}</div></div>`, 'agents');
}
function C_controle() {
  // L'onglet « Contrôles » de la colonne, et le menu « … » de la PR : brouillon, relecteurs, étiquettes, branche.
  const checks = CHECKS.map(([n, st, d]) => `<div style="display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-bottom:1px solid var(--line)">${ok(14)}<span>${n}</span><span class="sp muted" style="font-size:12px">${d}</span><span class="btn sm quiet icon">${ic('ext', 12)}</span></div>`).join('');
  const meta = `<div class="rem" style="background:var(--panel)"><div class="rh"><b style="font-weight:600">Contrôles de GitHub Actions</b><span class="sp btn sm">${ic('restart', 12)}Tout relancer</span></div>${checks}</div>
    <div class="rem" style="background:var(--panel)"><div class="rh"><b style="font-weight:600">Commits</b><span class="sp muted">4</span></div>${COMMITS.map(([h, m, a, w]) => `<div style="display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-bottom:1px solid var(--line);font-size:12.5px">${av('tk')}<span class="ell">${m}</span><span class="sp mono muted">${h}</span><span class="muted" style="font-size:12px;white-space:nowrap">${w}</span></div>`).join('')}</div>`;
  let html = shell(`<div class="C" style="display:contents"><div class="cols">${cChat()}<div class="pr">${cPrHead()}${cReady('base')}<div class="ptabs">${[['Remarques', '4'], ['Fichiers', '4'], ['Commits', '4'], ['Contrôles', '5'], ['Description', '']].map(([l, c]) => `<span class="${l === 'Contrôles' ? 'on' : ''}">${l}${c ? `<span class="c">${c}</span>` : ''}</span>`).join('')}</div><div class="feed">${meta}</div></div></div></div>`, 'agents');
  html = html.replace('</div><div class="status">', `
    <div class="menu" style="top:92px;right:14px;width:300px"><h4>La PR #214</h4>
      <div class="it"><span>${ic('edit', 13)}</span><span><b>Repasser en brouillon</b></span></div>
      <div class="it hl"><span>${ic('user', 13)}</span><span><b>Relecteurs</b></span><small>Relecteur (agent) · marta · <span style="color:var(--text)">+ ajouter</span></small></div>
      <div class="it"><span>${ic('star', 13)}</span><span><b>Étiquettes</b></span><small>auth · sécurité</small></div>
      <div class="sepl"></div>
      <div class="it"><span>${ic('branch', 13)}</span><span><b>Mettre à jour la branche</b></span><small>à jour avec main</small></div>
      <div class="it"><span>${ic('sparkle', 13)}</span><span><b>Faire relire à nouveau</b></span><small>par un agent, sur les nouveaux commits</small></div>
      <div class="sepl"></div>
      <div class="it"><span>${ic('ext', 13)}</span><span><b>Ouvrir sur GitHub</b></span></div>
      <div class="it"><span style="color:var(--del)">${ic('close', 13)}</span><span><b style="color:var(--del)">Fermer la PR</b></span></div></div>
  </div><div class="status">`);
  return html;
}
function C_etats() {
  const fr = (state, chat, extra = '') => `<div class="frame C" style="height:400px;display:flex"><div class="cols" style="grid-template-columns:250px 1fr;width:100%">${chat}<div class="pr">${cPrHead()}${cReady(state)}${extra}</div></div></div>`;
  const mini = (who, kind, html) => `<div class="chat"><div class="colh">${av(kind)}<b>${who}</b></div><div class="msgs" style="font-size:12.5px">${html}</div></div>`;
  const reviewing = fr('reviewing', mini('Relecteur', 'ai', `<div class="ag"><p>Je relis la PR #214, fichier par fichier.</p><div class="tool">${ic('read', 13)}<span class="mono">session.ts</span><span class="spin ai sp"></span></div></div>`),
    `<div class="feed">${cRem('t1', DIFF_ML, 10, 12).replace(/<div class="acts">[\s\S]*?<\/div><\/div><\/div>$/, '</div></div>')}</div>`);
  const ci = fr('ci', mini('Lien magique', 'tk', `<div class="handoff"><span class="h">${ic('close', 13)}CI · e2e (Linux)</span><span class="q">2 tests en échec : <code class="mono">login.expired</code> sans texte.</span></div><div class="ag"><p>J'ajoute la traduction et je relance les tests.</p></div>`),
    `<div class="feed"><div class="rem"><div class="rh">${ko(13)}<b style="font-weight:600">e2e (Linux)</b><span class="muted">3 min 40</span><span class="sp btn sm quiet">Journal</span></div><div class="code" style="padding:8px 12px;white-space:pre;font-size:11.5px;line-height:19px"><span style="color:var(--del)">  ✗ login › un lien expiré se dit
    Received: "login.expired"</span></div></div></div>`);
  const conflict = fr('conflict', mini('Lien magique', 'tk', `<div class="ag"><p class="muted">En attente.</p></div>`),
    `<div class="feed"><div class="rem"><div class="rh">${ic('branch', 13)}<span class="mono">src/auth/session.ts</span><span class="pill ko" style="height:20px">conflit</span></div>${aConflict().replace(/^<div class="file">[\s\S]*?<\/div><div class="code">/, '<div class="code conf">').replace(/<\/div><\/div>$/, '</div>')}</div></div>`);
  const ready = fr('ready', mini('Lien magique', 'tk', `<div class="ag"><p>Les 4 remarques sont traitées, les tests passent.</p></div>`),
    `<div class="feed"><div class="rem"><div class="rh">${ok(13)}<b style="font-weight:600">Le merge</b></div><div style="padding:10px 12px;display:grid;gap:6px;font-size:12.5px;color:var(--soft)"><span>Squash en un commit sur main · la branche et le worktree supprimés · ATL-42 en Terminé</span></div></div></div>`);
  const cell = (t, s, h) => `<div class="cell"><h2>${t}<small>${s}</small></h2>${h}</div>`;
  return `<div class="sheet C"><h1>C · La PR à côté de l'agent<span>les quatre états, dans la carte « prête à merger ? » et l'agent d'à côté</span></h1>
    ${cell('Relecture en cours', 'l\'agent relecteur dans la colonne de gauche', reviewing)}${cell('CI rouge', 'l\'échec part à l\'agent du ticket, d\'un clic', ci)}
    ${cell('Conflit', 'la carte dit ce qui bloque, et le geste', conflict)}${cell('Prête à fusionner', 'tout est vert, le merge dit ce qu\'il fera', ready)}</div>`;
}

const R = { a: { fenetre: A_fenetre, controle: A_controle, etats: A_etats }, b: { fenetre: B_fenetre, controle: B_controle, etats: B_etats }, c: { fenetre: C_fenetre, controle: C_controle, etats: C_etats } };
document.getElementById('root').innerHTML = (R[D] && R[D][ROUTE] ? R[D][ROUTE] : A_fenetre)();
</script>
</body>
</html>
