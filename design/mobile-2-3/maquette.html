<!doctype html>
<!--
  ESC-549 : l'app mobile d'Escouade (MO-0), trois directions. Maquette statique, rien n'est branché.
  ?d=a|b|c, &theme=light, puis #appairage (le premier appairage par QR code), #accueil (ce qui attend, partout),
  #autorisation (une autorisation à répondre, la commande entière, le geste), #conversation (la conversation d'un agent,
  envoyer un message, dicter), #boite (une demande de la boîte « À toi » : un choix entre trois rendus), #kanban (le
  Kanban en lecture, un geste simple) ou #notification (l'écran verrouillé) ; en B seulement, la création choisie
  par l'utilisateur : #creer-projet, #creer-agent, #ticket-dicte. ?d=x#verrou, #horsligne, #revoque : les
  écrans communs aux trois. La page prend la taille de la fenêtre : 360 × 780 dessine un Android, 430 × 932 un iPhone.
  Jetons, polices et icônes de l'app (src/app.css, src/lib/icons.ts) ; données fictives (espaces Ce poste, Travail et
  Perso, leurs projets et leurs agents ; aucune clé, aucun compte). Captures : node design/mobile-2-3/render.mjs
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ESC-549 · l'app mobile</title>
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/opsz.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/400.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/500.css" />
<script src="icons.js"></script>
<style>
  /* Les jetons de src/app.css (sombre, puis clair). Les vues de tous les espaces prennent le teal d'Escouade (--p) ;
     la conversation d'un agent prend la couleur de son projet, comme la fenêtre du bureau. */
  :root {
    --p: oklch(0.72 0.09 190);
    --frame: color-mix(in oklch, var(--p) 8%, #08090a);
    --panel: color-mix(in oklch, var(--p) 4.5%, #0e0f11);
    --raise: color-mix(in oklch, var(--p) 6%, #15161a);
    --raise-2: color-mix(in oklch, var(--p) 6%, #1b1c20);
    --well: color-mix(in oklch, var(--p) 2%, #0a0b0d);
    --line: rgba(255, 255, 255, 0.075);
    --line-2: rgba(255, 255, 255, 0.12);
    --line-3: rgba(255, 255, 255, 0.2);
    --hover: rgba(255, 255, 255, 0.045);
    --text: #f7f8f8;
    --soft: #d0d3d8;
    --muted: #989da6;
    --dim: #8f949e;
    --text-ai: #e9ebee;
    --brand: #35c1bd;
    --teal-ink: oklch(0.86 0.08 190);
    --p-ink: color-mix(in oklch, var(--p) 70%, white);
    --run: oklch(0.79 0.15 155);
    --wait: oklch(0.84 0.14 82);
    --wait-bg: oklch(from var(--wait) l c h / 0.07);
    --wait-line: oklch(from var(--wait) l c h / 0.32);
    --on-wait: #1a1405;
    --del: oklch(0.74 0.14 22);
    --add: oklch(0.8 0.13 155);
    --idle: #7a7f88;
    --primary: #f2f3f4;
    --on-primary: #08090a;
    --code-fg: #d5d8dd;
    --scrim: rgba(3, 4, 5, 0.62);
    --shade: 1;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --wall: linear-gradient(165deg, #173b42 0%, #0d1015 52%, #1c1830 100%);
    color-scheme: dark;
  }
  :root[data-theme='light'] {
    --frame: color-mix(in oklch, var(--p) 7%, #f0f1f3);
    --panel: color-mix(in oklch, var(--p) 2.5%, #fdfdfd);
    --raise: color-mix(in oklch, var(--p) 4%, #f4f5f7);
    --raise-2: color-mix(in oklch, var(--p) 5%, #eceef1);
    --well: color-mix(in oklch, var(--p) 2.5%, #f6f7f9);
    --line: rgba(15, 17, 22, 0.09);
    --line-2: rgba(15, 17, 22, 0.14);
    --line-3: rgba(15, 17, 22, 0.24);
    --hover: rgba(15, 17, 22, 0.045);
    --text: #15171c;
    --soft: #363a42;
    --muted: #555a63;
    --dim: #5c616a;
    --text-ai: #1d2026;
    --brand: oklch(0.52 0.09 190);
    --teal-ink: oklch(0.42 0.08 190);
    --p-ink: color-mix(in oklch, var(--p) 50%, #15171c);
    --run: oklch(0.48 0.13 155);
    --wait: oklch(0.5 0.11 70);
    --wait-bg: oklch(from var(--wait) l c h / 0.09);
    --wait-line: oklch(from var(--wait) l c h / 0.4);
    --on-wait: #ffffff;
    --del: oklch(0.5 0.18 25);
    --add: oklch(0.45 0.13 155);
    --primary: #1b1d22;
    --on-primary: #f7f8f8;
    --code-fg: #24272e;
    --scrim: rgba(24, 26, 32, 0.3);
    --shade: 0.3;
    --wall: linear-gradient(165deg, #cde8e7 0%, #eef1f4 52%, #e1dbf2 100%);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--panel); }
  body { font: 15px/1.45 'Inter Variable', Inter, system-ui, sans-serif; font-feature-settings: 'cv11', 'ss03'; color: var(--text);
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  ::selection { background: color-mix(in oklch, var(--p) 30%, transparent); }
  p { margin: 0; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--mono); font-size: 0.9em; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .tn { font-variant-numeric: tabular-nums; }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sp { margin-left: auto; }

  /* ───────── Le téléphone : la barre d'état et l'indicateur du système (Android à 360, iPhone à 430) ───────── */
  .phone { width: 100vw; height: 100vh; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--panel);
    --sb: 30px; --hb: 22px; --gut: 16px; }
  .ios .phone, .phone.ios { --sb: 54px; --hb: 34px; --gut: 18px; }
  .sb { height: var(--sb); flex: none; display: flex; align-items: center; padding: 0 18px 0 20px; font: 600 13.5px/1 'Inter Variable', sans-serif;
    font-variant-numeric: tabular-nums; color: var(--text); position: relative; z-index: 30; }
  .ios .sb { padding: 14px 28px 0 38px; font-size: 16px; }
  .sb .icons { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .sb .icons svg { height: 12px; width: auto; fill: currentColor; }
  .ios .sb .icons svg { height: 13px; }
  .sb .island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; border-radius: 20px; background: #000; transform: translateX(-50%); }
  .hb { height: var(--hb); flex: none; display: grid; place-items: center; position: relative; z-index: 30; }
  .hb::after { content: ''; width: 108px; height: 4px; border-radius: 3px; background: var(--text); opacity: 0.85; }
  .ios .hb::after { width: 136px; height: 5px; margin-top: 6px; }
  .scr { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

  /* ───────── Les pièces communes ───────── */
  .nav { height: 52px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
  .nav .t { font-weight: 640; font-size: 16.5px; letter-spacing: -0.01em; min-width: 0; }
  .nav .t small { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .ib { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--soft); flex: none; position: relative; }
  .ib.on { background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text); }
  .lt { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
  .btn { height: 46px; padding: 0 16px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600;
    font-size: 15px; background: rgba(var(--fg, 255, 255, 255), 0.05); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text); white-space: nowrap; flex: none; }
  :root[data-theme='light'] .btn:not(.pri):not(.ok):not(.ghost) { background: rgba(15, 17, 22, 0.04); }
  .btn.pri { background: var(--primary); color: var(--on-primary); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.18); }
  .btn.ghost { background: none; box-shadow: none; color: var(--soft); padding: 0 10px; }
  .btn.sm { height: 38px; font-size: 14px; padding: 0 13px; border-radius: 10px; }
  .btn.ok { background: var(--run); color: #06140c; box-shadow: none; }
  :root[data-theme='light'] .btn.ok { color: #fff; }
  .btn[disabled] { opacity: 0.45; }
  .btn.grow { flex: 1; min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
    background: rgba(127, 127, 127, 0.1); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--soft); }
  .pill svg.i { width: 14px; height: 14px; }
  .pill.w { background: var(--wait-bg); box-shadow: inset 0 0 0 1px var(--wait-line); color: var(--wait); }
  .pill.r { background: oklch(from var(--run) l c h / 0.1); box-shadow: inset 0 0 0 1px oklch(from var(--run) l c h / 0.32); color: var(--run); }
  .pill.t { background: oklch(from var(--brand) l c h / 0.1); box-shadow: inset 0 0 0 1px oklch(from var(--brand) l c h / 0.36); color: var(--teal-ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--run); }
  .dot.w { background: var(--wait); box-shadow: 0 0 0 3px oklch(from var(--wait) l c h / 0.22); }
  .dot.idle { background: var(--idle); }
  .pdot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
  .plq { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; flex: none; font-weight: 700; font-size: 11.5px; color: var(--soft);
    background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line-3); }
  .plq svg.i { width: 13px; height: 13px; }
  .plq.lg { width: 38px; height: 38px; border-radius: 11px; font-size: 16px; }
  .plq.lg svg.i { width: 19px; height: 19px; }
  .where { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); min-width: 0; flex-wrap: nowrap; }
  .where b { color: var(--soft); font-weight: 600; white-space: nowrap; }
  .where .s { opacity: 0.6; }
  .lab { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .cmd { margin: 0; font: 400 12.6px/1.6 var(--mono); color: var(--code-fg); background: var(--well); border-radius: 10px; padding: 10px 12px;
    box-shadow: inset 0 0 0 1px var(--line-2); white-space: pre-wrap; word-break: break-all; }
  .cmd .pr { color: var(--muted); user-select: none; }
  .path { font: 400 12px/1.4 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fine { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .fine b { color: var(--soft); font-weight: 600; }
  .sep { height: 1px; background: var(--line); }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line-3); margin: 8px auto 4px; flex: none; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 10; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; background: var(--raise); border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
    box-shadow: inset 0 1px 0 var(--line-2), 0 -20px 50px -12px rgba(0, 0, 0, calc(0.6 * var(--shade))); }
  .seg { display: flex; padding: 3px; border-radius: 11px; background: rgba(127, 127, 127, 0.08); box-shadow: inset 0 0 0 1px var(--line); gap: 2px; min-width: 0; }
  .seg > span { flex: 1; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; min-width: 0; }
  .seg > span.on { background: var(--raise-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(0, 0, 0, calc(0.3 * var(--shade))); }
  .seg > span .c { font-size: 12px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .badge { min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--wait); color: var(--on-wait); font-size: 11.5px; font-weight: 700;
    display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
  .jauge { display: flex; gap: 4px; }
  .jauge i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); }
  .jauge i.w { background: var(--wait); }
  .jauge i.cur { box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 3px var(--text); }

  /* Les rendus d'un choix : planches, sceau (repris de la boîte « À toi » du bureau). */
  .plate { position: relative; border-radius: 12px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-2); min-width: 0; }
  .plate.on { box-shadow: inset 0 0 0 1.5px var(--brand); }
  .plate .shot { padding: 8px; }
  .plate .shot svg { display: block; width: 100%; height: auto; border-radius: 7px; box-shadow: 0 0 0 1px var(--line); }
  .plate .cred { display: flex; align-items: center; gap: 8px; padding: 8px 10px 9px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); min-width: 0; white-space: nowrap; }
  .plate .cred .l { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 12px; box-shadow: inset 0 0 0 1px var(--line-3); color: var(--soft); flex: none; }
  .plate.on .cred .l { background: var(--brand); color: #08090a; box-shadow: none; }
  .plate .cred b { color: var(--text); font-weight: 620; }
  .seal { position: absolute; top: -14px; right: -8px; width: 58px; height: 58px; z-index: 2; }
  .seal circle.bg { fill: var(--panel); stroke: var(--brand); stroke-width: 1.2; }
  .seal circle.in { fill: none; stroke: oklch(from var(--brand) l c h / 0.45); stroke-width: 0.8; }
  .seal text { font: 700 6.3px 'Inter Variable', Inter, sans-serif; letter-spacing: 0.16em; fill: var(--teal-ink); }
  .seal path.ck { fill: none; stroke: var(--teal-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .opts { display: flex; gap: 6px; }
  .opts > span { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: var(--soft);
    box-shadow: inset 0 0 0 1px var(--line-2); background: rgba(127, 127, 127, 0.06); flex: none; position: relative; }
  .opts > span.on { background: var(--brand); color: #08090a; box-shadow: none; }
  .opts > span.rec::after { content: ''; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--teal-ink); }
  .opts > span.on.rec::after { background: #08090a; }

  /* La conversation (commune aux trois, son cadre change) */
  .conv { flex: 1; min-height: 0; overflow: hidden; padding: 6px var(--gut) 10px; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end; }
  .msg-u { align-self: flex-end; max-width: 84%; background: var(--raise-2); border-radius: 16px 16px 4px 16px; padding: 9px 13px; box-shadow: inset 0 0 0 1px var(--line); }
  .msg-a { color: var(--text-ai); font-size: 15px; line-height: 1.5; }
  .msg-a code { font: 400 0.86em var(--mono); padding: 1px 5px; border-radius: 5px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line); }
  .tool { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--muted); min-width: 0; }
  .tool svg.i { width: 15px; height: 15px; }
  .tool b { color: var(--soft); font-weight: 600; }
  .tool .mono { color: var(--soft); }
  .tool .ad { color: var(--add); font-variant-numeric: tabular-nums; }
  .tool .dl { color: var(--del); font-variant-numeric: tabular-nums; }
  .tools { display: grid; gap: 8px; padding-left: 2px; }
  .composer { flex: none; margin: 0 10px 8px; border-radius: 16px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2), 0 12px 32px -12px rgba(0, 0, 0, calc(0.6 * var(--shade)));
    display: flex; align-items: center; gap: 4px; padding: 5px 5px 5px 14px; min-height: 54px; }
  .composer .f { flex: 1; color: var(--muted); font-size: 15px; min-width: 0; }
  .composer .f.typed { color: var(--text); }
  .composer .send { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); flex: none; }
  .composer .send.off { background: rgba(127, 127, 127, 0.14); color: var(--muted); }
  .composer .mic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--soft); flex: none; }
  .perm { border-radius: 14px; background: var(--wait-bg); box-shadow: inset 0 0 0 1px var(--wait-line); padding: 12px; display: grid; gap: 9px; }
  .perm .h { display: flex; align-items: center; gap: 8px; color: var(--wait); font-weight: 650; font-size: 14px; }
  .perm .h svg.i { width: 16px; height: 16px; }
  .perm .acts { display: flex; gap: 8px; }

  /* Le glissé pour autoriser (A) et le maintien (C) */
  .slide { position: relative; height: 58px; border-radius: 16px; background: rgba(127, 127, 127, 0.1); box-shadow: inset 0 0 0 1px var(--line-2); overflow: hidden;
    display: grid; place-items: center; font-weight: 620; font-size: 15px; color: var(--soft); flex: none; }
  .slide .fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--x, 0%); background: linear-gradient(90deg, oklch(from var(--wait) l c h / 0.18), oklch(from var(--run) l c h / 0.42)); }
  .slide .th { position: absolute; top: 5px; left: calc(5px + (100% - 58px) * var(--k, 0)); width: 48px; height: 48px; border-radius: 12px; background: var(--primary); color: var(--on-primary);
    display: grid; place-items: center; box-shadow: 0 4px 12px -4px rgba(0, 0, 0, calc(0.6 * var(--shade))); }
  .slide .th svg.i { width: 20px; height: 20px; }
  .slide .lb { position: relative; display: flex; align-items: center; gap: 8px; padding-left: 40px; }
  .slide .lb svg.i { width: 15px; height: 15px; opacity: 0.8; }
  .slide.live .th { background: var(--run); color: #06140c; }
  :root[data-theme='light'] .slide.live .th { color: #fff; }
  .hold { position: relative; height: 56px; border-radius: 16px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; gap: 10px;
    font-weight: 650; font-size: 15.5px; overflow: hidden; flex: 1; min-width: 0; }
  .hold .sweep { position: absolute; inset: 0; width: var(--x, 0%); background: var(--run); }
  .hold > span, .hold > svg { position: relative; }
  .hold.live { color: #06140c; }
  :root[data-theme='light'] .hold.live { color: #fff; }
  .ring { width: 26px; height: 26px; transform: rotate(-90deg); position: relative; flex: none; }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .bgc { stroke: currentColor; opacity: 0.25; }
  .ring .fg { stroke: currentColor; stroke-linecap: round; }

  /* L'écran verrouillé (notifications), dessiné comme le système */
  .phone.locked { background: var(--wall); }
  .lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 22px; }
  .lock .date { font-size: 17px; font-weight: 550; color: var(--soft); }
  .lock .clock { font-size: 84px; font-weight: 650; letter-spacing: -0.04em; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; color: var(--text); }
  .android .lock { align-items: flex-start; padding-left: 24px; padding-right: 24px; }
  .android .lock .clock { font-size: 72px; font-weight: 500; letter-spacing: -0.03em; }
  .notifs { width: 100%; padding: 0 10px; margin-top: auto; margin-bottom: 18px; display: grid; gap: 8px; }
  .android .notifs { padding: 0; }
  .nt { border-radius: 20px; padding: 12px 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 11px; position: relative;
    background: color-mix(in oklch, var(--raise) 86%, transparent); box-shadow: inset 0 0 0 1px var(--line-2), 0 8px 24px -10px rgba(0, 0, 0, calc(0.5 * var(--shade))); }
  .android .nt { border-radius: 22px; }
  .nt .ap { grid-row: span 3; width: 36px; height: 36px; border-radius: 9px; background: #35c1bd; color: #08090a; display: grid; place-items: center; }
  .nt .ap svg { width: 22px; height: 22px; }
  .nt .hd { display: flex; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
  .nt .hd b { color: var(--soft); font-weight: 600; }
  .nt .tt { font-weight: 650; font-size: 15px; line-height: 1.3; }
  .nt .bd { font-size: 14px; color: var(--soft); line-height: 1.35; }
  .nt .ac { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 8px; }
  .nt .ac span { flex: 1; height: 40px; border-radius: 11px; display: grid; place-items: center; font-weight: 600; font-size: 14px; background: rgba(127, 127, 127, 0.14); }
  .stackbehind { position: relative; }
  .stackbehind::before, .stackbehind::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -7px; height: 20px; border-radius: 0 0 18px 18px;
    background: color-mix(in oklch, var(--raise) 70%, transparent); box-shadow: inset 0 -1px 0 var(--line-2); z-index: -1; }
  .stackbehind::after { left: 28px; right: 28px; bottom: -13px; opacity: 0.7; }
  .lock .foot { width: 100%; display: flex; justify-content: space-between; padding: 0 30px 6px; }
  .lock .foot span { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklch, var(--raise) 70%, transparent); color: var(--text); }
  .ngrp { font-size: 13px; font-weight: 650; color: var(--soft); padding: 2px 6px 0; display: flex; gap: 8px; align-items: center; }

  /* ───────── A · La pile ───────── */
  .a-top { display: flex; align-items: center; gap: 6px; padding: 4px 8px 0 var(--gut); flex: none; }
  .chip { height: 38px; border-radius: 12px; padding: 0 10px 0 6px; display: inline-flex; align-items: center; gap: 8px; font-weight: 620; font-size: 14.5px;
    background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); white-space: nowrap; min-width: 0; }
  .chip svg.i { width: 15px; height: 15px; color: var(--muted); }
  .a-head { padding: 12px var(--gut) 10px; display: grid; gap: 8px; flex: none; }
  .a-head .r { display: flex; align-items: baseline; gap: 10px; }
  .a-head .r .n { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .deck { flex: 1; min-height: 0; position: relative; margin: 6px var(--gut) 0; }
  .deck .bk { position: absolute; left: 14px; right: 14px; top: 0; height: 40px; border-radius: 20px 20px 0 0; background: var(--raise); box-shadow: inset 0 1px 0 var(--line-2), inset 0 0 0 1px var(--line); opacity: 0.6; }
  .deck .bk.b2 { left: 26px; right: 26px; top: -7px; opacity: 0.35; }
  .card { position: absolute; left: 0; right: 0; top: 8px; bottom: 12px; border-radius: 20px; background: var(--raise); display: flex; flex-direction: column; gap: 9px; padding: 14px;
    box-shadow: inset 0 0 0 1px var(--line-2), 0 18px 40px -16px rgba(0, 0, 0, calc(0.7 * var(--shade))); overflow: hidden; }
  .card.w { box-shadow: inset 0 0 0 1px var(--wait-line), 0 18px 40px -16px rgba(0, 0, 0, calc(0.7 * var(--shade))); background: linear-gradient(var(--wait-bg), var(--wait-bg)), var(--raise); }
  .card.go { box-shadow: inset 0 0 0 1.5px oklch(from var(--run) l c h / 0.6), 0 18px 40px -16px rgba(0, 0, 0, calc(0.7 * var(--shade))); transform: rotate(1.2deg) translateX(6px); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card h2 { font-size: 19px; font-weight: 680; letter-spacing: -0.015em; line-height: 1.25; }
  .card .grow { flex: 1; min-height: 0; }
  .card .row2 { display: flex; gap: 8px; }
  .peek { flex: none; margin-top: 4px; background: var(--raise); border-radius: 18px 18px 0 0; box-shadow: inset 0 1px 0 var(--line-2); padding: 0 8px 4px; }
  .peek .r { display: flex; gap: 4px; }
  .peek .r > span { flex: 1; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14px; font-weight: 600; color: var(--soft); white-space: nowrap; min-width: 0; }
  .peek .r > span .c { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .carousel { display: flex; gap: 10px; margin: 0 -14px; padding: 6px 14px 0; overflow: hidden; }
  .carousel .plate { flex: 0 0 76%; }
  .carousel .plate.side { opacity: 0.55; }
  .ctx { border-left: 0; padding: 10px 12px; border-radius: 10px; background: rgba(127, 127, 127, 0.06); font-size: 14px; color: var(--soft); line-height: 1.45; }
  .ctx .lab { display: block; margin-bottom: 3px; }

  /* La caméra de l'appairage (commune aux trois, son cadre change) */
  .cam { position: relative; overflow: hidden; background: radial-gradient(80% 60% at 50% 40%, #2a2f38, #0b0c0f 70%); }
  .cam .desk { position: absolute; left: 50%; top: 46%; width: 86%; aspect-ratio: 16 / 10.5; transform: translate(-50%, -50%) rotate(-3deg) skewX(-2deg); border-radius: 10px;
    background: #101216; box-shadow: 0 0 0 6px #1b1d22, 0 30px 60px -10px rgba(0, 0, 0, 0.8); filter: blur(0.3px); overflow: hidden; display: grid; grid-template-columns: 30% 1fr; }
  .cam .desk .side { background: #0b0c0f; }
  .cam .desk .main { padding: 7% 8%; display: grid; grid-template-columns: 1fr 42%; gap: 8%; align-items: center; }
  .cam .desk .lines i { display: block; height: 5px; border-radius: 3px; background: #2a2e36; margin: 6px 0; }
  .cam .desk .lines i:first-child { width: 70%; background: #4a4f58; height: 7px; }
  .cam .desk .qr { background: #fff; border-radius: 4px; padding: 5%; }
  .cam .desk .qr svg { display: block; width: 100%; height: auto; }
  .cam .frame { position: absolute; width: 132px; height: 132px; left: calc(50% + 21%); top: 46%; transform: translate(-50%, -50%); }
  .cam .frame i { position: absolute; width: 30px; height: 30px; border: 3.5px solid #35c1bd; }
  .cam .frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
  .cam .frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .cam .frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
  .cam .frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
  .cam .found { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(8, 9, 10, 0.72); color: #f7f8f8; border-radius: 12px; padding: 8px 12px;
    font-size: 13.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); }
  .cam .found svg.i { width: 15px; height: 15px; color: #35c1bd; }
  .field { height: 48px; border-radius: 12px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-2); display: flex; align-items: center; padding: 0 14px; font-size: 15px; gap: 8px; min-width: 0; }
  .field.f { box-shadow: inset 0 0 0 1px oklch(from var(--p) l c h / 0.6), 0 0 0 3px oklch(from var(--p) l c h / 0.14); }
  .field .caret { width: 1.5px; height: 20px; background: var(--p-ink); margin-left: -6px; }

  /* ───────── B · Le fil ───────── */
  .b-head { padding: 6px var(--gut) 8px; flex: none; display: grid; gap: 10px; }
  .b-head .r { display: flex; align-items: center; gap: 6px; }
  .chips { display: flex; gap: 6px; overflow: hidden; margin: 0 calc(-1 * var(--gut)); padding: 0 var(--gut); }
  .chips > span { height: 34px; border-radius: 10px; padding: 0 11px; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: var(--soft);
    box-shadow: inset 0 0 0 1px var(--line-2); white-space: nowrap; flex: none; }
  .chips > span.on { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .chips > span .c { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
  .chips > span.on .c { color: inherit; opacity: 0.7; }
  .chips > span svg.i { width: 14px; height: 14px; }
  .feed { flex: 1; min-height: 0; overflow: hidden; }
  .grp { display: flex; align-items: center; gap: 7px; padding: 14px var(--gut) 6px; font-size: 13px; font-weight: 650; color: var(--muted); }
  .grp.w { color: var(--wait); }
  .grp svg.i { width: 14px; height: 14px; }
  .grp .c { font-variant-numeric: tabular-nums; font-weight: 600; opacity: 0.8; }
  .row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 3px 10px; padding: 11px var(--gut); align-items: start; position: relative; }
  .row + .row { box-shadow: inset 0 1px 0 var(--line); }
  .row .k { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--soft); background: rgba(127, 127, 127, 0.1); box-shadow: inset 0 0 0 1px var(--line); }
  .row .k svg.i { width: 16px; height: 16px; }
  .row.w .k { color: var(--wait); background: var(--wait-bg); box-shadow: inset 0 0 0 1px var(--wait-line); }
  .row .tt { font-weight: 620; font-size: 15px; line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .mt { grid-column: 2; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
  .row .mt .pdot { width: 8px; height: 8px; }
  .row .tm { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 2px; display: flex; align-items: center; gap: 6px; }
  .row .new { width: 8px; height: 8px; border-radius: 50%; background: var(--p-ink); }
  .row .mini { grid-column: 2; display: flex; gap: 5px; margin-top: 5px; }
  .row .mini svg { width: 64px; height: 40px; border-radius: 5px; box-shadow: 0 0 0 1px var(--line-2); display: block; }
  .row.open { background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2) !important; border-radius: 16px; margin: 4px 8px; padding: 12px 10px; grid-template-columns: 30px minmax(0, 1fr) auto; }
  .row.open.w { background: linear-gradient(var(--wait-bg), var(--wait-bg)), var(--raise); box-shadow: inset 0 0 0 1px var(--wait-line) !important; }
  .row .ex { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 8px; min-width: 0; }
  .row .ex .acts { display: flex; gap: 8px; }
  .row.dim { opacity: 0.5; }
  .tabs { flex: none; display: flex; background: var(--frame); box-shadow: inset 0 1px 0 var(--line); padding: 6px 6px 0; }
  .tabs > span { flex: 1; height: 52px; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); position: relative; }
  .tabs > span svg.i { width: 22px; height: 22px; }
  .tabs > span.on { color: var(--text); }
  .tabs > span.on svg.i { color: var(--p-ink); }
  .tabs > span .badge { position: absolute; top: 2px; left: calc(50% + 6px); }
  .strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
  .strip .plate .shot { padding: 5px; }
  .strip .plate .cred { padding: 6px 7px; gap: 6px; font-size: 12px; }
  .strip .plate .cred .l { width: 20px; height: 20px; }
  .strip .seal { width: 46px; height: 46px; top: -12px; right: -8px; }
  .swipe { position: relative; overflow: hidden; }
  .swipe .under { position: absolute; inset: 0; display: flex; justify-content: flex-end; }
  .swipe .under span { width: 88px; display: grid; place-items: center; align-content: center; gap: 4px; font-size: 12.5px; font-weight: 650; }
  .swipe .under span svg.i { width: 20px; height: 20px; }
  .swipe .under .rv { background: var(--raise-2); color: var(--soft); }
  .swipe .under .ok { background: var(--run); color: #06140c; }
  :root[data-theme='light'] .swipe .under .ok { color: #fff; }
  .swipe .row { background: var(--panel); transform: translateX(-176px); }
  .tk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 12px var(--gut); }
  .tk + .tk, .swipe + .tk, .tk + .swipe { box-shadow: inset 0 1px 0 var(--line); }
  .tk .key { font-weight: 650; font-size: 13.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .tk .tt { grid-column: 1 / -1; font-weight: 600; font-size: 15px; line-height: 1.3; }
  .tk .mt { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .loop { display: inline-flex; gap: 2px; }
  .loop i { width: 6px; height: 6px; border-radius: 1.5px; background: var(--line-3); }
  .loop i.d { background: var(--run); }
  .loop i.c { background: var(--wait); }
  .steps { display: grid; gap: 12px; }
  .steps .st { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 12px; }
  .steps .st .n { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; box-shadow: inset 0 0 0 1px var(--line-3); color: var(--soft); grid-row: span 2; }
  .steps .st.on .n { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .steps .st b { font-weight: 640; font-size: 15px; }
  .steps .st span { font-size: 13.5px; color: var(--muted); }
  .code8 { display: flex; gap: 5px; align-items: center; }
  .code8 i { flex: 1; height: 46px; border-radius: 10px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-2); display: grid; place-items: center; font: 500 17px var(--mono); font-style: normal; min-width: 0; }
  .code8 i.f { box-shadow: inset 0 0 0 1px oklch(from var(--p) l c h / 0.6), 0 0 0 3px oklch(from var(--p) l c h / 0.14); }
  .code8 b { color: var(--muted); font-weight: 400; }

  /* ───────── C · Les espaces ───────── */
  .c-top { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px var(--gut); flex: none; }
  .c-top .t { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .c-top .s { font-size: 13.5px; color: var(--muted); }
  .wallet { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 10px 0; gap: 0; }
  .sc { border-radius: 20px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2), 0 -6px 18px -10px rgba(0, 0, 0, calc(0.6 * var(--shade))); position: relative; }
  .sc + .sc { margin-top: -14px; }
  .sc .st { display: flex; align-items: center; gap: 11px; padding: 11px 12px 24px; }
  .sc .st .nm { font-weight: 660; font-size: 16px; letter-spacing: -0.01em; line-height: 1.2; }
  .sc .st .nm small { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .sc.off { background: color-mix(in oklch, var(--raise) 70%, var(--panel)); }
  .sc.off .st .nm { color: var(--soft); }
  .sc.front { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: inset 0 0 0 1px var(--line-3), 0 -10px 26px -12px rgba(0, 0, 0, calc(0.7 * var(--shade))); }
  .sc.front .st { padding-bottom: 8px; }
  .sc .body { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow: hidden; }
  .sc .sh { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 650; color: var(--muted); margin-top: 4px; }
  .sc .sh .c { font-variant-numeric: tabular-nums; }
  .tiles { display: flex; gap: 8px; margin: 0 -12px; padding: 2px 12px 4px; overflow: hidden; flex: none; }
  .tile { flex: 0 0 156px; height: 132px; border-radius: 14px; background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line-2); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tile.w { background: linear-gradient(var(--wait-bg), var(--wait-bg)), var(--raise-2); box-shadow: inset 0 0 0 1px var(--wait-line); }
  .tile .tt { font-weight: 620; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .mt { margin-top: auto; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
  .tile .mini { display: flex; gap: 3px; }
  .tile .mini svg { width: 40px; height: 25px; border-radius: 3px; box-shadow: 0 0 0 1px var(--line-2); display: block; }
  .tile.focus { flex-basis: 230px; height: auto; box-shadow: inset 0 0 0 1.5px var(--line-3), 0 10px 24px -12px rgba(0, 0, 0, calc(0.7 * var(--shade))); }
  .tile.faded { opacity: 0.55; }
  .ag { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 1px 10px; align-items: center; padding: 9px 2px; }
  .ag + .ag { box-shadow: inset 0 1px 0 var(--line); }
  .ag .n { font-weight: 620; font-size: 14.5px; display: flex; gap: 7px; align-items: center; min-width: 0; }
  .ag .d { grid-column: 2; font-size: 13px; color: var(--muted); }
  .ag .tm { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cfoot { flex: none; display: flex; gap: 6px; padding: 8px 12px 6px; box-shadow: inset 0 1px 0 var(--line); }
  .cfoot > span { flex: 1; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 620; font-size: 14px; color: var(--soft); white-space: nowrap; }
  .cfoot > span.on { background: var(--raise-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
  .cfoot > span .badge { margin-left: 2px; }
  .slot { border-radius: 20px; border: 1.5px dashed var(--line-3); display: grid; place-items: center; color: var(--muted); font-size: 14px; font-weight: 600; height: 64px; }
  .krow { display: grid; gap: 6px; }
  .krow .kh { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 650; color: var(--soft); }
  .krow .kh .c { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ktiles { display: flex; gap: 8px; overflow: hidden; margin: 0 -12px; padding: 2px 12px; }
  .ktile { flex: 0 0 150px; border-radius: 12px; background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line); padding: 9px 10px; display: grid; gap: 4px; align-content: start; min-width: 0; }
  .ktile .key { font-weight: 650; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .ktile .tt { font-size: 13.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ktile.focus { flex-basis: 236px; box-shadow: inset 0 0 0 1.5px var(--wait-line), 0 10px 24px -12px rgba(0, 0, 0, calc(0.7 * var(--shade))); background: linear-gradient(var(--wait-bg), var(--wait-bg)), var(--raise-2); }
  .ktile .acts { display: flex; gap: 6px; margin-top: 6px; }

  .android .big-only { display: none !important; }
  .ios .small-only { display: none !important; }
  .android .a-head .fine { display: none; }
  .phone.dark-top .sb, .phone.dark-top .hb { color: #f7f8f8; }
  .phone.dark-top .hb::after { background: #f7f8f8; }
  .sheet h2 { font-size: 19px; font-weight: 680; letter-spacing: -0.015em; line-height: 1.25; }
  .sheet .top { display: flex; align-items: center; gap: 8px; }
  .sc .st .nm { min-width: 0; }
  .sc .st .nm small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }


  /* La création (B) : une feuille plein écran, ses champs, le clonage suivi, la dictée */
  .form { flex: 1; min-height: 0; overflow: hidden; padding: 4px var(--gut) 0; display: flex; flex-direction: column; gap: 14px; }
  .fgrp { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; min-width: 0; }
  .fgrp .h { display: flex; align-items: baseline; gap: 8px; }
  .spaces { display: flex; gap: 6px; }
  .spaces > span { flex: 1; min-width: 0; height: 52px; border-radius: 12px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 620; font-size: 14px;
    box-shadow: inset 0 0 0 1px var(--line-2); white-space: nowrap; overflow: hidden; }
  .spaces > span.on { box-shadow: inset 0 0 0 1.5px var(--p-ink); background: oklch(from var(--p) l c h / 0.08); }
  .spaces > span.off { opacity: 0.45; }
  /* À 360, les espaces passent en liste : une ligne chacun, le nom et l'hôte en entier. */
  .android .spaces { flex-direction: column; gap: 4px; }
  .android .form { gap: 12px; }
  .android .spaces > span { flex: none; height: 42px; }
  .android .spaces > span small { display: inline; margin-left: 8px; }
  .spaces > span small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .field.mono-f { font: 400 13px var(--mono); }
  .field .k { color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: rgba(127, 127, 127, 0.16); overflow: hidden; }
  .bar i { display: block; height: 100%; width: var(--x); background: var(--run); border-radius: 3px; }
  .clone { border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
  .clone .r { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 620; }
  .clone .r .tn { margin-left: auto; color: var(--muted); font-weight: 600; font-size: 13px; }
  .clone .log { font: 400 11.5px/1.5 var(--mono); color: var(--muted); }
  .sw { width: 44px; height: 26px; border-radius: 13px; background: var(--p-ink); position: relative; flex: none; }
  .sw::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); }

  const c = pal(LIGHT);
  const r = (x, y, w, h, f, rx = 3) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}"/>`;
  const bars = (x, y, n, w, f) => Array.from({ length: n }, (_, i) => r(x, y + i * 9, w - (i * 37) % 60, 3.5, f, 1.5)).join('');

C.autorisation = () => shell(`${cTop()}<div class="wallet">${cHome()}</div>`, { over: `<div class="scrim"></div><div class="sheet" style="top:calc(var(--sb) + 70px)">${cSheetHead('travail', { sub: 'escouade.acme.internal · les agents tournent là-bas' })}
  <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">${permHead()}${where(PERM, { space: false })}<h2>${PERM.title}</h2>
    <span class="lab">La commande, en entier</span>${cmdBlock()}<div class="path">dans ${PERM.path}</div><div style="flex:1"></div>
    <div class="fine">Maintiens une seconde, puis ${IOS ? 'Face ID' : 'ton empreinte'} : ${q('Autorisé')} part à <b>tests-e2e</b>, sur Travail.</div>
    <div style="display:flex;gap:8px"><span class="btn">Refuser</span>${holdBtn(0.62)}</div></div><div class="hb"></div></div>` });
C.conversation = () => shell(`<div class="nav"><span class="ib">${ic('chev-l', 22)}</span>${plq('travail')}<div class="t ell" style="margin-left:6px">${PERM.agent}<small class="ell">Travail / facturation · <span style="color:var(--wait)">attend ta réponse</span></small></div><span class="ib sp">${ic('more', 20)}</span></div>
  <div class="conv">${convMessages(`<div class="perm"><div class="h">${ic('shield')}Autorisation · l’agent s’est arrêté</div>${cmdBlock()}<div class="acts"><span class="btn">Refuser</span><span class="hold"><svg class="ring" viewBox="0 0 26 26"><circle class="bgc" cx="13" cy="13" r="10"/></svg><span>Maintenir pour autoriser</span></span></div></div>`)}</div>${composer({ typed: '', off: true })}`);
C.boite = () => shell(`${cTop()}<div class="wallet">${cHome()}</div>`, { over: `<div class="scrim"></div><div class="sheet" style="top:calc(var(--sb) + 24px)">${cSheetHead('poste', { sub: 'DESKTOP-7QK2 · portail-adherents · design-tableau' })}
  <div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:hidden">
    <div style="display:flex;gap:8px;align-items:center"><span class="pill">${ic('choice')}Choix</span><span class="fine">depuis 40 min</span></div>
    <h2 style="font-size:20px;font-weight:700;letter-spacing:-0.015em;line-height:1.25">Choisis la direction du tableau de bord</h2>
    <div class="fine"><b>Recommandé : B · Cartes empilées.</b> La courbe des cotisations reste lisible sur un téléphone. Ta réponse débloque DEM-13 et DEM-14.</div>
    <div style="display:grid;gap:14px;padding-top:6px">${plate('A', { desc: true })}${plate('B', { desc: true })}${plate('C', { desc: true })}</div></div>
  <div style="flex:none;display:flex;gap:8px;align-items:center;padding:10px 14px 6px;box-shadow:inset 0 1px 0 var(--line);background:var(--raise)"><div class="opts"><span>A</span><span class="on rec">B</span><span>C</span></div><span class="btn pri grow">Choisir B</span></div><div class="hb"></div></div>` });
const kTile = (key, title, meta, o = {}) => `<div class="ktile ${o.focus ? 'focus' : ''}"><span class="key tn">${key}${o.loop ? `<span class="loop sp">${o.loop}</span>` : ''}</span><span class="tt">${title}</span><span class="fine ell">${meta}</span>${o.focus ? `<div class="acts"><span class="btn sm grow">Renvoyer</span><span class="btn sm ok grow">${ic('check')}Valider</span></div>` : ''}</div>`;
const L = (n, c) => Array.from({ length: 5 }, (_, i) => `<i class="${i < n ? 'd' : i === n && c ? 'c' : ''}"></i>`).join('');
C.kanban = () => shell(`${cTop()}<div class="wallet">${cStrip('poste', '<span class="badge">2</span>')}${cFront(`<div class="chips" style="margin:2px -12px 4px;padding:0 12px"><span class="on">${pd('facturation')}facturation</span><span>${pd('api-clients')}api-clients</span><span>${pd('infra-k8s')}infra-k8s</span></div>
    <div class="krow"><div class="kh">${ic('play', 15)}À tester <span class="c">2</span></div><div class="ktiles">${kTile('FAC-38', 'Avoirs partiels sur une facture payée', 'tests-e2e · boucle 3/5', { focus: true, loop: L(3) })}${kTile('FAC-40', 'Export comptable au format FEC', 'export-fec · 2/5', { loop: L(2) })}</div></div>
    <div class="krow"><div class="kh"><span class="dot"></span>En cours <span class="c">2</span></div><div class="ktiles">${kTile('FAC-41', 'Relances automatiques à J+15', 'relances · 2/5', { loop: L(1, 1) })}${kTile('FAC-43', 'Arrondis de la TVA par ligne', 'tva-lignes · 1/5', { loop: L(0, 1) })}${kTile('FAC-44', 'Avoir sur un acompte', 'avoir-acompte')}</div></div>
    <div class="krow"><div class="kh">${ic('circle', 15)}À faire <span class="c">4</span></div><div class="ktiles">${kTile('FAC-45', 'Mentions légales sur le PDF', 'attend FAC-38')}${kTile('FAC-46', 'Import des clients Sage', '—')}${kTile('FAC-47', 'Factures en anglais', '—')}</div></div>`, 'kb')}</div>`);
C.notification = () => shell(`<div class="lock"><div class="date">jeudi 20 novembre</div><div class="clock">14:36</div>
  <div class="notifs"><div class="ngrp">${plq('travail')}Travail</div>
    <div class="nt stackbehind"><span class="ap">${logo}</span><div class="hd"><b>Escouade · Travail</b><span class="sp">maintenant</span></div><div class="tt">tests-e2e attend une autorisation</div><div class="bd">et migration-sql une réponse · 2 agents arrêtés</div></div>
    <div class="ngrp" style="margin-top:10px">${plq('poste')}Ce poste</div>
    <div class="nt"><span class="ap">${logo}</span><div class="hd"><b>Escouade · Ce poste</b><span class="sp">il y a 30 min</span></div><div class="tt">2 demandes t’attendent dans À toi</div><div class="bd">Un choix de design-tableau, un feu vert de chef-atlas.</div></div></div>
  <div class="foot"><span>${ic('sound', 22)}</span><span>${ic('camera', 22)}</span></div></div>`, { lock: true });
C.appairage = () => shell(`<div class="c-top"><div><div class="t">Ton premier espace</div><div class="s">Un espace par machine : ton poste, un serveur</div></div></div>
  <div class="cam" style="height:44%;margin:6px 10px 0;border-radius:20px;flex:none"><div class="desk"><div class="side"></div><div class="main"><div class="lines"><i></i><i></i><i></i><i></i></div><div class="qr">${qrSvg()}</div></div></div><div class="frame"><i></i><i></i><i></i><i></i></div><div class="found">${ic('check-c')}Ce poste trouvé</div></div>
  <div class="wallet" style="padding-top:14px">
    <div class="sc front" style="border-radius:22px;flex:none;animation:none"><div class="st">${plq('poste', true)}<div class="nm">Ce poste<small>DESKTOP-7QK2 · Escouade 2.3.2 · WireGuard</small></div><span class="sp pill t">${ic('plus')}Nouveau</span></div>
      <div class="body" style="padding-bottom:12px"><span class="lab">Le nom de ce téléphone, vu du poste</span><div class="field f">${PHONE}<span class="caret"></span></div>
      <div class="fine">Clé et jeton dans ${IOS ? 'le trousseau de l’iPhone' : 'le Keystore d’Android'} ; révocable depuis le poste.</div><span class="btn pri">Ajouter l’espace</span></div></div>
    <div class="slot" style="margin-top:10px">${ic('plus')}&nbsp;Un serveur ensuite</div></div>`);

/* ═════════ Communs ═════════ */
const X = {};
X.verrou = () => shell(`${convNav({ space: true })}<div class="conv">${convMessages(`<div class="perm"><div class="h">${ic('shield')}Autorisation · l’agent s’est arrêté</div>${cmdBlock()}<div class="acts"><span class="btn grow">Refuser</span><span class="btn pri grow">Autoriser</span></div></div>`)}</div>${composer()}`,
  { over: `<div class="scrim"></div><div class="bio"><div class="ttl">Autoriser la commande de <span style="white-space:nowrap">tests-e2e&nbsp;?</span></div><div class="sub">Escouade · Travail · facturation</div><div class="fp">${ic('finger')}</div><div class="fine">Touche le capteur d’empreinte</div>
    <div class="row3"><span class="btn ghost sm">Utiliser le code</span><span class="btn ghost sm">Annuler</span></div><span class="face">${ic('face')}</span><span class="face">Face ID</span></div>` });
X.horsligne = () => shell(`${convNav({ space: true })}<div class="lost">${ic('offline')}<b>Travail injoignable depuis 14:32</b><span>Nouvel essai dans 4 s. Les agents continuent sur le serveur ; ce que tu vois date de 14:32.</span></div>
  <div class="conv" style="opacity:.62">${convMessages(`<div class="perm"><div class="h">${ic('shield')}Autorisation · l’agent s’est arrêté</div>${cmdBlock()}<div class="acts"><span class="btn grow" disabled>Refuser</span><span class="btn pri grow" disabled>Autoriser</span></div><div class="fine">Répondre attend la connexion : une réponse ne part jamais sur un écran périmé.</div></div>`)}</div>
  <div class="fine" style="padding:0 18px 6px">Envoi suspendu jusqu’à la reprise ; ton brouillon est gardé.</div>${composer({ typed: 'et relance seulement les avoirs si ça casse', off: true })}`);
X.revoque = () => shell(`<div class="nav"><span class="ib">${ic('chev-l', 22)}</span>${plq('travail')}<div class="t" style="margin-left:6px">Travail</div></div>
  <div class="center"><span class="ico">${ic('revoke')}</span><h1>Ce téléphone n’est plus appairé à Travail</h1>
    <p>Révoqué le 20 novembre à 14:40, depuis DESKTOP-7QK2. Sa clé et son jeton ont été effacés de ce téléphone.</p>
    <p class="fine" style="font-size:14px">Les agents de Travail continuent. Tes autres espaces ne changent pas : Ce poste et Perso restent appairés.</p></div>
  <div style="padding:0 var(--gut) 10px;display:grid;gap:8px"><span class="btn pri">${ic('qr')}Appairer de nouveau</span><span class="btn">Retirer Travail de ce téléphone</span></div>`);

const DIRS = { a: A, b: B, c: C, x: X };
const view = (DIRS[D] || A)[ROUTE];
document.getElementById('root').innerHTML = view ? view() : '';
</script>
</body>
</html>
