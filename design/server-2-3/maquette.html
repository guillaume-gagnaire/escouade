<!doctype html>
<!--
  ESC-516 : le mode serveur (MS-2), trois directions. Maquette statique, rien n'est branché.
  ?d=a|b|c, &theme=light, puis #un (un seul espace, et où l'on trouve « Se connecter à un serveur »), #deux (deux espaces,
  sur ce poste), #trois (trois espaces, sur Travail), #serveur (la barre de titre et un terminal sur un serveur),
  #coupure (le tunnel tombé, la reprise), #connexion (le premier appairage), #erreur (le serveur injoignable),
  #projet (« Nouveau projet » sur un serveur) ou #appareils (les réglages des appareils).
  ?d=x#hote, #etats, #version, #jeton, #fichier, #compte, #notifs : communs aux trois (la navigation entre espaces y est
  masquée, seule la machine de la barre de titre, commune, reste).
  La page prend la taille de la fenêtre du navigateur : 1440 × 900 ou 1024 × 728.
  Jetons, polices et icônes de l'app (src/app.css, src/lib/icons.ts) ; données fictives (espaces « Ce poste », « Travail »
  et « Perso », projets, agents et machines inventés). Captures : node design/server-2-3/render.mjs
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>ESC-516 · le mode serveur</title>
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/opsz.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/400.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/500.css" />
<script src="icons.js"></script>
<style>
  /* Les jetons de src/app.css (sombre, puis clair). Teint du projet ouvert : --p, posé par la page. */
  :root {
    --p: oklch(0.72 0.12 250);
    --frame: color-mix(in oklch, var(--p) 8%, #08090a);
    --panel: color-mix(in oklch, var(--p) 4.5%, #0e0f11);
    --raise: color-mix(in oklch, var(--p) 6%, #15161a);
    --raise-2: color-mix(in oklch, var(--p) 6%, #1b1c20);
    --well: color-mix(in oklch, var(--p) 2%, #0a0b0d);
    --col: #050607;
    --fg-rgb: 255, 255, 255;
    --line: rgba(255, 255, 255, 0.075);
    --line-2: rgba(255, 255, 255, 0.12);
    --line-3: rgba(255, 255, 255, 0.2);
    --hover: rgba(255, 255, 255, 0.045);
    --text: #f7f8f8;
    --soft: #d0d3d8;
    --muted: #989da6;
    --dim: #8f949e;
    --text-ai: #e9ebee;
    --brand: #35c1bd;
    --teal-ink: oklch(0.86 0.08 190);
    --run: oklch(0.79 0.15 155);
    --wait: oklch(0.84 0.14 82);
    --wait-bg: oklch(from var(--wait) l c h / 0.07);
    --wait-line: oklch(from var(--wait) l c h / 0.32);
    --del: oklch(0.74 0.14 22);
    --del-bg: oklch(from var(--del) l c h / 0.08);
    --del-line: oklch(from var(--del) l c h / 0.36);
    --idle: #7a7f88;
    --primary: #f2f3f4;
    --on-primary: #08090a;
    --code-fg: #d5d8dd;
    --term: #0b0c0e;
    --scrim: rgba(3, 4, 5, 0.66);
    --shadow-float: 0 24px 64px -12px rgba(0, 0, 0, 0.75);
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --side: 276px;
    color-scheme: dark;
  }
  :root[data-theme='light'] {
    --frame: color-mix(in oklch, var(--p) 7%, #f0f1f3);
    --panel: color-mix(in oklch, var(--p) 2.5%, #fdfdfd);
    --raise: color-mix(in oklch, var(--p) 4%, #f4f5f7);
    --raise-2: color-mix(in oklch, var(--p) 5%, #eceef1);
    --well: color-mix(in oklch, var(--p) 2.5%, #f6f7f9);
    --col: #dcdee2;
    --fg-rgb: 15, 17, 22;
    --line: rgba(15, 17, 22, 0.09);
    --line-2: rgba(15, 17, 22, 0.14);
    --line-3: rgba(15, 17, 22, 0.24);
    --hover: rgba(15, 17, 22, 0.045);
    --text: #15171c;
    --soft: #363a42;
    --muted: #555a63;
    --dim: #5c616a;
    --text-ai: #1d2026;
    --brand: oklch(0.52 0.09 190);
    --teal-ink: oklch(0.47 0.08 190);
    --run: oklch(0.48 0.13 155);
    --wait: oklch(0.5 0.11 70);
    --wait-bg: oklch(from var(--wait) l c h / 0.09);
    --wait-line: oklch(from var(--wait) l c h / 0.4);
    --del: oklch(0.5 0.18 25);
    --del-bg: oklch(from var(--del) l c h / 0.07);
    --del-line: oklch(from var(--del) l c h / 0.4);
    --primary: #1b1d22;
    --on-primary: #f7f8f8;
    --code-fg: #24272e;
    --term: #fbfbfc;
    --scrim: rgba(24, 26, 32, 0.34);
    --shadow-float: 0 24px 64px -12px rgba(15, 17, 22, 0.28);
    color-scheme: light;
  }
  @media (max-width: 1100px) { :root { --side: 236px; } }
  * { box-sizing: border-box; }
  html { background: var(--frame); }
  body { margin: 0; font: 13px/1.45 'Inter Variable', Inter, 'Segoe UI', system-ui, sans-serif; font-feature-settings: 'cv11', 'ss03';
    font-variant-ligatures: none; color: var(--text); -webkit-font-smoothing: antialiased; overflow: hidden; background: var(--frame); }
  ::selection { background: oklch(from var(--brand) l c h / 0.32); }
  p { margin: 0; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
  svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--mono); font-size: 0.92em; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sp { margin-left: auto; }
  .tn { font-variant-numeric: tabular-nums; }
  @media (max-width: 1100px) { .wide-only { display: none !important; } }
  @media (min-width: 1101px) { .narrow-only { display: none !important; } }

  /* ───────── La fenêtre ───────── */
  .win { width: 100vw; height: 100vh; display: grid; grid-template-columns: 52px var(--side) minmax(0, 1fr); grid-template-rows: 44px minmax(0, 1fr) 30px;
    background: var(--frame); overflow: hidden; position: relative; }
  .win.view { grid-template-columns: 52px minmax(0, 1fr); }
  .win.col { grid-template-columns: 64px 52px var(--side) minmax(0, 1fr); }
  .win.col.view { grid-template-columns: 64px 52px minmax(0, 1fr); }
  .tb { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 0 0 14px; color: var(--muted); min-width: 0; }
  .tb .logo { width: 22px; height: 22px; border-radius: 6px; background: #35c1bd; display: grid; place-items: center; color: #08090a; flex: none; }
  .tb .logo.btn-logo { width: 30px; height: 30px; margin: 0 -4px; border-radius: 8px; background: none; }
  .tb .logo.btn-logo i { width: 22px; height: 22px; border-radius: 6px; background: #35c1bd; display: grid; place-items: center; }
  .tb .logo.btn-logo.open { background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line-2); }
  .tb .lefts { display: flex; align-items: center; gap: 6px; min-width: 0; margin-left: 10px; flex: 0 1 auto; }
  .tb .proj { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; white-space: nowrap; height: 30px; padding: 0 8px; border-radius: 8px; min-width: 0; }
  .tb .proj .sq { width: 8px; height: 8px; border-radius: 2.5px; background: var(--p); flex: none; }
  .tb .slash { color: var(--line-3); font-size: 16px; font-weight: 300; margin: 0 -2px; }
  .tb .search { margin: 0 auto; height: 30px; border-radius: 8px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line);
    display: flex; align-items: center; gap: 8px; padding: 0 6px 0 11px; flex: 0 1 340px; min-width: 120px; }
  .tb .search kbd { margin-left: auto; }
  .tb .ed { display: inline-flex; gap: 7px; align-items: center; color: var(--soft); white-space: nowrap; }
  .tb .wb { display: flex; }
  .tb .wbtn { width: 46px; height: 44px; display: grid; place-items: center; color: var(--muted); }
  kbd { font: 500 11px/1 'Inter Variable', Inter, sans-serif; padding: 3px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--muted); white-space: nowrap; }

  /* La machine, dans la barre de titre : commune aux trois (B et C la disent, A en fait le bouton de l'aiguillage). */
  .mach { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px 0 4px; border-radius: 8px; white-space: nowrap; flex: none;
    color: var(--text); font-weight: 600; background: rgba(var(--fg-rgb), 0.06); box-shadow: inset 0 0 0 1px var(--line-2); }
  .mach.local { background: none; box-shadow: none; color: var(--soft); font-weight: 550; padding-left: 2px; }
  .mach .host { color: var(--muted); font-weight: 500; font-size: 12px; }
  .mach.crumb { height: 30px; padding: 0 8px 0 4px; }
  .mach.crumb.local { box-shadow: inset 0 0 0 1px var(--line); }
  .mach .else { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--wait-bg);
    box-shadow: inset 0 0 0 1px var(--wait-line); color: var(--wait); font-size: 11px; font-weight: 700; }
  .mach.lost { color: var(--wait); box-shadow: inset 0 0 0 1px var(--wait-line); background: var(--wait-bg); }
  .mach.open { background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line-3); }

  /* Une plaque d'espace : neutre (la couleur reste aux projets), un écran pour ce poste, une lettre pour un serveur. */
  .plate { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; position: relative;
    background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text); font-weight: 720; font-size: 14px; letter-spacing: -0.01em; }
  .plate.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 11px; }
  .plate.lg { width: 56px; height: 56px; border-radius: 15px; font-size: 22px; }
  .plate .badge, .tile .badge { position: absolute; top: -5px; right: -7px; }
  .plate.lost { box-shadow: inset 0 0 0 1.5px var(--wait); color: var(--wait); }
  .badge { min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 10.5px; font-weight: 700; display: grid; place-items: center;
    background: var(--wait); color: #1a1405; box-shadow: 0 0 0 2px var(--frame); font-variant-numeric: tabular-nums; }
  :root[data-theme='light'] .badge { color: #fff; }
  .badge.icon { padding: 0; width: 18px; }

  .rail { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 8px; min-height: 0; }
  .rail .low { margin-top: auto; display: grid; gap: 6px; }
  .rail .r-i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); position: relative; flex: none; }
  .rail .r-i.on { color: var(--text); background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }
  .rail .r-i .badge { position: absolute; top: -4px; right: -6px; }
  .tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #101114; position: relative; flex: none; }
  .tile.cur { box-shadow: 0 0 0 2px var(--frame), 0 0 0 3.5px var(--p); }
  .tile .wd { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--wait); box-shadow: 0 0 0 2px var(--frame); }
  .rail .sep { width: 22px; height: 1px; background: var(--line-2); flex: none; }
  .side { min-width: 0; padding: 4px 10px 10px 10px; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .stabs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); flex: none; }
  .stabs span { flex: 1 1 auto; padding: 0 4px; display: inline-flex; justify-content: center; align-items: center; gap: 4px; height: 26px; border-radius: 7px; color: var(--muted);
    font-weight: 550; font-size: 12px; white-space: nowrap; min-width: 0; }
  .stabs span.on { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(0, 0, 0, 0.18); }
  .stabs .c { color: var(--dim); font-size: 11.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .new { display: flex; align-items: center; gap: 8px; height: 32px; margin: 8px 0 4px; padding: 0 8px 0 9px; color: var(--soft); font-weight: 550; flex: none; }
  .new .plus { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: rgba(var(--fg-rgb), 0.07); box-shadow: inset 0 0 0 1px var(--line); }
  .new kbd { margin-left: auto; }
  .agent { border-radius: 11px; padding: 10px 12px; display: grid; gap: 3px; font-size: 12.5px; flex: none; }
  .agent.on { background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }
  .agent.wt { background: var(--wait-bg); box-shadow: inset 0 0 0 1px var(--wait-line); }
  .agent .r { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .agent .n { font-weight: 620; }
  .agent .key { color: var(--muted); font-size: 11.5px; font-weight: 550; white-space: nowrap; }
  .agent .m { color: var(--muted); font-size: 12px; }
  .agent.wt .m { color: var(--wait); }
  .ring { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.6px var(--run); flex: none; }
  .ring.wt { box-shadow: inset 0 0 0 1.6px var(--wait), 0 0 0 3px oklch(from var(--wait) l c h / 0.18); }
  .ring.idle { box-shadow: inset 0 0 0 1.6px var(--idle); }
  .side .foot { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 6px 0; display: grid; gap: 8px; color: var(--muted); font-size: 12px; flex: none; }
  .side .foot .r { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .side .foot .on-srv { color: var(--soft); font-weight: 600; white-space: nowrap; }
  .main { min-width: 0; min-height: 0; background: var(--panel); border-radius: 12px 0 0 0; box-shadow: inset 0 0 0 1px var(--line); display: flex;
    flex-direction: column; overflow: hidden; position: relative; }
  .status { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 14px; color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 0; position: relative; }
  .status b { color: var(--text); font-weight: 600; }
  .status .link { display: inline-flex; align-items: center; gap: 6px; color: var(--soft); }
  .status .link.lost { color: var(--wait); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--idle); flex: none; }
  .dot.ok { background: var(--run); } .dot.wt { background: var(--wait); } .dot.err { background: var(--del); }
  .pdot { width: 8px; height: 8px; border-radius: 2.5px; flex: none; display: inline-block; }

  /* ───────── Commun ───────── */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2);
    color: var(--text); font-weight: 550; font-size: 12.5px; white-space: nowrap; background: rgba(var(--fg-rgb), 0.04); flex: none; }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
  .btn.lg { height: 34px; padding: 0 14px; font-size: 13px; }
  .btn.quiet { box-shadow: none; background: none; color: var(--muted); }
  .btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .btn.primary kbd { color: inherit; box-shadow: inset 0 0 0 1px oklch(from var(--on-primary) l c h / 0.3); }
  .btn.danger { color: var(--del); }
  .btn.dis { opacity: 0.45; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
    white-space: nowrap; flex: none; color: var(--soft); box-shadow: inset 0 0 0 1px var(--line-2); }
  .pill.wt { color: var(--wait); box-shadow: inset 0 0 0 1px var(--wait-line); background: var(--wait-bg); }
  .pill.ok { color: var(--run); box-shadow: inset 0 0 0 1px oklch(from var(--run) l c h / 0.4); background: oklch(from var(--run) l c h / 0.07); }
  .pill.err { color: var(--del); box-shadow: inset 0 0 0 1px var(--del-line); background: var(--del-bg); }
  .pill.k { color: var(--muted); font-weight: 550; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: rgba(var(--fg-rgb), 0.035); box-shadow: inset 0 0 0 1px var(--line); flex: none; }
  .seg span { height: 26px; padding: 0 10px; border-radius: 7px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; font-weight: 550; white-space: nowrap; }
  .seg span.on { background: var(--raise-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
  .seg .c { color: var(--dim); font-variant-numeric: tabular-nums; }
  .field { height: 32px; border-radius: 7px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-2); display: flex; align-items: center; gap: 8px;
    padding: 0 8px 0 10px; color: var(--muted); font-size: 12.5px; min-width: 0; }
  .field.filled { color: var(--text); }
  .field.focus { box-shadow: inset 0 0 0 1px var(--brand), 0 0 0 3px oklch(from var(--brand) l c h / 0.18); }
  .field .ell { flex: 1; }
  .lbl { font-size: 12px; font-weight: 600; color: var(--soft); }
  .hint { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 11.5px; }
  .code { font-family: var(--mono); font-size: 12px; color: var(--code-fg); background: var(--well); box-shadow: inset 0 0 0 1px var(--line); border-radius: 8px;
    padding: 9px 12px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .code .e { color: var(--del); }
  .code .d { color: var(--muted); }
  .menu { position: absolute; z-index: 25; min-width: 260px; border-radius: 10px; background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-float); padding: 5px; display: grid; gap: 1px; }
  .menu .mi { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 9px; border-radius: 7px; color: var(--soft); font-size: 12.5px; white-space: nowrap; }
  .menu .mi.on { background: rgba(var(--fg-rgb), 0.07); color: var(--text); }
  .menu .mi kbd { margin-left: auto; }
  .menu .mh { padding: 8px 9px 6px; display: flex; gap: 9px; align-items: center; }
  .menu .mh b { font-weight: 620; display: block; }
  .menu .mh span { color: var(--muted); font-size: 11.5px; }
  .menu hr { border: 0; height: 1px; background: var(--line); margin: 4px 2px; }
  .tip { position: absolute; z-index: 25; border-radius: 8px; background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-float); padding: 7px 10px;
    font-size: 12px; color: var(--soft); white-space: nowrap; display: flex; gap: 8px; align-items: center; }
  .tip b { color: var(--text); font-weight: 620; }
  .modal-wrap { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 30; padding: 24px; }
  .focusring { box-shadow: 0 0 0 2px var(--frame), 0 0 0 3.5px var(--brand) !important; }

  /* ── La conversation ── */
  .chead { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); min-width: 0; flex: none; }
  .chead b { font-weight: 640; }
  .chead .meta { color: var(--muted); font-size: 12px; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; min-width: 0; }
  .conv { flex: 1; min-height: 0; overflow: hidden; padding: 20px 28px 0; }
  .conv .col2 { width: min(720px, 100%); margin: 0 auto; display: grid; gap: 14px; }
  .bubble-me { justify-self: end; max-width: 82%; padding: 9px 13px; border-radius: 12px 12px 4px 12px; background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line); }
  .ai { color: var(--text-ai); line-height: 1.6; display: grid; gap: 8px; }
  .tool { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; min-width: 0; }
  .tool b { color: var(--soft); font-weight: 600; }
  .perm { border-radius: 12px; background: var(--wait-bg); box-shadow: inset 0 0 0 1px var(--wait-line); padding: 12px 14px; display: grid; gap: 10px; }
  .perm .h { display: flex; align-items: center; gap: 8px; color: var(--wait); font-weight: 620; font-size: 12.5px; }
  .perm .acts { display: flex; gap: 8px; align-items: center; }
  .composer { width: min(744px, calc(100% - 48px)); margin: 12px auto 14px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); padding: 10px 12px; display: grid; gap: 10px; flex: none; }
  .composer .row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .composer .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--soft); white-space: nowrap; }
  .composer .send { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
  .composer.off { opacity: 0.7; }
  .composer.off .send { background: var(--line-2); color: var(--muted); }
  .fcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 12px 14px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); align-items: center; }
  .fcard .ic { grid-row: span 2; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--well); box-shadow: inset 0 0 0 1px var(--line); color: var(--soft); }
  .fcard .t { display: flex; gap: 8px; align-items: center; min-width: 0; font-weight: 600; }
  .fcard .s { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; min-width: 0; flex-wrap: wrap; }
  .fcard .acts { grid-column: 2; display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

  /* ── Le bandeau de la connexion perdue ── */
  .lostbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 18px; background: var(--wait-bg); box-shadow: inset 0 -1px 0 var(--wait-line); flex: none; min-width: 0; }
  .lostbar .t { display: grid; gap: 1px; min-width: 0; }
  .lostbar .t b { color: var(--wait); font-weight: 640; font-size: 13px; }
  .lostbar .t span { color: var(--soft); font-size: 12.5px; }
  .stale { opacity: 0.55; filter: saturate(0.6); }

  /* ── Le terminal ── */
  .term { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 12px; border-radius: 10px; background: var(--term); box-shadow: inset 0 0 0 1px var(--line-2); overflow: hidden; }
  .term .th { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; height: 38px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--soft); flex: none; min-width: 0; }
  .term .th .tabn { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
  .term .tbody { padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; color: var(--code-fg); white-space: pre; overflow: hidden; }
  .term .pr { color: var(--run); }
  .term .pa { color: oklch(0.72 0.12 250); }
  :root[data-theme='light'] .term .pa { color: oklch(0.48 0.13 250); }
  .term .dm { color: var(--muted); }

  /* ── Dialogues et pages de la connexion ── */
  .dialog { width: min(760px, 100%); max-height: 100%; background: var(--panel); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-float);
    display: grid; grid-template-columns: 220px minmax(0, 1fr); overflow: hidden; }
  .dialog.one { grid-template-columns: minmax(0, 1fr); width: min(560px, 100%); }
  .steps { border-right: 1px solid var(--line); padding: 18px 12px; display: grid; align-content: start; gap: 2px; background: rgba(var(--fg-rgb), 0.015); }
  .steps h2 { font-size: 15px; font-weight: 640; padding: 0 8px 12px; }
  .step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 9px; padding: 8px; border-radius: 9px; align-items: center; }
  .step .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-3); }
  .step b { font-weight: 600; font-size: 12.5px; color: var(--muted); }
  .step .s { grid-column: 2; font-size: 11.5px; color: var(--dim); }
  .step.done .n { background: oklch(from var(--run) l c h / 0.14); color: var(--run); box-shadow: none; }
  .step.done b { color: var(--soft); }
  .step.cur { background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }
  .step.cur .n { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .step.cur b { color: var(--text); }
  .step.bad .n { background: var(--del-bg); color: var(--del); box-shadow: inset 0 0 0 1px var(--del-line); }
  .step.bad b { color: var(--del); }
  .cbody { padding: 22px 24px 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
  .cbody h3 { font-size: 16px; font-weight: 640; letter-spacing: -0.01em; display: flex; gap: 10px; align-items: center; }
  .cbody > p { color: var(--soft); line-height: 1.55; max-width: 62ch; }
  .cbody .acts { display: flex; gap: 8px; align-items: center; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 14px; }
  .instr { display: grid; gap: 8px; padding: 12px 14px; border-radius: 10px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); }
  .instr .r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .instr .k { color: var(--soft); font-weight: 600; font-size: 12.5px; }
  .cmd { display: inline-flex; align-items: center; gap: 10px; height: 30px; padding: 0 6px 0 10px; border-radius: 7px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-2);
    font-family: var(--mono); font-size: 12.5px; color: var(--code-fg); white-space: nowrap; }
  .pin { display: flex; gap: 6px; align-items: center; }
  .pin span { width: 34px; height: 40px; border-radius: 8px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line-2); display: grid; place-items: center;
    font-family: var(--mono); font-size: 18px; font-weight: 500; color: var(--text); }
  .pin span.cur { box-shadow: inset 0 0 0 1px var(--brand), 0 0 0 3px oklch(from var(--brand) l c h / 0.18); }
  .pin i { width: 10px; height: 2px; background: var(--line-3); border-radius: 1px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid2 > div { display: grid; gap: 6px; min-width: 0; }
  .why { display: grid; gap: 6px; color: var(--soft); font-size: 12.5px; padding-left: 2px; }
  .why div { display: flex; gap: 8px; align-items: baseline; }
  .why div::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--dim); flex: none; transform: translateY(-2px); }
  .hostrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 9px 10px; border-radius: 9px; }
  .hostrow.on { background: var(--raise); box-shadow: inset 0 0 0 1px var(--brand); }
  .hostrow .s { grid-column: 2; color: var(--muted); font-size: 12px; }
  .radio { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-3); }
  .radio.on { box-shadow: inset 0 0 0 5px var(--brand); }

  /* ── Réglages ── */
  .settings { width: min(1000px, 100%); height: min(700px, 100%); background: var(--panel); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-float);
    display: grid; grid-template-columns: 236px minmax(0, 1fr); overflow: hidden; }
  @media (max-width: 1100px) { .settings { grid-template-columns: 206px minmax(0, 1fr); } }
  .settings nav { border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 1px; min-height: 0; overflow: hidden; }
  .settings nav .g { color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 12px 10px 5px; display: flex; gap: 7px; align-items: center; white-space: nowrap; }
  .settings nav .it { display: flex; align-items: center; gap: 9px; padding: 0 10px; height: 29px; border-radius: 8px; color: var(--soft); font-size: 12.5px; font-weight: 550; white-space: nowrap; flex: none; }
  .settings nav .it.on { background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
  .settings nav .it .i { color: var(--muted); }
  .settings nav .scope { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 9px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); flex: none; }
  .settings nav .scope b { font-weight: 620; display: block; }
  .settings nav .scope span { color: var(--muted); font-size: 11.5px; }
  .settings nav .foot { margin-top: auto; color: var(--muted); font-size: 11.5px; line-height: 1.45; padding: 10px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .settings .sb { padding: 20px 28px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; min-height: 0; }
  .settings .shead { display: flex; align-items: flex-start; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .settings h2 { font-size: 17px; font-weight: 640; }
  .settings .shead p { color: var(--muted); font-size: 12.5px; margin-top: 3px; max-width: 70ch; }
  .settings h3 { font-size: 13px; color: var(--text); font-weight: 640; margin: 14px 0 2px; }
  .srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 20px; padding: 11px 0; border-top: 1px solid rgba(var(--fg-rgb), 0.05); align-items: center; }
  .srow:first-of-type { border-top: 0; }
  .srow b { font-weight: 600; font-size: 13px; }
  .srow .d { grid-column: 1; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .srow .acts { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; align-items: center; }
  .srow.lock .d .lk { display: inline-flex; gap: 5px; align-items: center; color: var(--soft); font-weight: 550; }
  .dev { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 0; border-top: 1px solid rgba(var(--fg-rgb), 0.05); align-items: center; }
  .dev .ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); color: var(--soft); }
  .dev .t { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .dev .t b { font-weight: 620; }
  .dev .s { color: var(--muted); font-size: 12px; grid-column: 2; min-width: 0; }
  .dev .acts { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 8px; }
  .switch { width: 34px; height: 20px; border-radius: 10px; background: var(--line-3); position: relative; flex: none; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .switch.on { background: var(--brand); }
  .switch.on::after { left: 17px; }
  .switch.lockd { opacity: 0.5; }

  /* ───────── A · L'aiguillage ───────── */
  .switcher { position: absolute; z-index: 26; top: 42px; left: 52px; width: min(820px, calc(100vw - 104px)); border-radius: 14px; background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-float); overflow: hidden; display: grid; }
  .switcher .sh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .switcher .sh b { font-weight: 640; font-size: 13.5px; }
  .lane { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
  .lane.cur { background: rgba(var(--fg-rgb), 0.035); }
  .lane.sel { background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-3); }
  .lane .nm { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .lane .nm b { font-size: 14px; font-weight: 650; }
  .lane .st { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 0; }
  .lane .tiles { display: flex; gap: 5px; align-items: center; }
  .lane .tiles i { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 700 8.5px/1 Inter, sans-serif; color: #101114; font-style: normal; }
  .lane .waits { grid-column: 2 / -1; display: grid; gap: 4px; margin-top: 4px; }
  .lane .w { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--soft); }
  .lane .w .k { color: var(--wait); font-weight: 600; white-space: nowrap; }
  .lane .right { display: flex; gap: 8px; align-items: center; }
  .switcher .sf { display: flex; gap: 8px; align-items: center; padding: 10px 12px; flex-wrap: wrap; }
  .switcher .sf .hint { margin-left: auto; }

  /* ───────── B · Les piles ───────── */
  .rail .shead-b { display: grid; justify-items: center; gap: 3px; flex: none; }
  .rail .lab { font-size: 10px; font-weight: 650; color: var(--soft); letter-spacing: 0.01em; line-height: 1; white-space: nowrap; max-width: 50px; overflow: hidden; text-overflow: ellipsis; }
  .rail .lab.lost { color: var(--wait); }
  .pile { width: 36px; height: 36px; position: relative; flex: none; }
  .pile i { position: absolute; width: 26px; height: 26px; border-radius: 7px; box-shadow: 0 0 0 1.5px var(--frame); }
  .pile i:nth-child(1) { left: 0; top: 0; }
  .pile i:nth-child(2) { left: 5px; top: 5px; }
  .pile i:nth-child(3) { left: 10px; top: 10px; }
  .pile .badge { position: absolute; top: -5px; right: -7px; }
  .pile .mon { position: absolute; left: 10px; top: 10px; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--raise-2);
    box-shadow: 0 0 0 1.5px var(--frame), inset 0 0 0 1px var(--line-2); color: var(--text); font: 700 11px/1 Inter, sans-serif; }
  .rail .group { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: none; }
  .ov { flex: 1; min-height: 0; overflow: hidden; padding: 18px 24px; display: grid; gap: 14px; align-content: start; }
  .ov .oh { display: flex; align-items: center; gap: 12px; }
  .ov .oh h2 { font-size: 17px; font-weight: 640; }
  .ovs { display: grid; gap: 8px; }
  .ovs .sh { display: flex; align-items: center; gap: 9px; padding: 4px 2px; }
  .ovs .sh b { font-weight: 640; }
  .ovs .sh .c { color: var(--muted); font-size: 12px; }
  .orow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 14px; padding: 10px 14px; border-radius: 11px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); align-items: center; }
  .orow.wt { background: var(--wait-bg); box-shadow: inset 0 0 0 1px var(--wait-line); }
  .orow .t { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; }
  .orow .t b { font-weight: 620; }
  .orow .m { color: var(--muted); font-size: 12px; }
  .orow.wt .m { color: var(--wait); }
  .orow .acts { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; }

  /* ───────── C · La colonne ───────── */
  .spaces { grid-row: 2 / 3; grid-column: 1; background: var(--col); display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 0 8px; min-height: 0; position: relative; }
  .spaces .sp-i { position: relative; display: grid; justify-items: center; gap: 4px; padding: 6px 0 6px; margin-left: 8px; border-radius: 12px 0 0 12px; }
  .spaces .sp-i .lab { font-size: 10.5px; font-weight: 600; color: var(--muted); line-height: 1; white-space: nowrap; }
  .spaces .sp-i.cur { background: var(--frame); }
  .spaces .sp-i.cur::before, .spaces .sp-i.cur::after { content: ''; position: absolute; right: 0; width: 12px; height: 12px; background: transparent; }
  .spaces .sp-i.cur::before { top: -12px; border-bottom-right-radius: 12px; box-shadow: 4px 4px 0 4px var(--frame); }
  .spaces .sp-i.cur::after { bottom: -12px; border-top-right-radius: 12px; box-shadow: 4px -4px 0 4px var(--frame); }
  .spaces .sp-i.cur .lab { color: var(--text); }
  .spaces .sp-i.cur .plate { background: var(--raise-2); box-shadow: inset 0 0 0 1.5px var(--line-3); }
  .spaces .sp-i.cur.lost .lab { color: var(--wait); }
  .spaces .sp-i.cur.lost .plate { box-shadow: inset 0 0 0 1.5px var(--wait); color: var(--wait); }
  .spaces .low { margin-top: auto; display: grid; justify-items: center; gap: 8px; margin-right: 8px; }
  .spaces .add { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); margin-left: 8px; }
  .spaces .add.on { color: var(--text); box-shadow: inset 0 0 0 1.5px var(--brand); }
  .spaces .gear { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); margin-left: 8px; }
  .spaces .sp-i .plate { box-shadow: inset 0 0 0 1px var(--line-2); }
  .addpage { grid-column: 2 / -1; grid-row: 2; display: grid; place-items: center; padding: 20px; background: var(--frame); min-height: 0; }
  .addcard { width: min(640px, 100%); background: var(--panel); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line-2); overflow: hidden; display: grid; }
  .addcard .ah { display: flex; gap: 14px; align-items: center; padding: 18px 24px 0; }
  .addcard .ah h2 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .addcard .ah p { color: var(--muted); font-size: 12.5px; }
  .dots { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line-2); }
  .dots i.on { background: var(--text); }
  .dots i.done { background: var(--run); }
  .dots i.bad { background: var(--del); }
  .bpage { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .bpage .bh { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  .bpage .bh h2 { font-size: 16px; font-weight: 640; }
  .hsteps { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .hsteps span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 550; white-space: nowrap; }
  .hsteps span .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; box-shadow: inset 0 0 0 1px var(--line-3); }
  .hsteps span.done .n { background: oklch(from var(--run) l c h / 0.14); color: var(--run); box-shadow: none; }
  .hsteps span.cur { color: var(--text); }
  .hsteps span.cur .n { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .hsteps span.bad { color: var(--del); }
  .hsteps span.bad .n { background: var(--del-bg); color: var(--del); box-shadow: inset 0 0 0 1px var(--del-line); }
  .hsteps .ln { width: 18px; height: 1px; background: var(--line-2); }
  .bpage .bb { display: grid; place-items: start center; padding: 22px 24px; overflow: hidden; }
  .bpage .bb .cbody { width: min(640px, 100%); padding: 0; }

  /* ── Nouveau projet ── */
  .wiz { width: min(880px, 100%); height: min(640px, 100%); background: var(--panel); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-float);
    display: grid; grid-template-columns: 196px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
  .wiz .wh { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); min-width: 0; }
  .wiz .wh h2 { font-size: 16px; font-weight: 650; white-space: nowrap; }
  .wiz .wh .muted { font-size: 12.5px; white-space: nowrap; }
  .wiz .wsteps { padding: 10px; border-right: 1px solid var(--line); display: grid; align-content: start; gap: 1px; }
  .wiz .wsteps span { display: flex; gap: 9px; align-items: center; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .wiz .wsteps span i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 10.5px/1 Inter, sans-serif; box-shadow: inset 0 0 0 1px var(--line-3); font-style: normal; }
  .wiz .wsteps span.on { background: var(--raise); color: var(--text); font-weight: 600; }
  .wiz .wsteps span.on i { background: var(--p); color: #101114; box-shadow: none; }
  .wiz .wb { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
  .wiz .wf { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); }
  .wiz .wf .lnk { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 12.5px; }
  .onsrv { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; background: rgba(var(--fg-rgb), 0.04); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 12.5px; color: var(--soft); }
  .onsrv b { color: var(--text); font-weight: 620; }
  .fb { border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--well); display: flex; flex-direction: column; min-height: 0; overflow: hidden; flex: 1; }
  .fb .crumbs { display: flex; align-items: center; gap: 4px; padding: 7px 8px 7px 10px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 0; }
  .fb .crumbs b { color: var(--text); font-weight: 500; }
  .fb .rows { overflow: hidden; display: grid; align-content: start; }
  .frow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 0 12px; height: 34px; font-size: 12.5px; color: var(--soft); border-bottom: 1px solid rgba(var(--fg-rgb), 0.04); }
  .frow .n { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .frow .n b { font-weight: 560; color: var(--text); }

  .frow.sel { background: oklch(from var(--brand) l c h / 0.1); box-shadow: inset 0 0 0 1px oklch(from var(--brand) l c h / 0.5); }

};
const pc = (k) => PROJ[k].color;
const setP = (k) => document.documentElement.style.setProperty('--p', pc(k));
const srvIcon = (s) => (s.local ? ic('monitor', 14) : ic('server', 14));
function plate(s, o = {}) {

/* ───────── La fenêtre, commune ───────── */
// o.mach : null (un seul espace : rien), 'label' (B, C, et les écrans communs) ou 'crumb' (A : le bouton de l'aiguillage).
function titlebar(o) {
  const s = SP[o.space];
  let mach = '';
  if (o.mach) {
    const lost = o.lost ? 'lost' : '';
    const inner = `${plate(s, { size: 'sm' })}<span>${s.name}</span>${!s.local && !NARROW ? `<span class="host">${s.host}</span>` : ''}${o.lost ? `${ic('refresh', 12)}<span class="host" style="color:inherit">reconnexion</span>` : ''}`;

      o.mach === 'crumb'
        ? `<button class="mach crumb ${s.local ? 'local' : ''} ${lost} ${o.open ? 'open' : ''}" aria-haspopup="dialog" aria-expanded="${o.open ? 'true' : 'false'}" aria-label="Espace : ${s.name}. ${o.else || 0} demandes attendent dans les autres espaces. Changer d’espace (Ctrl+²)">${inner}${o.else ? `<span class="else" aria-hidden="true">${o.else}</span>` : ''}${ic('down', 12)}</button>`

function tiles(s, cur) {

}
// Le rail des projets. B y range les espaces : l'en-tête de l'espace ouvert, puis les autres en piles.
function rail(o) {
  const top = `<span class="r-i ${o.overview ? 'on' : ''}" aria-label="Vue d’ensemble${o.partout ? ' de tous les espaces' : ''}">${ic('overview', 15)}</span>

// Une pile : un espace replié, ses projets en cartes décalées, ce qui y attend en pastille.
function pile(id) {
  const s = SP[id];

function column(o) {
  const items = o.c.list
    .map((id) => {

}

}

}
function errorBody(o = {}) {

<span class="e">ssh: connect to host escouade.acme.internal port 22: Connection timed out</span></div>
    <div class="lbl">Ce qui peut l’expliquer</div>

    <div class="acts"><button class="btn quiet">${ic('term', 13)}Essayer ssh dans un terminal</button><span class="sp"></span><button class="btn">Modifier l’hôte</button><button class="btn primary">${ic('refresh', 13)}Réessayer</button></div></div>`;
}

/* ───────── Nouveau projet sur un serveur (commun) ───────── */
function wizard(o) {
  const s = SP[o.space];
  const rows = [
    ['folder', 'facturation', 'git · main', 'Déjà un projet', 'dim'],
