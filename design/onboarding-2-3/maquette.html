<!doctype html>
<!--
  ESC-503 : l'onboarding d'Escouade (2.3), trois directions. Maquette statique, rien n'est branché.
  ?d=a|b|c, &theme=light, puis #harness (le harness et son compte), #modes (les réglages de départ), #projet (le premier
  projet), #agent (le premier agent et sa première permission) ou #decouverte (la découverte des fonctionnalités).
  Aux deux tailles de la fenêtre : 1440 × 900 et 1024 × 728 (la page prend la taille de la fenêtre du navigateur).
  Jetons, polices et icônes de l'app (src/app.css, src/lib/icons.ts) ; données fictives (projet « atlas-web », compte
  « toi@exemple.dev »). Captures : node design/onboarding-2-3/render.mjs
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>ESC-503 · l'onboarding d'Escouade</title>
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/opsz.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/400.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/500.css" />
<script src="icons.js"></script>
<style>
  /* Les jetons de src/app.css (sombre, puis clair). Teint du projet : --p. */
  :root {
    --p: oklch(0.72 0.12 48);
    --frame: color-mix(in oklch, var(--p) 8%, #08090a);
    --panel: color-mix(in oklch, var(--p) 4.5%, #0e0f11);
    --raise: color-mix(in oklch, var(--p) 6%, #15161a);
    --raise-2: color-mix(in oklch, var(--p) 6%, #1b1c20);
    --well: color-mix(in oklch, var(--p) 2%, #0a0b0d);
    --fg-rgb: 255, 255, 255;
    --line: rgba(255, 255, 255, 0.075);
    --line-2: rgba(255, 255, 255, 0.12);
    --line-3: rgba(255, 255, 255, 0.2);
    --hover: rgba(255, 255, 255, 0.045);
    --text: #f7f8f8;
    --soft: #d0d3d8;
    --muted: #989da6;
    --dim: #8f949e;
    --text-ai: #e9ebee;
    --brand: #35c1bd;
    --teal-ink: oklch(0.86 0.08 190);
    --p-ink: color-mix(in oklch, var(--p) 70%, white);
    --p-soft: color-mix(in oklch, var(--p) 14%, transparent);
    --run: oklch(0.79 0.15 155);
    --wait: oklch(0.84 0.14 82);
    --wait-bg: oklch(from var(--wait) l c h / 0.07);
    --wait-line: oklch(from var(--wait) l c h / 0.32);
    --add: oklch(0.8 0.13 155);
    --del: oklch(0.74 0.14 22);
    --info: oklch(0.8 0.1 235);
    --brain: oklch(0.8 0.12 300);
    --warn-ink: oklch(0.8 0.1 60);
    --idle: #7a7f88;
    --primary: #f2f3f4;
    --on-primary: #08090a;
    --on-wait: #1a1405;
    --code-fg: #d5d8dd;
    --scrim: rgba(3, 4, 5, 0.62);
    --lane-main: #c8ccd2;
    --lane-1: oklch(0.72 0.12 250);
    --lane-2: oklch(0.72 0.13 340);
    --lane-3: oklch(0.72 0.12 48);
    --lane-4: oklch(0.7 0.13 155);
    --lane-5: oklch(0.74 0.12 85);
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    --shadow-tip: 0 12px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --side: 276px;
    --guide: 344px;
    --line-col: 300px;
    color-scheme: dark;
  }
  :root[data-theme='light'] {
    --frame: color-mix(in oklch, var(--p) 7%, #f0f1f3);
    --panel: color-mix(in oklch, var(--p) 2.5%, #fdfdfd);
    --raise: color-mix(in oklch, var(--p) 4%, #f4f5f7);
    --raise-2: color-mix(in oklch, var(--p) 5%, #eceef1);
    --well: color-mix(in oklch, var(--p) 2.5%, #f6f7f9);
    --fg-rgb: 15, 17, 22;
    --line: rgba(15, 17, 22, 0.09);
    --line-2: rgba(15, 17, 22, 0.14);
    --line-3: rgba(15, 17, 22, 0.24);
    --hover: rgba(15, 17, 22, 0.045);
    --text: #15171c;
    --soft: #363a42;
    --muted: #555a63;
    --dim: #5c616a;
    --text-ai: #1d2026;
    --brand: oklch(0.52 0.09 190);
    --teal-ink: oklch(0.47 0.08 190);
    --p-ink: color-mix(in oklch, var(--p) 50%, #15171c);
    --run: oklch(0.48 0.13 155);
    --wait: oklch(0.5 0.11 70);
    --wait-bg: oklch(from var(--wait) l c h / 0.09);
    --wait-line: oklch(from var(--wait) l c h / 0.4);
    --add: oklch(0.47 0.12 155);
    --del: oklch(0.5 0.18 25);
    --info: oklch(0.5 0.12 245);
    --brain: oklch(0.5 0.16 300);
    --warn-ink: oklch(0.49 0.11 55);
    --primary: #1b1d22;
    --on-primary: #f7f8f8;
    --on-wait: #fff;
    --code-fg: #24272e;
    --scrim: rgba(24, 26, 32, 0.3);
    --lane-main: #595e68;
    /* Les voies du git graph, foncées pour tenir 3:1 sur le fond clair (à reporter dans src/app.css si C est choisie). */
    --lane-1: oklch(0.55 0.13 250);
    --lane-2: oklch(0.55 0.15 340);
    --lane-3: oklch(0.58 0.13 48);
    --lane-4: oklch(0.52 0.13 155);
    --lane-5: oklch(0.58 0.12 85);
    --shadow: 0 14px 32px rgba(15, 17, 22, 0.16);
    --shadow-tip: 0 12px 28px rgba(15, 17, 22, 0.18), 0 2px 6px rgba(15, 17, 22, 0.1);
    color-scheme: light;
  }
  @media (max-width: 1100px) {
    :root { --side: 236px; --guide: 292px; --line-col: 248px; }
  }
  * { box-sizing: border-box; }
  html { background: var(--frame); }
  body { font-variant-ligatures: none; margin: 0; font: 13px/1.45 'Inter Variable', Inter, 'Segoe UI', system-ui, sans-serif; font-feature-settings: 'cv11', 'ss03';
    color: var(--text); -webkit-font-smoothing: antialiased; overflow: hidden; }
  ::selection { background: oklch(from var(--brand) l c h / 0.32); }
  p { margin: 0; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-feature-settings: 'calt' 0, 'liga' 0; font-family: var(--mono); font-size: 0.92em; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .sp { margin-left: auto; }
  .narrow-hide { }
  @media (max-width: 1100px) { .narrow-hide { display: none !important; } }

  /* ───────── La fenêtre : barre de titre, rail des projets, barre latérale, place de travail, barre d'état ───────── */
  .win { width: 100vw; height: 100vh; display: grid; grid-template-columns: 52px var(--side) minmax(0, 1fr); grid-template-rows: 44px minmax(0, 1fr) 30px;
    background: var(--frame); overflow: hidden; position: relative; }
  .win.wide { grid-template-columns: 52px minmax(0, 1fr); }
  .win.guided { grid-template-columns: 52px var(--side) minmax(0, 1fr) var(--guide); }
  .win.full { grid-template-columns: minmax(0, 1fr); }
  .tb { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 0 0 14px; font-size: 13px; color: var(--muted); min-width: 0; }
  .tb .logo { width: 22px; height: 22px; border-radius: 6px; background: #35c1bd; display: grid; place-items: center; color: #08090a; flex: none; }
  .tb .proj { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; margin-left: 18px; white-space: nowrap; }
  .tb .proj .sq { width: 8px; height: 8px; border-radius: 2.5px; background: var(--p); }
  .tb .search { margin-left: auto; margin-right: auto; width: 340px; height: 30px; border-radius: 8px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line);
    display: flex; align-items: center; gap: 8px; padding: 0 6px 0 11px; flex: 0 1 340px; min-width: 0; }
  .tb .search kbd { margin-left: auto; }
  .tb .ed { display: inline-flex; gap: 7px; align-items: center; color: var(--soft); white-space: nowrap; }
  .tb .wb { display: flex; }
  .tb .wbtn { width: 46px; height: 44px; display: grid; place-items: center; color: var(--muted); }
  kbd { font: 500 11px/1 'Inter Variable', Inter, sans-serif; padding: 3px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--muted); white-space: nowrap; }
  .rail { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 8px; } .rail .low { margin-top: auto; display: grid; gap: 6px; }
  .rail .r-i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); position: relative; }
  .rail .r-i.on { color: var(--text); background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }
  .rail .tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #101114;
    background: var(--p); box-shadow: 0 0 0 2px var(--frame), 0 0 0 3.5px var(--p); }
  .rail .tile.demo { background: repeating-linear-gradient(135deg, var(--p) 0 5px, color-mix(in oklch, var(--p) 80%, white) 5px 10px); }
  .rail .dotn { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--frame); }
  .side { min-width: 0; padding: 4px 10px 10px 10px; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .stabs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); }
  .stabs span { flex: 1 1 auto; padding: 0 4px; display: inline-flex; justify-content: center; align-items: center; gap: 5px; height: 26px; border-radius: 7px; color: var(--muted);
    font-weight: 550; font-size: 12px; white-space: nowrap; }
  .stabs span.on { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(0, 0, 0, 0.18); }
  .stabs .c { color: var(--dim); font-size: 11.5px; font-weight: 500; }
  .new { display: flex; align-items: center; gap: 8px; height: 32px; margin: 8px 0 4px; padding: 0 8px 0 9px; color: var(--soft); font-weight: 550; }
  .new .plus { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: rgba(var(--fg-rgb), 0.07); box-shadow: inset 0 0 0 1px var(--line); }
  .new kbd { margin-left: auto; }
  .agent { border-radius: 11px; padding: 10px 12px; display: grid; gap: 3px; font-size: 12.5px; }
  .agent.on { background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }
  .agent .r { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .agent .n { font-weight: 620; }
  .agent .key { color: var(--muted); font-size: 11.5px; font-weight: 550; }
  .agent .m { color: var(--muted); font-size: 12px; }
  .ring { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.6px var(--run); flex: none; }
  .ring.wt { box-shadow: inset 0 0 0 1.6px var(--wait); }
  .ring.idle { box-shadow: inset 0 0 0 1.6px var(--idle); }
  .side .foot { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 6px 0; display: grid; gap: 8px; color: var(--muted); font-size: 12px; }
  .side .foot .r { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .main { min-width: 0; min-height: 0; background: var(--panel); border-radius: 12px 0 0 0; box-shadow: inset 0 0 0 1px var(--line); display: flex;
    flex-direction: column; overflow: hidden; position: relative; }
  .win.guided .main { border-radius: 12px 12px 0 0; }
  .status { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 14px; color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 0; }
  .status b { color: var(--text); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--idle); flex: none; }
  .dot.ok { background: var(--run); } .dot.wt { background: var(--wait); }

  /* ───────── Commun : boutons, pastilles, choix, commande, conversation ───────── */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2);
    color: var(--text); font-weight: 550; font-size: 12.5px; white-space: nowrap; background: rgba(var(--fg-rgb), 0.03); flex: none; }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
  .btn.lg { height: 34px; padding: 0 14px; font-size: 13px; }
  .btn.icon { width: 30px; padding: 0; justify-content: center; color: var(--soft); }
  .btn.sm.icon { width: 26px; }
  .btn.quiet { box-shadow: none; background: none; color: var(--muted); }
  .btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .btn.go { background: oklch(from var(--run) calc(l - 0.12) c h); color: #fff; box-shadow: none; }
  :root[data-theme='light'] .btn.go { background: var(--run); }
  .btn.off { opacity: 0.45; }
  .btn:focus-visible, .focus { outline: 2px solid var(--brand); outline-offset: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
    white-space: nowrap; flex: none; color: var(--soft); box-shadow: inset 0 0 0 1px var(--line-2); }
  .pill.ok { color: var(--run); box-shadow: inset 0 0 0 1px oklch(from var(--run) l c h / 0.4); background: oklch(from var(--run) l c h / 0.07); }
  .pill.wt { color: var(--wait); box-shadow: inset 0 0 0 1px var(--wait-line); background: var(--wait-bg); }
  .pill.no { color: var(--muted); }
  .pill.rec { color: var(--teal-ink); box-shadow: inset 0 0 0 1px oklch(from var(--brand) l c h / 0.45); background: oklch(from var(--brand) l c h / 0.08); border-radius: 999px; }
  .pill.lock { color: var(--muted); }
  .cmd { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 10px; border-radius: 8px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line);
    color: var(--code-fg); font-family: var(--mono); font-size: 12px; min-width: 0; }
  .cmd > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .cmd .btn { height: 24px; }
  /* Un choix : une rangée cliquable, le bouton radio dessiné à gauche. */
  .choices { display: grid; gap: 8px; }
  .choice { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 12px 14px; border-radius: 10px;
    background: rgba(var(--fg-rgb), 0.022); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--soft); }
  .choice .rd { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-3); margin-top: 1px; }
  .choice.on { background: oklch(from var(--brand) l c h / 0.07); box-shadow: inset 0 0 0 1.5px var(--brand); }
  .choice.on .rd { box-shadow: inset 0 0 0 5px var(--brand); }
  .choice.dis { opacity: 0.62; }
  .choice .t { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .choice .t b { color: var(--text); font-weight: 620; }
  .choice .d { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .choice .x { grid-column: 2 / 4; margin-top: 6px; }
  .choice .ver { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .choice .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .choice .state.ok { color: var(--run); }
  .choice .state.wt { color: var(--wait); }
  /* La conversation de l'app, en petit. */
  .conv { flex: 1; min-height: 0; overflow: hidden; padding: 22px 28px 0; display: flex; flex-direction: column; gap: 14px; }
  .conv .col { width: min(720px, 100%); margin: 0 auto; display: grid; gap: 14px; }
  .bubble-me { justify-self: end; max-width: 82%; padding: 9px 13px; border-radius: 12px 12px 4px 12px; background: var(--raise-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); }
  .ai { color: var(--text-ai); line-height: 1.6; display: grid; gap: 8px; }
  .ai ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
  .ai code, .inl { font-family: var(--mono); font-size: 0.9em; padding: 1px 5px; border-radius: 5px; background: rgba(var(--fg-rgb), 0.06); color: var(--code-fg); }
  .tool { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .tool b { color: var(--soft); font-weight: 600; }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--brand); vertical-align: -2px; border-radius: 1px; margin-left: 2px; }
  .perm { border-radius: 12px; background: var(--wait-bg); box-shadow: inset 0 0 0 1px var(--wait-line); padding: 12px 14px; display: grid; gap: 10px; position: relative; }
  .perm .h { display: flex; align-items: center; gap: 8px; color: var(--wait); font-weight: 600; font-size: 12.5px; }
  .perm .c { font-family: var(--mono); font-size: 12px; color: var(--code-fg); padding: 8px 10px; border-radius: 8px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line); }
  .perm .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .perm .acts kbd { margin-left: 2px; }
  .composer { width: min(744px, calc(100% - 48px)); margin: 12px auto 14px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); padding: 10px 12px; display: grid; gap: 10px; position: relative; }
  .composer .w { width: 100%; }
  .composer .txt { color: var(--muted); min-height: 20px; }
  .composer .txt.filled { color: var(--text); }
  .composer .row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; min-width: 0; }
  .composer .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--soft); white-space: nowrap; }
  .composer .send { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
  .composer .mic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--soft); position: relative; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; }
  .starter { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 9px; background: rgba(var(--fg-rgb), 0.03); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--soft); font-size: 12.5px; }
  .starter.on { box-shadow: inset 0 0 0 1.5px var(--brand); color: var(--text); background: oklch(from var(--brand) l c h / 0.07); }
  .chead { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); min-width: 0; }
  .chead b { font-weight: 640; }
  .chead .meta { color: var(--muted); font-size: 12px; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; min-width: 0; }

  /* ═════════ A « Essaie d'abord » : un bac à sable, le guide en colonne, chaque réglage quand il sert ═════════ */
  .guide { grid-row: 2; grid-column: 4; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); box-shadow: inset 1px 0 0 var(--line), inset 0 1px 0 var(--line);
    margin-left: 8px; border-radius: 12px 0 0 0; overflow: hidden; }
  .guide .gh { display: flex; align-items: center; gap: 8px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .guide .gh b { font-weight: 640; font-size: 13.5px; }
  .guide .gh .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .guide .meter { height: 3px; border-radius: 2px; background: var(--line-2); margin: 0 16px; overflow: hidden; }
  .guide .meter i { display: block; height: 100%; background: var(--brand); border-radius: 2px; }
  .guide .gb { flex: 1; min-height: 0; overflow: hidden; padding: 12px 10px 8px; display: grid; align-content: start; gap: 2px; }
  .gstep { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 2px 10px; padding: 9px 8px; border-radius: 9px; color: var(--muted); }
  .gstep .k { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--line-3); font-size: 10.5px; font-weight: 650; color: var(--muted); margin-top: 1px; }
  .gstep.done .k { background: var(--brand); box-shadow: none; color: #08090a; }
  .gstep.done .lbl { color: var(--soft); }
  .gstep .lbl { font-weight: 600; font-size: 12.5px; }
  .gstep .s { grid-column: 2; font-size: 12px; color: var(--muted); }
  .gstep.cur { background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--soft); padding: 12px 12px 10px 8px; }
  .gstep.cur .k { box-shadow: inset 0 0 0 1.5px var(--brand); color: var(--teal-ink); }
  .gstep.cur .lbl { color: var(--text); font-size: 13px; }

  },
};
const B_TARGET = { agent: ['#perm', 'right'], decouverte: ['#mic', 'above'] };

/* ═════════════════════ C « La ligne » ═════════════════════ */
const C_STATIONS = [
  ['Harness', 'Claude Code'],
  ['Compte', 'celui de la machine'],
  ['Réglages de départ', 'Édits auto · Sonnet'],
  ['Premier projet', 'atlas-web'],
  ['Premier agent', 'un message, une réponse'],
  ['Statistiques', 'partagées ou non'],
];
function cLine(cur, o = {}) {
  const st = C_STATIONS.map(([n, s], i) => {
    const k = (o.skipped ?? []).includes(i) ? 'skip' : i < cur ? 'done' : i === cur ? 'cur' : 'todo';
    return `<div class="st ${k}"><span class="nd"><i></i></span><span class="nm">${n}</span><span class="sub">${k === 'skip' ? 'passé · à reprendre' : k === 'cur' ? 'maintenant' : s}</span></div>`;
  }).join('');
  const lanes = ['--lane-1', '--lane-2', '--lane-3', '--lane-4', '--lane-5'];
  const fan = `<div class="fan"><svg width="220" height="70" aria-hidden="true">${lanes.map((l, i) => `<path d="M1 0 C 1 30, ${30 + i * 36} 26, ${30 + i * 36} 66" style="stroke:var(${l})"/>`).join('')}</svg></div>`;
  return `<nav class="cline" aria-label="Le parcours"><div class="brand"><span class="logo-tile">${ic('agents', 16)}</span><span style="display:grid"><b>Premier lancement</b><span>6 stations · environ 2 minutes</span></span></div>
    <div class="stations">${st}</div>${fan}
    <div style="display:grid;gap:4px;margin-left:2px;font-size:12px;color:var(--muted)"><span style="color:var(--soft);font-weight:600">Ensuite : À découvrir</span><span>Planifier · Coder · Relire · Livrer · Piloter</span></div>
    <div class="later"><span>Tout se passe et se reprend. Le parcours revient depuis Aide › Premier lancement.</span></div></nav>`;
}
function cShell(cur, body, foot, o = {}) {
  return `<div class="win full">${titlebar()}<div class="cbody">${cLine(cur, o)}<main class="cmain">${body}${foot}</main></div><div class="status"><span>Escouade 2.3.0</span><span class="sp">${o.account ?? 'Aucun compte encore'}</span></div></div>`;
}
const cFoot = (primary, o = {}) => `<div class="cfoot">${o.back === false ? '' : `<span class="btn quiet">${ic('left', 13)}Retour</span>`}<span class="keys narrow-hide"><kbd>↑</kbd><kbd>↓</kbd> choisir · <kbd>Entrée</kbd> valider</span><span class="sp"></span><span class="btn quiet">Plus tard</span><span class="btn primary lg">${primary}${ic('right', 13)}</span></div>`;
const C = {
  harness() {
    const rows = HARNESSES.map((h) => `<div class="choice ${h.rec ? 'on' : ''} ${h.state === 'no' ? 'dis' : ''}"><span class="rd"></span>
      <span class="t"><b>${h.name}</b>${h.ver ? `<span class="ver">${h.ver}</span>` : ''}${h.rec ? '<span class="pill rec">Recommandé</span>' : ''}</span>
      <span class="state ${h.state}">${h.state === 'ok' ? ok(12) : ''}${h.stateText}</span>
      ${h.cmd ? `<div class="x"><span class="cmd"><span>${h.cmd}</span><span class="btn sm">${ic('copy', 12)}Copier</span></span></div>` : ''}</div>`).join('');
    return cShell(0, `<div class="cq"><div class="q"><div class="ord"><span class="ln"></span>Station 1 · le harness</div>
      <h1>Avec quel harness tes agents travaillent-ils ?</h1>
      <p class="why">Un harness est le programme d’agent de code de ta machine. Escouade le lance et le pilote ; il garde ta connexion et tes réglages.</p>
      <div class="choices">${rows}</div></div></div>`, cFoot('Continuer', { back: false }));
  },
  modes() {
    const rows = MODES.map(([id, l, d, rec, dis]) => `<div class="choice ${rec ? 'on' : ''} ${dis ? 'dis' : ''}"><span class="rd"></span><span class="t"><b>${l}</b>${rec ? '<span class="pill rec">Recommandé</span>' : ''}</span>
      ${dis ? `<span class="state">${ic('lock', 12)}Éteint</span>` : '<span></span>'}<span class="d">${d}</span></div>`).join('');
    return cShell(2, `<div class="cq"><div class="q"><div class="ord"><span class="ln"></span>Station 3 · les réglages de départ</div>
      <h1>Quand tes agents doivent-ils te demander ?</h1>
      <p class="why">Le mode des nouveaux agents ; tu le changes pour chacun. Modèle Sonnet, effort moyen : ceux de ton compte.</p>
      <div class="choices">${rows}</div></div></div>`, cFoot('Continuer'), { account: 'Claude · toi@exemple.dev' });
  },
  projet() {
    const rows = PROJECTS.map(([i, l, d], k) => `<div class="choice ${k === 0 ? 'on' : ''}"><span class="rd"></span><span class="t">${ic(i, 14)}<b>${l}</b>${k === 0 ? '<span class="pill rec">Recommandé</span>' : ''}</span><span></span><span class="d">${d}</span>
      ${k === 0 ? `<div class="x"><span class="cmd" style="font-family:inherit"><span class="mono">~/dev/atlas-web</span><span class="btn sm">Parcourir…</span></span></div>` : ''}</div>`).join('');
    const branchDiagram = `<svg width="100%" height="64" viewBox="0 0 560 64" preserveAspectRatio="xMinYMid meet" aria-label="Le dépôt sur main, deux agents chacun sur sa branche" style="max-width:560px">
      <path d="M8 14 H552" style="stroke:var(--lane-main);stroke-width:2;fill:none"/>
      <path d="M90 14 C 110 14, 110 40, 130 40 H 330" style="stroke:var(--lane-1);stroke-width:2;fill:none"/>
      <path d="M200 14 C 220 14, 220 56, 240 56 H 470" style="stroke:var(--lane-2);stroke-width:2;fill:none"/>
      <circle cx="40" cy="14" r="5" style="fill:var(--lane-main)"/><circle cx="330" cy="40" r="5" style="fill:var(--lane-1)"/><circle cx="470" cy="56" r="5" style="fill:var(--lane-2)"/>
      <text x="48" y="10" style="font:500 11px 'Inter Variable',Inter,sans-serif;fill:var(--muted)">main</text><text x="342" y="44" style="font:500 11px 'Inter Variable',Inter,sans-serif;fill:var(--muted)">agent « export-csv » · son worktree</text>
      <text x="482" y="60" style="font:500 11px 'Inter Variable',Inter,sans-serif;fill:var(--muted)">agent 2</text></svg>`;
    return cShell(3, `<div class="cq"><div class="q"><div class="ord"><span class="ln"></span>Station 4 · le premier projet</div>
      <h1>Où travaille ton premier agent ?</h1>
      <p class="why">Un projet est un dossier, avec ses agents, son Kanban et ses docs. Chaque agent y travaille dans son worktree, sur sa branche : deux agents ne se gênent pas, et rien n’entre dans ta branche sans toi.</p>
      ${branchDiagram}
      <div class="choices">${rows}</div></div></div>`, cFoot('Ouvrir le projet'), { account: 'Claude · toi@exemple.dev' });
  },
  agent() {
    const live = `<div class="live"><div class="chead"><b>tests-qui-cassent</b><span class="meta">${ic('branch', 12)}<span class="mono ell">escouade/tests-qui-cassent</span></span></div>${conversation({ starter: 1, stream: true, perm: true })}${composer()}</div>`;
    return cShell(4, `<div class="cagent"><div class="cq"><div class="q"><div class="ord"><span class="ln"></span>Station 5 · le premier agent</div>
      <h1>Ton agent te demande la permission</h1>
      <p class="why">Il a lu le dépôt et veut lancer les tests. En Édits auto, chaque commande te demande : <b style="color:var(--text)">Autoriser</b> cette fois, <b style="color:var(--text)">Toujours</b> pour cette commande dans ce projet, ou <b style="color:var(--text)">Refuser</b> pour qu’il cherche autrement.</p>
      <p class="why extra">Ton message est parti sur ton compte Claude Code et compte dans son quota. Plus tard, une demande comme celle-ci fait clignoter la carte de l’agent ; Ctrl J t’y amène.</p></div></div>${live}</div>`,
      cFoot('Continuer'), { account: 'Claude · toi@exemple.dev · 5 h 3 %' });
  },
  decouverte() {
    const elbow = (last) => `<span class="elbow" aria-hidden="true"><svg width="30" height="96">${last ? '' : '<path d="M0 0 V96" style="stroke:var(--lane-main);opacity:.7"/>'}<path d="M0 0 C0 15, 6 15, 30 15" style="stroke:var(--lc)"/></svg></span>`;
    const lanes = `<div class="trunk-head"><span></span><span class="o"><i></i></span><span class="t">Installé · harness, compte, projet, premier agent</span></div>` +
      DISCOVER.map(([n, lc, stops], i) => `<div class="lane" style="--lc:var(--${lc})"><span class="ln"><i></i>${n}</span>${elbow(i === DISCOVER.length - 1)}<div class="track">${stops.map(([t, k, m]) => `<div class="stop ${k ?? ''}"><span class="o"><i></i></span><span class="t">${t}</span><span class="m">${m}</span></div>`).join('')}</div></div>`).join('');
    const detail = `<aside class="detail"><h2>${ic('mic', 16)}Dicter un message</h2>
      <p>Maintiens le micro sous le message, parle, relâche : ton texte arrive dans le champ, prêt à relire.</p>
      <div class="facts"><div>${ic('download', 13)}<span>Whisper « base », 148 Mo, téléchargé une fois quand tu cliques.</span></div><div>${ic('lock', 13)}<span>Transcrit sur ta machine : rien de ce que tu dis n’en sort.</span></div><div>${ic('globe', 13)}<span>Ou un service en ligne, avec ta clé, dans Réglages › Voix.</span></div></div>
      <div class="acts"><span class="btn primary">${ic('mic', 13)}Essayer</span><span class="btn quiet">Écarter</span></div></aside>`;
    return `<div class="win wide">${titlebar('atlas-web')}${rail({ tiles: '<span class="tile">AW</span>', help: 'on' })}<div class="main">
      <div class="map"><div class="lanes"><div class="mh"><h1>À découvrir</h1><span>2 sur 17 · chaque station t’amène au vrai geste</span><span class="sp btn sm quiet">Tout masquer</span></div>${lanes}
      <div class="legend"><span><i class="f"></i>fait</span><span><i></i>à essayer</span><span><i style="box-shadow:inset 0 0 0 2px var(--line-3)"></i>pas sur ce poste</span></div></div>${detail}</div>
      </div>${statusbar({ active: 1, quota: '11 %' })}</div>`;
  },
};

/* ───────── Rendu ───────── */
const DIRS = { a: A, b: B, c: C };
document.getElementById('app').innerHTML = (DIRS[D][ROUTE] ?? DIRS[D].harness)();

// A : le fil, du bouton du guide à la vraie chose dans la fenêtre.
function drawThread() {
  const svg = document.getElementById('thread');
  const sel = A_TARGET[ROUTE];
  if (!svg || !sel) return;
  const to = document.querySelector(sel);
  const from = document.querySelector('#gcur .k');
  if (!to || !from) return;
  to.classList.add('target');
  const w = document.querySelector('.win').getBoundingClientRect();
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
  // Le fil court dans les gouttières, en angles arrondis comme les voies du git graph : il longe le bord du guide, puis
  // rejoint la cible par la droite, ou par-dessous quand elle est dans le compositeur (rien de lu n'est barré).
  const g = document.querySelector('.guide').getBoundingClientRect();
  const r = 8, x1 = a.left - w.left - 2, y1 = a.top - w.top + a.height / 2, gx = g.left - w.left - 4;
  const comp = to.closest('.composer');
  let d;
  if (comp) {
    const c = comp.getBoundingClientRect();
    const yb = c.bottom - w.top + 7, x2 = b.left - w.left + b.width / 2, y2 = b.bottom - w.top + 3;
    d = `M${x1} ${y1} H${gx + r} Q${gx} ${y1} ${gx} ${y1 + r} V${yb - r} Q${gx} ${yb} ${gx - r} ${yb} H${x2 + r} Q${x2} ${yb} ${x2} ${yb - r} V${y2}`;
    svg.innerHTML = `<path d="${d}"/><circle class="end" cx="${x2}" cy="${y2}" r="3.5"/>`;
  } else {
    const x2 = b.right - w.left + 6, y2 = b.top - w.top + Math.min(b.height / 2, 24), down = y2 > y1 ? 1 : -1;
    d = Math.abs(y2 - y1) < 2 * r ? `M${x1} ${y1} H${x2}` : `M${x1} ${y1} H${gx + r} Q${gx} ${y1} ${gx} ${y1 + r * down} V${y2 - r * down} Q${gx} ${y2} ${gx - r} ${y2} H${x2}`;
    svg.innerHTML = `<path d="${d}"/><circle class="end" cx="${x2}" cy="${y2}" r="3.5"/>`;
  }
}
// B : la bulle et son halo, posés sur la vraie chose.
function placeTip() {
  const spec = B_TARGET[ROUTE];
  const tip = document.getElementById('tip'), halo = document.getElementById('halo');
  if (!spec || !tip) return;
  const to = document.querySelector(spec[0]);
  const w = document.querySelector('.win').getBoundingClientRect();
  const b = to.getBoundingClientRect();
  Object.assign(halo.style, { left: `${b.left - w.left - 2}px`, top: `${b.top - w.top - 2}px`, width: `${b.width + 4}px`, height: `${b.height + 4}px` });
  if (spec[1] === 'right') {
    const left = Math.min(b.right - w.left + 18, w.width - tip.offsetWidth - 12);
    const overlap = left < b.right - w.left + 18;
    if (overlap) { // Pas la place à droite : la bulle passe sous la carte, la flèche en haut.
      tip.classList.remove('left'); tip.classList.add('up');
      tip.style.left = `${b.right - w.left - tip.offsetWidth}px`; tip.style.top = `${b.bottom - w.top + 14}px`;
      tip.style.setProperty('--ax', `${tip.offsetWidth - 40}px`);
    } else { tip.style.left = `${left}px`; tip.style.top = `${b.top - w.top}px`; }
  } else {
    // Au-dessus du compositeur qui porte le bouton, la flèche sur le bouton.
    const box = to.closest('.composer')?.getBoundingClientRect() ?? b;
    const left = Math.max(12, b.left - w.left + b.width / 2 - tip.offsetWidth + 34);
    tip.style.left = `${left}px`;
    tip.style.top = `${box.top - w.top - tip.offsetHeight - 12}px`;
    tip.style.setProperty('--ax', `${b.left - w.left + b.width / 2 - left - 6}px`);
    halo.style.top = `${b.top - w.top - 2}px`;
  }
}
document.fonts.ready.then(() => { if (D === 'a') drawThread(); if (D === 'b') placeTip(); });
</script>
