[package]
name = "escouade"
version = "2.2.0-beta.14"
description = "Le poste de pilotage de tes agents Claude Code"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
# The app; `escouade-hook` and `escouade-plugin` (src/bin) are the other programs the installers ship beside it.
default-run = "escouade"

[features]
# ONNX Runtime loaded from a library at run time, as on Intel Macs and Linux: to try that path elsewhere
# (`ESCOUADE_ORT_DYLIB` names the library).
ort-dynamic = ["escouade-voice-local/ort-dynamic"]

[lib]
name = "escouade_lib"
# The app and its bins link the rlib alone. The staticlib and cdylib of Tauri's template are for iOS and Android,
# which Escouade does not target: the debug cdylib's program database had grown past the MSVC linker's limit
# (LNK1140, 2026-10-28).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "unstable"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# The versions of the updater's latest.json, to leave the betas out unless « Recevoir les versions bêta » is on.
semver = "1"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
anyhow = "1"
glob = "0.3"
parking_lot = "0.13"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
portable-pty = "0.9"
notify = "8"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
base64 = "0.23"
log = "0.4"
# The system's language, in the usage statistics (`telemetry`).
sys-locale = "0.3"
trash = "5"
# The system's name and version, in the usage statistics (`telemetry`).
os_info = { version = "3", default-features = false }
# The name of a Claude account's macOS keychain entry: Claude Code's own hash of its folder, in NFC.
sha2 = "0.11"
# The protocol spoken to the plugins, shared with the plugins in Rust (`plugins/`, the kit).
escouade-plugin-protocol = { path = "../crates/escouade-plugin-protocol" }
# The ACP client (PLG-6), which the core's ACP harnesses share until they come out in process (INT-10).
escouade-acp = { path = "../crates/escouade-acp" }
escouade-voice = { path = "../crates/escouade-voice" }
# What `escouade-plugin` does without the app's host, which the store's image builds alone (ESC-328): the manifest's
# reader and the compiler of the `run.js` plugins.
escouade-plugin-cli = { path = "../crates/escouade-plugin-cli" }
# The contract of a code host and its errors, shared with the Rust plugins of the first hand (docs/PLUGINS-DESIGN.md §4.5).
escouade-plugin-kit = { path = "../crates/escouade-plugin-kit" }
# No plugin is linked (docs/PLUGINS-DESIGN.md §8.2): the harnesses' views go through their modules (`view/translate`).
unicode-normalization = "0.1"
# The MCP server (« Claude et les agents peuvent piloter Escouade »): the official SDK, its Streamable HTTP
# transport served by hyper on the loopback (its guards and the tokens, compared in constant time: `escouade-mcp`).
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
http-body-util = "0.1"
# Its tokens: 32 bytes from the system's random generator.
getrandom = "0.4"
# « Codex peut piloter Escouade »: its entry in each account's `config.toml`, the user's comments and layout kept.
toml_edit = "0.25"
# What every part stands on (the languages written in now, the guards of the paths), and the parts of the app cut out of
# its crate for it to compile faster (docs/CRATES.md).
escouade-base = { path = "../crates/escouade-base" }
# The data (`model`, `paths`, `proc`, `job`, `wsl`, `heat`, `pricing`, and the types they name).
escouade-model = { path = "../crates/escouade-model" }
# What an agent is getting through (`plan`, `planfiles`).
escouade-plan = { path = "../crates/escouade-plan" }
# The voice on the machine (`voice`): the microphone (cpal), the dictation (whisper.cpp), the reading (Piper, eSpeak NG,
# ONNX Runtime) and their models, in a crate of the workspace (docs/CRATES.md).
escouade-voice-local = { path = "../crates/escouade-voice-local" }
# The vectors of « Recherche par le sens » (`vectors`), in a crate of the workspace too.
escouade-vectors = { path = "../crates/escouade-vectors" }
# The parts of the harnesses that stand without the app (where their programs are, the user configs Escouade edits,
# Claude Code's sign-in, a subagent's transcript: `engine::{program, jsonc, userconfig, mcp}`, `agent::sidechain`, `which`).
escouade-engines = { path = "../crates/escouade-engines" }
# The host of the plugins (`plugins`, but for its links with the core, the agents and the terminals), and whom the TLS
# connections trust (`tls`).
escouade-plugins = { path = "../crates/escouade-plugins" }
# The code hosts and the ticket sources: their contract, their accounts and secrets, the adapters of their plugins.
escouade-forge = { path = "../crates/escouade-forge" }
# What the app learns of a request of the updater that failed (`updates::net`).
escouade-updates = { path = "../crates/escouade-updates" }
# The parts of the MCP server that stand without the app: its transport, the tokens and the port, the tools' arguments
# (docs/CRATES.md, § 13).
escouade-mcp = { path = "../crates/escouade-mcp" }
# The transcription as one speaks (ESC-136): a WebSocket to the service, through the settings' proxy (HTTP CONNECT,
# opened by hand) and TLS by rustls (ring, as reqwest), the system's roots and Mozilla's.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
yaml-edit = "0.3"
# The text of the documents of the drive (ESC-260), read on the machine: PDF by pdf-extract, Word (.docx) and
# OpenDocument (.odt) by their XML inside the zip.
pdf-extract = "0.12"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
tauri-winrt-notification = "0.8"
# The path of a file the page hands the window (`fileorigin`): WebView2's own COM interfaces, in the
# versions Tauri's wry already uses (`windows-core` for `Interface::cast`, which webview2-com does not re-export).
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The image of a paste, which WebKitGTK does not give the page: read from GTK's clipboard (the one
# Tauri's windows already run on).
gtk = "0.18"
# The end of the page's process (`pagecrash`), on the WebView wry makes: its version.
webkit2gtk = { version = "2.0", features = ["v2_20"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notification = "2"
# The inspector of a launch's page in a window of its own (`devpage::open_devtools`): wry's version.
objc2 = "0.6"

# The dependencies keep their line tables only (backtraces still say where), Escouade its full debug info: with
# everything in full, the program database of the debug build went over the MSVC linker's limit (LNK1140, 2026-10-28,
# when the drive's PDF and Word readers came in).
# The crates of the plugins build and test with the app (one lock, one target): the protocol, the kit of the Rust plugins,
# the ACP client and the voice; the plugins themselves are the workspace of `plugins/` (docs/PLUGINS-DESIGN.md §8.6.3).
[workspace]
members = [
    "../crates/escouade-plugin-protocol",
    "../crates/escouade-plugin-cli",
    "../crates/escouade-plugin-kit",
    "../crates/escouade-acp",
    "../crates/escouade-voice",
    "../crates/escouade-base",
    "../crates/escouade-plan",
    "../crates/escouade-voice-local",
    "../crates/escouade-vectors",
    "../crates/escouade-model",
    "../crates/escouade-engines",
    "../crates/escouade-plugins",
    "../crates/escouade-forge",
    "../crates/escouade-updates",
    "../crates/escouade-mcp",
]
default-members = [
    ".",
    "../crates/escouade-plugin-protocol",
    "../crates/escouade-plugin-cli",
    "../crates/escouade-plugin-kit",
    "../crates/escouade-acp",
    "../crates/escouade-voice",
    "../crates/escouade-base",
    "../crates/escouade-plan",
    "../crates/escouade-voice-local",
    "../crates/escouade-vectors",
    "../crates/escouade-model",
    "../crates/escouade-engines",
    "../crates/escouade-plugins",
    "../crates/escouade-forge",
    "../crates/escouade-updates",
    "../crates/escouade-mcp",
]

# The plugins depend on the kit by version, as the store reads them (their folder, published crates, the checksum of their
# own Cargo.lock: docs/PLUGINS-DESIGN.md §8.6.3). Here, development goes on against the kit of this tree. Bump a crate's version
# with the plugins' requirement in one commit: a patch that no longer matches is dropped by cargo.
[patch.crates-io]
escouade-plugin-protocol = { path = "../crates/escouade-plugin-protocol" }
escouade-plugin-kit = { path = "../crates/escouade-plugin-kit" }
escouade-acp = { path = "../crates/escouade-acp" }
escouade-voice = { path = "../crates/escouade-voice" }

[profile.dev.package."*"]
debug = "line-tables-only"

# wasmtime's compiler (a dependency of `escouade-plugins`; a profile is the workspace's, so here), optimized in a build of
# development and the tests too: unoptimized, Cranelift takes 10 to 30 s for
# each module of a plugin in run.wasm, and every test whose core starts the plugins of the registry compiles theirs (the
# CI's Linux tests went from 15 to 27 min with P1, ESC-344).
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwinding (the default) keeps a panicking background task from taking every agent down.
strip = true

[dev-dependencies]
# The WAV files of the tests of the voice.
hound = "3.5"
# Each test process's temporary folder of its own, given before `main` (`src/test_tmp.rs`).
ctor = "1"
tauri = { version = "2", features = ["test", "tray-icon", "image-png", "devtools", "unstable"] }
# An https server with a self-signed certificate (a corporate proxy's), for the TLS settings.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# A real MCP client against the app's server.
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
# The data the tests build (`NotifyFor::all_but`, `EngineId::BENCH`, `proc::output_in_files`…).
escouade-model = { path = "../crates/escouade-model", features = ["testing"] }
# The harnesses as the tests have them: no program of the machine found, no keychain read (`locate`, `signin`).
escouade-engines = { path = "../crates/escouade-engines", features = ["testing"] }
# The modules and the archives the tests of the plugins make by hand (those that stay here: a `core`, the fake services).
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation", "call-hook"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
# The host as the tests start it (the secrets in memory, the runtime of the workspace's plugins, the fake isola).
escouade-plugins = { path = "../crates/escouade-plugins", features = ["testing"] }
# The hosts and the sources as the tests have them (the secrets in memory, the fake services, a host served by its plugin).
escouade-forge = { path = "../crates/escouade-forge", features = ["testing"] }
# The fake server of the updates (`updates::fake_server`), for the tests of the updater that stay here.
escouade-updates = { path = "../crates/escouade-updates", features = ["testing"] }
escouade-mcp = { path = "../crates/escouade-mcp", features = ["testing"] }
