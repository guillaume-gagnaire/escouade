[package]
name = "escouade"
version = "2.1.2"
description = "Le poste de pilotage de tes agents Claude Code"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
# The app; `escouade-hook`, `escouade-plugin` and `escouade-plugins` (src/bin) are the other programs the installers ship
# beside it.
default-run = "escouade"

[features]
# ONNX Runtime loaded from a library at run time, as on Intel Macs and Linux: to try that path elsewhere
# (`ESCOUADE_ORT_DYLIB` names the library).
ort-dynamic = ["ort/load-dynamic"]

[lib]
name = "escouade_lib"
# The app and its bins link the rlib alone. The staticlib and cdylib of Tauri's template are for iOS and Android,
# which Escouade does not target: the debug cdylib's program database had grown past the MSVC linker's limit
# (LNK1140, 2026-10-28).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "unstable"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
anyhow = "1"
glob = "0.3"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
portable-pty = "0.9"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
base64 = "0.22"
log = "0.4"
# The system's language, in the usage statistics (`telemetry`).
sys-locale = "0.3"
trash = "5"
# The system's name and version, in the usage statistics (`telemetry`).
os_info = { version = "3", default-features = false }
# The name of a Claude account's macOS keychain entry: Claude Code's own hash of its folder, in NFC.
sha2 = "0.10"
# The store's signatures of the verified plugins (docs/STORE.md §4.5), as the updater checks its own.
minisign-verify = "0.2"
# The protocol spoken to the plugins, shared with `escouade-plugins`, the program of the plugins the app gives (INT-4).
escouade-plugin-protocol = { path = "../crates/escouade-plugin-protocol" }
# The ACP client (PLG-6), which the core's ACP harnesses share until they come out in process (INT-10).
escouade-acp = { path = "../crates/escouade-acp" }
escouade-voice = { path = "../crates/escouade-voice" }
# What `escouade-plugin` does without the app's host, which the store's image builds alone (ESC-328): the manifest's
# reader and the compiler of the `run.js` plugins.
escouade-plugin-cli = { path = "../crates/escouade-plugin-cli" }
# The contract of a code host and its errors, shared with the Rust plugins of the first hand (docs/PLUGINS.md §4.5).
escouade-plugin-kit = { path = "../crates/escouade-plugin-kit" }
# The plugins of `escouade-plugins` (its entries): the core runs none of their code, it starts their process.
# OpenCode (INT-10.2): its harness in a crate, its `opencode serve` run by the core (`Launch::shared`).
# A module since its port (docs/PLUGINS.md §8.23): what is linked is its rules and its translation, for « Vue OpenCode » and
# the accounts, until P8 (§8.2). It stays a member of the workspace of `plugins/`.
escouade-plugin-opencode = { path = "../plugins/opencode" }
# Copilot CLI and Codex: modules, whose translation the core's « Vue Copilot » and « Vue Codex » read as a library, with
# their rules, until P8. They are members of the workspace of `plugins/`, not of this one.
escouade-plugin-copilot = { path = "../plugins/copilot" }
escouade-plugin-codex = { path = "../plugins/codex" }
escouade-plugin-agy = { path = "../plugins/antigravity" }
# Claude Code (INT-10.5): the core reads its view's transcript, an account's sign-in and quota through its code, as a library.
escouade-plugin-claude = { path = "../plugins/claude" }
# A version's archive from the store (STORE-9): read in memory, its links and climbing paths refused.
flate2 = "1"
tar = { version = "0.4", default-features = false }
unicode-normalization = "0.1"
# The MCP server (« Claude et les agents peuvent piloter Escouade »): the official SDK, its Streamable HTTP
# transport served by hyper on the loopback, the bearer tokens compared in constant time.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
http-body-util = "0.1"
subtle = "2.6"
# Its tokens: 32 bytes from the system's random generator.
getrandom = "0.4"
# « Codex peut piloter Escouade »: its entry in each account's `config.toml`, the user's comments and layout kept.
toml_edit = "0.25"
# Dictation (`voice`): the microphone through cpal (WASAPI, CoreAudio, ALSA), transcribed on the
# machine by whisper.cpp (whisper-rs builds it, with cmake), its model downloaded on demand.
cpal = "0.18"
whisper-rs = { version = "0.16", features = ["log_backend"] }
# The transcription as one speaks (ESC-136): a WebSocket to the service, through the settings' proxy (HTTP CONNECT,
# opened by hand) and TLS by rustls (ring, as reqwest), the system's roots and Mozilla's.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# A WAV file as the sound source: the end-to-end tests, which have no microphone.
hound = "3.5"
# The conversation (`voice::speech`): Piper's voices read on the machine. The text becomes phonemes through eSpeak NG
# (its port to Rust, GPL-3.0-or-later, the data of French and English built in), which the voice's VITS model, run by
# ONNX Runtime, turns into sound.
espeak-ng = { version = "0.2", default-features = false, features = ["bundled-data-fr", "bundled-data-en"] }
yaml-edit = "0.3"
# The text of the documents of the drive (ESC-260), read on the machine: PDF by pdf-extract, Word (.docx) and
# OpenDocument (.odt) by their XML inside the zip.
pdf-extract = "0.12"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
# The JS/TS plugins (`run.js`, ESC-320, docs/PLUGINS.md §5): their module compiled by Javy, run by wasmtime in the
# app's process (Cranelift, WASI preview 1 alone: no folder, no socket, only the three standard streams).
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p1"] }
bytes = "1"

# The embeddings of `vectors` (ESC-252): the model's own tokenizer (HF tokenizer.json), no regex engine to build (fancy-regex).
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }

# ONNX Runtime, linked in statically on Windows and Apple Silicon (pyke's builds, downloaded by its build script). Pyke
# builds none for Intel Macs, and its Linux one needs glibc 2.38: there Microsoft's own library (1.23.2, glibc 2.27) is
# shipped in the bundle (scripts/onnxruntime.sh, tauri.ort-<os>.conf.json) and loaded at run time.
[target.'cfg(any(windows, all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-22"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Media_Audio", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
tauri-winrt-notification = "0.7"
# The integrations' secrets in the Credential Manager. Its own store only: neither the fallback
# that keeps them in memory (lost at the next start) nor Linux's secret-service.
keyring = { version = "3.6", features = ["windows-native"] }
# The path of a file the page hands the window (`fileorigin`): WebView2's own COM interfaces, in the
# versions Tauri's wry already uses (`windows-core` for `Interface::cast`, which webview2-com does not re-export).
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The image of a paste, which WebKitGTK does not give the page: read from GTK's clipboard (the one
# Tauri's windows already run on).
gtk = "0.18"
# The end of the page's process (`pagecrash`), on the WebView wry makes: its version.
webkit2gtk = { version = "2.0", features = ["v2_20"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notification = "2"
# The inspector of a launch's page in a window of its own (`devpage::open_devtools`): wry's version.
objc2 = "0.6"
# Dictation on the GPU (Metal), whisper.cpp's shaders built into the binary.
whisper-rs = { version = "0.16", features = ["log_backend", "metal"] }
# The integrations' secrets in the Keychain.
keyring = { version = "3.6", features = ["apple-native"] }

# The dependencies keep their line tables only (backtraces still say where), Escouade its full debug info: with
# everything in full, the program database of the debug build went over the MSVC linker's limit (LNK1140, 2026-10-28,
# when the drive's PDF and Word readers came in).
# The crates of the plugins Escouade gives build and test with the app (one lock, one target): the protocol, the kit of
# the Rust plugins, and each plugin of `escouade-plugins` (docs/PLUGINS.md §4.3).
[workspace]
members = [
    "../crates/escouade-plugin-protocol",
    "../crates/escouade-plugin-cli",
    "../crates/escouade-plugin-kit",
    "../crates/escouade-acp",
    "../crates/escouade-voice",
]
default-members = [
    ".",
    "../crates/escouade-plugin-protocol",
    "../crates/escouade-plugin-cli",
    "../crates/escouade-plugin-kit",
    "../crates/escouade-acp",
    "../crates/escouade-voice",
]

# The plugins depend on the kit by version, as the store reads them (their folder, published crates, the checksum of their
# own Cargo.lock: docs/PLUGINS.md §8.6.3). Here, development goes on against the kit of this tree. Bump a crate's version
# with the plugins' requirement in one commit: a patch that no longer matches is dropped by cargo.
[patch.crates-io]
escouade-plugin-protocol = { path = "../crates/escouade-plugin-protocol" }
escouade-plugin-kit = { path = "../crates/escouade-plugin-kit" }
escouade-acp = { path = "../crates/escouade-acp" }
escouade-voice = { path = "../crates/escouade-voice" }

[profile.dev.package."*"]
debug = "line-tables-only"

# wasmtime's compiler, optimized in a build of development and the tests too: unoptimized, Cranelift takes 10 to 30 s for
# each module of a plugin in run.wasm, and every test whose core starts the plugins of the registry compiles theirs (the
# CI's Linux tests went from 15 to 27 min with P1, ESC-344).
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwinding (the default) keeps a panicking background task from taking every agent down.
strip = true

[dev-dependencies]
# Each test process's temporary folder of its own, given before `main` (`src/test_tmp.rs`).
ctor = "1"
tauri = { version = "2", features = ["test", "tray-icon", "image-png", "devtools", "unstable"] }
# An https server with a self-signed certificate (a corporate proxy's), for the TLS settings.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# A real MCP client against the app's server.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
