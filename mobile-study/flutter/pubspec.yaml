name: escouade_flutter
description: "ESC-445 : la maquette mobile en Flutter (le Rust commun par flutter_rust_bridge)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  escouade_flutter_rust:
    path: rust_builder
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_rust_bridge: 2.13.0
  highlight: ^0.7.0
  http: ^1.6.0
  local_auth: ^3.0.2
  material_ui: ^1.1.0
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/texts/
