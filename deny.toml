# cargo-deny, for the app (`cd src-tauri && cargo deny check advisories`) and for the plugins' workspace
# (`cd plugins && cargo deny check advisories`); the CI runs both on every pull request, on main and every night
# (.github/workflows/advisories.yml, ESC-422). Started from the one of the security audit of 2026-11
# (docs/security/audit-2026-11/tools/deny.toml, SEC-02).
#
# An advisory is closed by updating the crate. When no compatible update closes it, it is ignored below with the
# reason, and the ignore leaves with the dependency that carries it: a new advisory fails the job. How soon an advisory
# must be closed (7 days for a high one) is in docs/SECURITY-DEPENDENCIES.md (SEC-04 of the security audit).

[graph]
all-features = false

[advisories]
yanked = "warn"
ignore = [
    # zip 4.6.1 (reasons written again after SEC-04 of the security audit, which found the first ones described the app's
    # own zip rather than the one that carries the advisories): the app's own zip is 9 (docsextract.rs); zip 4 comes only from tauri-plugin-updater 2.13.1, the
    # latest 2.x (`zip = "4"`, Windows only, without default features). It opens an archive only after the update's
    # minisign signature was checked against the app's key (updater.rs:837, before `install`), and only if that signed
    # file is a zip: the Windows update is the NSIS setup.exe (createUpdaterArtifacts = true), never a zip
    # (docs/SECURITY-DEPENDENCIES.md). They leave with the updater's move to zip >= 9.0.5.
    { id = "RUSTSEC-2026-0367", reason = "zip 4.6.1 comes only from tauri-plugin-updater 2.13.1 (Windows; the app's own zip is 9): its ZipArchive::extract runs only on an update that is a zip and signed with the app's key, and the Windows update is the NSIS setup.exe; no updater 2.x on zip 9" },
    { id = "RUSTSEC-2026-0368", reason = "zip 4.6.1 comes only from tauri-plugin-updater 2.13.1 (Windows; the app's own zip is 9): its ZipArchive::extract runs only on an update that is a zip and signed with the app's key, and the Windows update is the NSIS setup.exe; no updater 2.x on zip 9" },
    { id = "RUSTSEC-2026-0369", reason = "zip 4.6.1 comes only from tauri-plugin-updater 2.13.1 (Windows; the app's own zip is 9): its ZipArchive::extract runs only on an update that is a zip and signed with the app's key, and the Windows update is the NSIS setup.exe; no updater 2.x on zip 9" },
    { id = "RUSTSEC-2026-0429", reason = "zip 4.6.1 comes only from tauri-plugin-updater 2.13.1 (Windows; the app's own zip is 9): its ZipArchive::extract runs only on an update that is a zip and signed with the app's key, and the Windows update is the NSIS setup.exe; no updater 2.x on zip 9" },
    { id = "RUSTSEC-2026-0545", reason = "zip 4 (tauri-plugin-updater) is built without aes-crypto (default-features = false): no AES entry can be read; no updater 2.x on zip 9" },
    { id = "RUSTSEC-2026-0548", reason = "zip 4 (tauri-plugin-updater) never uses ZipStreamReader, only ZipArchive (updater.rs:1074), on a zip signed with the app's key; no updater 2.x on zip 9.0.5" },
    # chrono: an "unmaintained" notice, no known flaw, no fixed version. It is in the app, five of our crates (two
    # published) and rmcp/schemars: its replacement is weighed in docs/SECURITY-DEPENDENCIES.md.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (no known flaw, no fixed version); used by the app, our crates, rmcp and schemars; replacement weighed in docs/SECURITY-DEPENDENCIES.md" },
    # Crates no longer maintained, pulled by Tauri, GTK and zbus (Linux): no fixed version exists; they follow the
    # dependencies that bring them.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained (pulled by wgpu, tauri); no fixed version, no known flaw" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained (pulled by gtk3-rs through tauri on Linux); no fixed version, build-time only" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained (font code of a dependency); no fixed version, no known flaw" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (zbus, Linux); no fixed version, no known flaw" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (zbus, Linux); no fixed version, no known flaw" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (zbus, Linux); no fixed version, no known flaw" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "Unlicense",
    "NCSA",
    "bzip2-1.0.6",
]
