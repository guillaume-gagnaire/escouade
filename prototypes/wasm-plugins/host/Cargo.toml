[package]
name = "escouade-wasm-host"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p1"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "3", default-features = false }
sha2 = "0.10"
bytes = "1"
tokio = { version = "1", default-features = false }
