# The witness of the weights: the same crates as the hosts beside wasmtime (serde_json, ureq, sha2), no runtime.
[package]
name = "escouade-wasm-weight"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false }
sha2 = "0.10"
