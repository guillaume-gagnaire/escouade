[package]
name = "reqwest"
version = "0.12.0"
edition = "2021"
publish = false

# The part of reqwest the plugins use, over the host's `net/fetch`: their clients compile unchanged on wasm32-wasip1,
# where reqwest does not. What `escouade-plugin-kit::http` would hold.
[dependencies]
serde = "1"
serde_json = "1"
