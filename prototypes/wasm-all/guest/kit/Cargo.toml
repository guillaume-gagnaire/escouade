[package]
name = "escouade-plugin-kit"
version = "1.0.0"
edition = "2021"
publish = false

# `crates/escouade-plugin-kit` on wasm32-wasip1: every module of the real kit, read from its files, but its loop
# (`serve`, on tokio's threads), which here is a turn. No tokio.
[dependencies]
escouade-plugin-protocol = { path = "../../../../crates/escouade-plugin-protocol" }
escouade-turn = { path = "../escouade-turn" }
reqwest = { path = "../reqwest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
chrono = "0.4"
