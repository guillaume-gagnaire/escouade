[package]
name = "escouade-plugin-opencode"
version = "1.0.0"
description = "Le plugin OpenCode livré avec Escouade : OpenCode comme harness, par son serveur HTTP"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3): its program is `escouade-plugins opencode`. The core
# runs `opencode serve` for the agents of an account; this crate is its client, and translates its events.
[dependencies]
escouade-plugin-protocol = { path = "../../crates/escouade-plugin-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
getrandom = "0.4"
