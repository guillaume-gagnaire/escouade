[package]
name = "escouade-plugin-claude"
version = "1.0.0"
description = "Le plugin Claude Code livré avec Escouade : Claude Code comme harness, par son flux stream-json et son protocole de contrôle"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3): its program is `escouade-plugins claude`. It holds the
# client of `claude` (stream-json and its control protocol) and the translation of its frames, both without a process
# nor a runtime of their own, and what Claude Code keeps of an account's sign-in. The core reads them as a library for
# what stays in it: « Vue Claude Code » reads its session's transcript through that same translation
# (`src-tauri/src/agent/claude.rs`), an account's sign-in and quota read the same files (`src-tauri/src/usage.rs`).
[dependencies]
escouade-plugin-protocol = "0.1.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The name of a macOS keychain entry and the fingerprint of a sign-in: Claude Code's own hash, in NFC.
sha2 = "0.10"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["fs", "process"] }
