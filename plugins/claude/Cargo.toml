[package]
name = "escouade-plugin-claude"
version = "2.2.3"
description = "Le plugin Claude Code d'Escouade : le client de claude et la traduction de ce qu'il écrit"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

# A module, compiled by `escouade-plugin build` (docs/PLUGINS.md §8.5).
[lib]
crate-type = ["cdylib"]

[dependencies]
escouade-plugin-protocol = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
