[package]
name = "escouade-plugin-claude"
version = "2.2.0"
description = "Le plugin Claude Code livré avec Escouade : le client de claude et la traduction de ce qu'il écrit"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

# A module, compiled by `escouade-plugin build` (docs/PLUGINS.md §8.5). The `rlib` is for the core, which reads its
# translation for « Vue Claude Code » (`src-tauri/src/agent/claude.rs`) until P8.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
escouade-plugin-protocol = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
