[package]
name = "escouade-plugin-agy"
version = "2.2.5"
description = "Le plugin Antigravity CLI d'Escouade : l'agent de Google comme harness, par stream-json"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

# A module, compiled by `escouade-plugin build` (docs/PLUGINS.md §8.5). It is no ACP harness: it holds the client of `agy -p`
# in stream-json, without a process nor a runtime of its own, and puts its events in the form the ACP client reads.
[lib]
crate-type = ["cdylib"]

[dependencies]
escouade-acp = "0.1.3"
escouade-plugin-protocol = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

