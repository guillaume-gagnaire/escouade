[package]
name = "escouade-plugin-agy"
version = "2.2.0"
description = "Le plugin Antigravity CLI livré avec Escouade : l'agent de Google comme harness, par stream-json"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

# A module, compiled by `escouade-plugin build` (docs/PLUGINS.md §8.5). It is no ACP harness: it holds the client of `agy -p`
# in stream-json, without a process nor a runtime of its own, and puts its events in the form the ACP client reads. The
# `rlib` is for the core, whose « Vue Antigravity » reads its words as a library (`src-tauri/src/engine/agy/`) until P8.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
escouade-acp = "0.1.0"
escouade-plugin-protocol = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The real home of the user, which the core alone knows in a module (`words::tools_env`).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
dirs = "6"
