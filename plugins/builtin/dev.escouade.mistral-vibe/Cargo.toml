[package]
name = "escouade-plugin-vibe"
version = "1.0.0"
description = "Le plugin Mistral Vibe livré avec Escouade : Mistral Vibe comme harness, par ACP"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3): its program is `escouade-plugins vibe`, on the ACP
# client of `crates/escouade-acp` (PLG-6) with its extension `vibe`, served as the generic ACP plugin serves the
# harnesses a manifest describes. All of it is in this crate: the entry of `escouade-plugins` is a call, so that the
# harness can move into another plugin (« Mistral », with the voice) without a line of the core.
[dependencies]
escouade-plugin-acp = { path = "../dev.escouade.acp" }
