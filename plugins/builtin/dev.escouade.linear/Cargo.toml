[package]
name = "escouade-plugin-linear"
version = "1.0.0"
description = "Le plugin Linear livré avec Escouade : les issues d'une équipe dans le Kanban, ses statuts comme colonnes"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3): its program is `escouade-plugins linear`.
[dependencies]
escouade-plugin-kit = { path = "../../../crates/escouade-plugin-kit" }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
