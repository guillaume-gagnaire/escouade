[package]
name = "escouade-plugin-gitea"
version = "1.0.0"
description = "Le plugin Gitea et Forgejo livré avec Escouade : les PR, la CI (statuts et Actions), les relectures et le merge de Gitea, de Forgejo et de Codeberg"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3): its program is `escouade-plugins gitea`.
[dependencies]
escouade-plugin-kit = { path = "../../../crates/escouade-plugin-kit" }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
