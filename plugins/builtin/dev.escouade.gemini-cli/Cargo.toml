[package]
name = "escouade-plugin-gemini"
version = "1.0.0"
description = "Le plugin Gemini CLI livré avec Escouade : Gemini CLI comme harness, par ACP"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3): its program is `escouade-plugins gemini`, on the ACP
# client of `crates/escouade-acp` (PLG-6) with its extension `gemini`, served as the generic ACP plugin serves the
# harnesses a manifest describes.
[dependencies]
escouade-plugin-acp = { path = "../dev.escouade.acp" }
