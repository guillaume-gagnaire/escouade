[package]
name = "escouade-plugin-mistral"
version = "1.0.0"
description = "Le plugin Mistral livré avec Escouade : Mistral Vibe comme harness, par ACP, à côté du service de voix"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3 and §4.13): its program is `escouade-plugins mistral`,
# one process for its two sides. The voice is `voice/*`, in `escouade_lib`, as for the other voice services (INT-13);
# the harness is this crate, on the ACP client of `crates/escouade-acp` (PLG-6) with its extension `vibe`, served as
# the generic ACP plugin serves the harnesses a manifest describes. What is not `voice/*` comes here.
[dependencies]
escouade-plugin-acp = { path = "../dev.escouade.acp" }
escouade-plugin-protocol = { path = "../../../crates/escouade-plugin-protocol" }
serde_json = "1"
