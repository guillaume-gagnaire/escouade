[package]
name = "escouade-plugin-bitbucket"
version = "1.0.0"
description = "Le plugin Bitbucket Cloud livré avec Escouade : les PR, les statuts, les pipelines et leurs journaux, les commentaires et les déploiements"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3): its program is `escouade-plugins bitbucket`.
[dependencies]
escouade-plugin-kit = "0.1.0"
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
