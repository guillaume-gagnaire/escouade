# The plugins in Rust that are modules (`run.wasm`, docs/PLUGINS.md §8.6.3), as this repository compiles them: against
# `crates/`, for the tests of the app and a build of development (`sh scripts/plugins-wasm.sh`), and each `cargo test`.
#
# Each plugin keeps its own Cargo.lock, which fixes the crates published on crates.io: that is what `escouade-plugin build`
# and the store compile, from the plugin's folder alone, where this file does not exist. Cargo ignores those locks here.
# A plugin joins this list when it leaves the workspace of `src-tauri`, at its port.
[workspace]
resolver = "2"
members = ["acp", "antigravity", "azure-devops", "bitbucket", "claude", "clickup", "codex", "copilot", "cursor", "deepgram", "elevenlabs", "gemini", "gitea", "github", "gitlab", "groq", "isola", "jira", "linear", "mistral", "openai", "opencode", "trello"]

[patch.crates-io]
escouade-plugin-protocol = { path = "../crates/escouade-plugin-protocol" }
escouade-plugin-kit = { path = "../crates/escouade-plugin-kit" }
escouade-acp = { path = "../crates/escouade-acp" }
escouade-voice = { path = "../crates/escouade-voice" }

# The profile of a module (docs/PLUGINS.md §8.5.2).
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
