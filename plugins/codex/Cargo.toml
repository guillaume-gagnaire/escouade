[package]
name = "escouade-plugin-codex"
version = "2.2.3"
description = "Le plugin Codex d'Escouade : Codex d'OpenAI comme harness, par son app-server"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

# A module, compiled by `escouade-plugin build` (docs/PLUGINS.md §8.5). It is no ACP harness: it holds the client of
# `codex app-server` (JSON-RPC, one message a line) and the translation of its messages, both without a process nor a
# runtime of their own, and the price list of OpenAI's models.
[lib]
crate-type = ["cdylib"]

[dependencies]
escouade-acp = "0.1.3"
escouade-plugin-protocol = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
