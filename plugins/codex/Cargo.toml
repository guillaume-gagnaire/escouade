[package]
name = "escouade-plugin-codex"
version = "1.0.0"
description = "Le plugin Codex livré avec Escouade : Codex d'OpenAI comme harness, par son app-server"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3): its program is `escouade-plugins codex`. It is no
# ACP harness: it holds the client of `codex app-server` (JSON-RPC, one message a line) and the translation of its
# messages, both without a process nor a runtime of their own, and the price list of OpenAI's models. The core's
# « Vue Codex » reads its session's rollout through that same translation, as a library (`src-tauri/src/agent/codex.rs`).
[dependencies]
escouade-acp = { path = "../../crates/escouade-acp" }
escouade-plugin-protocol = { path = "../../crates/escouade-plugin-protocol" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
