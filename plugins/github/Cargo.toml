[package]
name = "escouade-plugin-github"
version = "2.2.3"
description = "Le plugin GitHub d'Escouade : les issues dans le Kanban, les PR, la CI, les relectures et les déploiements, sur un seul compte"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

# A module, compiled by `escouade-plugin build` (docs/PLUGINS.md §8.5).
[lib]
crate-type = ["cdylib"]

[dependencies]
escouade-plugin-kit = "0.1.1"
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }
