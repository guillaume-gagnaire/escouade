[package]
name = "escouade-plugin-acp"
version = "2.2.4"
description = "Le plugin ACP d'Escouade : les harness qui parlent ACP, décrits par un plugin sans code"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

# A module, compiled by `escouade-plugin build` (docs/PLUGINS-DESIGN.md §8.5), on the ACP client of `crates/escouade-acp` (PLG-6).
[lib]
crate-type = ["cdylib"]

[dependencies]
escouade-acp = "0.1.4"
escouade-plugin-protocol = "0.1.2"
