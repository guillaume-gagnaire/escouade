[package]
name = "escouade-plugin-acp"
version = "1.0.0"
description = "Le plugin ACP livré avec Escouade : les harness qui parlent ACP, décrits par un plugin sans code"
authors = ["Guillaume Gagnaire"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
workspace = "../../src-tauri"

# One of the plugins of `escouade-plugins` (docs/PLUGINS.md §4.3): its program is `escouade-plugins acp`, on the ACP
# client of `crates/escouade-acp` (PLG-6).
[dependencies]
escouade-acp = "0.1.0"
