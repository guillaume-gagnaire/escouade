# yaml-language-server: $schema=https://escouade.dev/schemas/escouade.schema.json
# Réglages d'Escouade partagés par l'équipe du projet : https://escouade.dev/docs/escouade-yml
version: 1
agents:
  engine: codex
private: true
worktrees:
  per_agent: true
  at_first_message: false
  base: origin/release
  dir: ../app-worktrees
  copy:
    - .env*
    - config/local.json
  setup:
    - command: npm ci
    - command: cargo fetch
      shell: bash
      cwd: src-tauri
  teardown: []
launch:
  - name: web
    command: npm run dev
    cwd: web
git:
  agent_branch_prefix: agent/
  ticket_branch_prefix: tickets/
  commit_mode: direct
  conventional_commits: false
board:
  on_approve: pr
  target_branch: develop
  merge_strategy: rebase
  draft_pr: true
  test_command: "npm test -- --grep 'a b' # all"
  tests_before_approve: true
  on_conflict: agent
  remove_worktree: false
  model: opus
  effort: high
  mode: plan
